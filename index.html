  /**
   * Sheet, das sich bei jeder Datenänderung neu zeichnet.
   * render(close) liefert den Inhalt; beim Schliessen wird abgemeldet.
   */
  function liveSheet(title, render) {
    let unsub = null;
    const { dlg } = sheet(title, (close) => {
      const host = h('div', {});
      const draw = () => {
        if (!S.snap || !dlg.open) return;
        host.replaceChildren(...[render(close)].flat(Infinity).filter(Boolean));
      };
      setTimeout(() => { draw(); unsub = State.subscribe(draw); }, 0);
      return host;
    });
    dlg.addEventListener('close', () => { if (unsub) unsub(); });
  }

  /** Text, den die App nicht herunterladen darf, zum Kopieren anzeigen */
  function copySheet(title, intro, text, onCopied) {
    sheet(title, () => {
      const ta = h('textarea', { class: 'input', id: 'copy-text', readonly: true, rows: 8, value: text, style: 'font-size:.75rem;font-family:ui-monospace,monospace' });
      return h('div', { class: 'form' }, h('p', {}, intro), ta,
        h('button', {
          type: 'button', class: 'btn btn-primary btn-wide',
          onclick: () => {
            navigator.clipboard.writeText(text)
              .then(() => { toast('Kopiert'); if (onCopied) onCopied(); })
              .catch(() => { ta.focus(); ta.select(); toast('Kopieren nicht möglich. Der Text ist markiert, kopiere ihn von Hand.', true); });
          },
        }, 'Text kopieren'));
    });
  }

  /** Datei herunterladen, in eingebetteten Ansichten als Text zum Kopieren */
  function downloadText(name, text, mime, intro) {
    if (isFramed()) { copySheet('Datei kopieren', intro, text); return; }
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  const itemById = (id) => S.snap.items.find((i) => i.id === id);
  const groupTypeOf = (item) => (S.snap.groups.find((g) => g.id === item.groupId) || {}).type;

  /* ---- Umbudgetieren ---- */
  /**
   * Antippen einer Balance: Bei Rot „Woher nehmen?“, bei Orange „Wohin damit?“,
   * bei Einnahmen die Planung an das Erhaltene anpassen.
   */
  function rebudgetSheet(itemId) {
    liveSheet('Umbudgetieren', (close) => {
      const item = itemById(itemId);
      if (!item) { close(); return null; }
      const month = S.snap.months.find((m) => m.id === item.monthId);
      const actuals = Budget.actualsByItem(S.snap, month.id);
      const bal = (i) => i.plannedMinor - (actuals.get(i.id) || 0);
      const b = bal(item);
      const type = groupTypeOf(item);
      const remaining = Budget.summary(S.snap, month.id).remaining;
      const others = Budget.itemsOfMonth(S.snap, month.id).filter((i) => i.id !== item.id && groupTypeOf(i) !== 'income');
      const move = (from, to, amt) => guard(State.moveBudget(from, to, amt)).then(() => Fun.vibrate(12));
      const opt = (title, sub, label, run) => h('div', { class: 'move-row' },
        h('div', { class: 'move-text' }, h('span', {}, title), sub && h('span', { class: 'small soft num' }, sub)),
        h('button', { type: 'button', class: 'btn', onclick: run }, label));

      if (b === 0) {
        return h('div', { class: 'form' },
          h('p', { class: 'done-line' }, icon('check'), `${item.name} ist ausgeglichen.`),
          h('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: close }, 'Fertig'));
      }

      if (type === 'income') {
        const got = actuals.get(item.id) || 0;
        return h('div', { class: 'form' },
          h('p', {}, `${item.name}: geplant ${lab(item.plannedMinor)}, erhalten ${lab(got)}.`),
          h('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: () => guard(State.setPlanned(item.id, got)) }, `Geplant auf ${fmt(got)} setzen`),
          h('p', { class: 'small soft' }, b > 0
            ? 'Kommt noch etwas? Dann lass es offen. Sonst fehlt das Geld im Budget, und du kürzt danach einen Posten.'
            : 'Du hast mehr erhalten als geplant. Danach kannst du den Rest verplanen.'));
      }

      if (b < 0) {
        const need = -b;
        const sources = others.filter((i) => bal(i) > 0).sort((x, y) => bal(y) - bal(x));
        return h('div', { class: 'form' },
          h('p', {}, `${item.name} ist um `, h('span', { class: 'bal bal-over num' }, fmt(need)), ' überzogen. Woher nimmst du das Geld?'),
          h('div', { class: 'move-list' },
            remaining > 0 && opt('Noch nicht verplant', `${fmt(remaining)} frei`, `${fmt(Math.min(need, remaining))} nehmen`, () => move(null, item.id, Math.min(need, remaining))),
            sources.map((src) => opt(src.name, `${fmt(bal(src))} offen`, `${fmt(Math.min(need, bal(src)))} nehmen`, () => move(src.id, item.id, Math.min(need, bal(src))))),
            !sources.length && remaining <= 0 && h('p', { class: 'small' }, 'Kein Posten hat noch Geld offen. Erhöhe eine geplante Einnahme oder bezahle einen Teil aus einem Sparschwein (Buchung öffnen, Art „Entnahme“).')));
      }

      const overs = others.filter((i) => bal(i) < 0);
      const piggies = others.filter((i) => groupTypeOf(i) === 'savings');
      return h('div', { class: 'form' },
        h('p', {}, `In ${item.name} sind noch `, h('span', { class: 'bal bal-open num' }, fmt(b)), ' offen. Wohin damit?'),
        h('p', { class: 'small soft' }, 'Wird bis Monatsende noch etwas gebucht? Dann lass es einfach offen.'),
        h('div', { class: 'move-list' },
          overs.map((t) => opt(`${t.name} ausgleichen`, `${fmt(-bal(t))} überzogen`, `${fmt(Math.min(b, -bal(t)))} geben`, () => move(item.id, t.id, Math.min(b, -bal(t))))),
          piggies.filter((p) => p.id !== item.id).map((p) => opt(`Ins Sparschwein ${p.name}`, 'danach Einzahlung buchen', `${fmt(b)} geben`, () => move(item.id, p.id, b))),
          opt('Zurück zu „zu verplanen“', null, `${fmt(b)} lösen`, () => move(item.id, null, b))));
    });
  }

  /* ---- Abschluss-Assistent ---- */
  function closeAssistant(monthId) {
    let celebrated = false;
    liveSheet('Monat abschliessen', (close) => {
      const month = S.snap.months.find((m) => m.id === monthId);
      if (!month) { close(); return null; }
      const chk = Budget.closeCheck(S.snap, month.id);
      const nextYm = Utils.addMonths(month.ym, 1);
      const nextName = Utils.monthName(nextYm);
      const sum = Budget.summary(S.snap, month.id);

      if (chk.ok) {
        if (!celebrated) { celebrated = true; setTimeout(() => { Fun.confetti(1.2); Fun.vibrate([20, 50, 30]); }, 250); }
        const nextExists = !!Budget.monthOf(S.snap, nextYm);
        const row = (a, b) => h('div', {}, h('dt', {}, a), h('dd', {}, b));
        return h('div', { class: 'form' },
          h('div', { class: 'stamp-wrap' }, h('div', { class: 'stamp' }, 'Abgeschlossen', h('small', {}, Utils.monthLabel(month.ym)))),
          h('p', {}, `Jeder ${Config.CURRENCIES[cur()].word} hatte im ${Utils.monthName(month.ym)} eine Aufgabe. Stark.`),
          h('dl', { class: 'facts' },
            row('Erhalten', fmt(sum.incomeActual)),
            row('Ausgegeben', fmt(sum.expenseActual)),
            row('In Sparschweine', fmt(sum.savingsActual))),
          motivationCard(),
          nextExists
            ? h('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: () => { S.ym = nextYm; close(); location.hash = '#/budget'; State.notify(); } }, `Zu ${nextName}`)
            : h('button', {
              type: 'button', class: 'btn btn-primary btn-wide',
              onclick: async () => { await guard(State.createMonth(nextYm, 'copy')); S.ym = nextYm; close(); location.hash = '#/budget'; State.notify(); toast(`${nextName} beginnt`); },
            }, `${nextName} beginnen`));
      }

      const s1 = chk.unassignedCount === 0, s2 = chk.open.length === 0, s3 = chk.remaining === 0;
      const done = [s1, s2, s3].filter(Boolean).length;
      const step = (ok, nr, title, body) => h('section', { class: `step${ok ? ' ok' : ''}` },
        h('div', { class: 'step-head' }, h('span', { class: 'step-nr' }, ok ? icon('check') : String(nr)), h('h3', {}, title)),
        !ok && body && h('div', { class: 'step-body' }, body));
      const piggies = Budget.itemsOfMonth(S.snap, month.id).filter((i) => groupTypeOf(i) === 'savings');

      return h('div', { class: 'form' },
        h('div', { class: 'progress-dots', 'aria-label': `${done} von 3 erledigt` }, [s1, s2, s3].map((ok) => h('i', { class: ok ? 'on' : '' })), h('span', { class: 'small soft' }, `${done} von 3 erledigt`)),
        step(s1, 1, 'Jede Zahlung hat einen Posten',
          h('button', { type: 'button', class: 'btn', onclick: () => inboxSheet() }, icon('inbox'), `Posteingang öffnen (${chk.unassignedCount})`)),
        step(s2, 2, 'Jede Balance steht auf 0',
          h('div', { class: 'move-list' }, chk.open.map((o) => h('div', { class: 'move-row' },
            h('div', { class: 'move-text' }, h('span', {}, o.item.name), h('span', { class: `bal bal-${o.balance > 0 ? 'open' : 'over'} num` }, fmt(o.balance))),
            h('button', { type: 'button', class: 'btn', onclick: () => rebudgetSheet(o.item.id) }, 'Ausgleichen'))))),
        step(s3, 3, 'Einnahmen minus Budget ergibt 0',
          chk.remaining > 0
            ? (s2
              ? [h('p', { class: 'small' }, `Es sind ${lab(chk.remaining)} übrig. Lege den Rest in ein Sparschwein:`),
                piggies.length
                  ? h('div', { class: 'chips' }, piggies.map((p) => h('button', { type: 'button', class: 'chip', onclick: () => guard(State.restToPiggy(month, p, chk.remaining)).then(() => Fun.vibrate(15)) }, p.name)))
                  : h('button', { type: 'button', class: 'btn', onclick: () => itemSheet(null, null, { piggy: true, month }) }, 'Sparschwein anlegen')]
              : h('p', { class: 'small' }, `Es sind ${lab(chk.remaining)} noch nicht verplant. Gleiche zuerst die Balancen aus, dann lege den Rest in ein Sparschwein.`))
            : h('p', { class: 'small' }, `Es ist ${lab(-chk.remaining)} mehr verplant, als reinkam. Kürze einen Posten oder bezahle einen Teil aus einem Sparschwein (Buchung öffnen, Art „Entnahme“).`)));
    });
  }

  /* ---- Posteingang: Zahlungen ohne Posten, Karte für Karte ---- */
  function inboxSheet() {
    const skipped = new Set();
    let celebrated = false;
    let lastId = null;
    liveSheet('Posteingang', (close) => {
      const all = S.snap.transactions.filter((t) => t.splits.length === 0)
        .sort((a, b) => a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt));
      const queue = all.filter((t) => !skipped.has(t.id));

      if (!all.length) {
        if (!celebrated) { celebrated = true; setTimeout(() => { Fun.confetti(0.9); Fun.vibrate([15, 40, 15]); }, 200); }
        const month = Budget.monthOf(S.snap, Utils.thisYm());
        return h('div', { class: 'form inbox-empty' },
          Fun.pig(100, { size: 96, done: true }),
          h('h3', {}, 'Posteingang leer'),
          h('p', {}, 'Jede Zahlung hat ihren Posten.'),
          motivationCard(),
          h('div', { class: 'btn-row' },
            month && h('button', { type: 'button', class: 'btn btn-primary', onclick: () => { close(); closeAssistant(month.id); } }, 'Monat abschliessen'),
            h('button', { type: 'button', class: 'btn', onclick: close }, 'Fertig')));
      }
      if (!queue.length) {
        return h('div', { class: 'form' },
          h('p', {}, `Du hast ${all.length === 1 ? 'die letzte Zahlung' : `alle ${all.length} Zahlungen`} auf später verschoben.`),
          h('button', { type: 'button', class: 'btn', onclick: () => { skipped.clear(); State.notify(); } }, 'Nochmals ansehen'));
      }

      const tx = queue[0];
      const enter = tx.id !== lastId;
      lastId = tx.id;
      const sug = State.suggestFor(tx);
      const withSug = all.map((t) => [t, State.suggestFor(t)]).filter(([, sg]) => sg);
      const ym = Utils.ymOf(tx.date);
      const pick = (lineId, type) => guard(State.assign(tx, lineId, type)).then(() => Fun.vibrate(12));
      const chip = (lineId, name, type, extra) => h('button', { type: 'button', class: `chip${extra || ''}`, onclick: () => pick(lineId, type) }, name);
      const groups = Budget.pickerGroups(S.snap, ym, tx.type);
      const piggies = tx.type === 'expense' ? Budget.pickerGroups(S.snap, ym, 'withdrawal').flatMap((g) => g.items) : [];

      return h('div', { class: 'form' },
        h('div', { class: 'inbox-top' },
          h('span', { class: 'inbox-count' }, h('b', { class: 'num' }, String(all.length)), all.length === 1 ? ' Zahlung ohne Posten' : ' Zahlungen ohne Posten'),
          withSug.length > 1 && h('button', { type: 'button', class: 'btn btn-quiet', onclick: () => guard(State.assignMany(withSug)).then(() => { Fun.vibrate([12, 30, 12]); toast(`${withSug.length} Vorschläge übernommen`); }) }, `Alle ${withSug.length} Vorschläge übernehmen`)),
        h('article', { class: `inbox-card${enter ? ' enter' : ''}` },
          h('div', { class: 'inbox-meta small soft' }, Utils.dayLabel(tx.date), tx.importKey ? ', aus dem Bank-Import' : ''),
          h('div', { class: `inbox-amount num${tx.type === 'income' ? ' plus' : ''}` }, `${tx.type === 'income' ? '+' : '−'}${fmt(tx.amountMinor)}`),
          h('div', { class: 'inbox-merchant' }, tx.merchant || 'Ohne Bezeichnung')),
        sug && h('div', { class: 'field' }, h('span', { class: 'label' }, 'Vorschlag'),
          h('div', { class: 'chips' }, chip(sug.lineId, sug.type === 'withdrawal' ? `Aus Sparschwein ${sug.name}` : sug.name, sug.type, ' chip-sug'))),
        groups.map((g) => h('div', { class: 'field' }, h('span', { class: 'label' }, g.name),
          h('div', { class: 'chips' }, g.items.map((i) => chip(i.lineId, i.name, tx.type))))),
        piggies.length > 0 && h('div', { class: 'field' }, h('span', { class: 'label' }, 'Aus Sparschwein bezahlt'),
          h('div', { class: 'chips' }, piggies.map((i) => chip(i.lineId, i.name, 'withdrawal', ' chip-out')))),
        h('div', { class: 'btn-row' },
          h('button', { type: 'button', class: 'btn', onclick: () => { skipped.add(tx.id); State.notify(); } }, 'Später'),
          h('button', { type: 'button', class: 'btn btn-quiet', onclick: () => txSheet(tx) }, 'Aufteilen oder bearbeiten')));
    });
  }

  /* ---- Bank-Import ---- */
  function importSheet() {
    const st = { phase: 'pick', name: '', rows: [], delim: ';', header: 0, map: null, known: false, result: null };
    sheet('Bankdaten importieren', (close) => {
      const host = h('div', {});
      const err = h('p', { class: 'error', role: 'alert' });

      async function load(text, name) {
        st.delim = Importer.detectDelimiter(text);
        st.rows = Importer.parseCsv(text, st.delim);
        if (st.rows.length < 2) { err.textContent = 'In dieser Datei wurden keine Zeilen gefunden. Exportiere die Kontobewegungen als CSV.'; return; }
        if (st.rows.length > 50000) { err.textContent = 'Die Datei hat mehr als 50’000 Zeilen. Exportiere einen kürzeren Zeitraum.'; st.rows = []; return; }
        st.header = Importer.detectHeader(st.rows);
        st.name = name;
        /* Das Bankformat wird nur als Prüfsumme gemerkt, nie als Text. */
        const sig = await App.Crypto.sha256Hex(Importer.signature(Importer.headerLabels(st.rows, st.header)));
        const profile = (S.settings.importProfiles || {})[sig];
        st.known = !!profile;
        st.map = profile ? { ...profile } : Importer.guess(st.rows, st.header);
        if (profile && Number.isInteger(profile.header)) st.header = profile.header;
        st.phase = 'map';
        draw();
      }

      function pickView() {
        const file = h('input', { type: 'file', id: 'imp-file', accept: '.csv,.txt,text/csv,text/plain', class: 'input' });
        file.addEventListener('change', async () => {
          const f = file.files[0];
          if (!f) return;
          err.textContent = '';
          if (/\.(xlsx?|pdf|xml)$/i.test(f.name)) { err.textContent = 'Diese Datei ist keine CSV-Datei. Wähle im E-Banking beim Export das Format CSV.'; return; }
          if (f.size > 10 * 1024 * 1024) { err.textContent = 'Die Datei ist grösser als 10 MB. Exportiere einen kürzeren Zeitraum.'; return; }
          load(Importer.decode(await f.arrayBuffer()), f.name);
        });
        return h('div', { class: 'form' },
          h('p', {}, 'Exportiere in deinem E-Banking die Kontobewegungen als CSV-Datei und wähle sie hier aus. Die Datei bleibt auf diesem Gerät.'),
          h('div', { class: 'field' }, h('label', { for: 'imp-file' }, 'CSV-Datei'), file),
          err,
          h('p', { class: 'small soft' }, 'Bereits importierte Zahlungen werden erkannt und übersprungen. Du kannst also überlappende Zeiträume exportieren.'),
          S.snap.account.demo && h('button', { type: 'button', class: 'btn', onclick: () => load(Importer.sampleCsv(Utils.thisYm(), Number(Utils.today().slice(8, 10))), 'demo-bank.csv') }, 'Beispieldatei der Demo-Bank laden'));
      }

      function mapView() {
        const labels = Importer.headerLabels(st.rows, st.header);
        const data = st.rows.slice(st.header + 1);
        const colSel = (key, label, optional) => {
          const sel = h('select', { class: 'input', id: `imp-${key}`, value: String(st.map[key]) },
            optional && h('option', { value: '-1' }, 'Keine'),
            labels.map((l, i) => h('option', { value: String(i) }, `${l}${data[0] && data[0][i] ? `: ${data[0][i].slice(0, 24)}` : ''}`)));
          sel.addEventListener('change', () => { st.map[key] = Number(sel.value); draw(); });
          return h('div', { class: 'field' }, h('label', { for: `imp-${key}` }, label), sel);
        };
        const headSel = h('select', { class: 'input', id: 'imp-header', value: String(st.header) },
          h('option', { value: '-1' }, 'Keine Kopfzeile'),
          st.rows.slice(0, 15).map((r, i) => h('option', { value: String(i) }, `Zeile ${i + 1}: ${r.join(' | ').slice(0, 50)}`)));
        headSel.addEventListener('change', () => { st.header = Number(headSel.value); st.map = Importer.guess(st.rows, st.header); draw(); });
        const modeRadio = (value, text) => h('label', {}, h('input', { type: 'radio', name: 'imp-mode', value, checked: st.map.mode === value, onchange: () => { st.map.mode = value; draw(); } }), h('span', {}, text));
        const ok = st.map.date >= 0 && st.map.text >= 0 && (st.map.mode === 'split' ? st.map.debit >= 0 && st.map.credit >= 0 : st.map.amount >= 0);
        const res = ok ? Importer.apply(st.rows, st.header, st.map) : { items: [], skipped: data.length };
        const invert = h('input', { type: 'checkbox', id: 'imp-invert', checked: st.map.invert, style: 'width:1.25rem;height:1.25rem' });
        invert.addEventListener('change', () => { st.map.invert = invert.checked; draw(); });

        return h('div', { class: 'form' },
          h('p', { class: 'small' }, `${st.name}: ${data.length} Zeilen, Trennzeichen „${st.delim === '\t' ? 'Tab' : st.delim}“.`, st.known ? ' Zuordnung vom letzten Mal übernommen.' : ''),
          h('div', { class: 'field' }, h('label', { for: 'imp-header' }, 'Kopfzeile'), headSel),
          colSel('date', 'Datum'),
          colSel('text', 'Text'),
          colSel('text2', 'Zusatztext', true),
          h('fieldset', {}, h('legend', {}, 'Betrag'), h('div', { class: 'segment' }, modeRadio('single', 'Eine Spalte'), modeRadio('split', 'Belastung und Gutschrift'))),
          st.map.mode === 'split'
            ? [colSel('debit', 'Belastung (Ausgaben)'), colSel('credit', 'Gutschrift (Einnahmen)')]
            : [colSel('amount', 'Betrag'), h('label', { class: 'check-row' }, invert, 'Vorzeichen umkehren (Ausgaben stehen positiv in der Datei)')],
          h('div', { class: 'field' }, h('span', { class: 'label' }, `Vorschau: ${res.items.length} Zahlungen${res.skipped ? `, ${res.skipped} Zeilen übersprungen` : ''}`),
            h('div', { class: 'preview' }, res.items.slice(0, 6).map((r) => h('div', { class: 'preview-row' },
              h('span', { class: 'small soft num' }, r.date.split('-').reverse().join('.')),
              h('span', { class: 'preview-text' }, r.text),
              h('span', { class: `num${r.amountMinor > 0 ? ' plus' : ''}` }, `${r.amountMinor > 0 ? '+' : '−'}${fmt(Math.abs(r.amountMinor))}`))))),
          err,
          h('button', {
            type: 'button', class: 'btn btn-primary btn-wide', disabled: !res.items.length,
            onclick: async (e) => {
              e.target.disabled = true;
              try {
                await State.saveImportProfile(await App.Crypto.sha256Hex(Importer.signature(labels)), { ...st.map, header: st.header });
                st.result = await State.importRows(res.items);
                st.phase = 'done';
                Fun.vibrate([15, 30, 15]);
              } catch (ex) {
                console.error(ex && ex.name);
                err.textContent = 'Der Import ist fehlgeschlagen. Prüfe den freien Speicher des Geräts.';
                e.target.disabled = false;
              }
              draw();
            },
          }, `${res.items.length} Zahlungen importieren`),
          h('button', { type: 'button', class: 'btn btn-quiet', onclick: () => { st.phase = 'pick'; draw(); } }, 'Andere Datei wählen'));
      }

      function doneView() {
        const r = st.result;
        const months = r.waitingMonths.map((ym) => Utils.monthLabel(ym)).join(', ');
        const line = (n, text) => n > 0 && h('li', {}, h('b', { class: 'num' }, String(n)), ` ${text}`);
        return h('div', { class: 'form' },
          h('h3', {}, r.added ? 'Import fertig' : 'Nichts Neues'),
          h('ul', { class: 'result-list' },
            line(r.added, r.added === 1 ? 'neue Zahlung im Posteingang' : 'neue Zahlungen im Posteingang'),
            line(r.linked, 'mit wiederkehrenden Buchungen verknüpft'),
            line(r.dup, 'waren schon vorhanden'),
            line(r.waiting, `warten, bis der Vormonat abgeschlossen ist (${months})`),
            line(r.tooOld, 'liegen vor dem ersten Monat dieses Kontos')),
          r.added > 0
            ? h('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: () => { close(); inboxSheet(); } }, 'Jetzt zuordnen')
            : h('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: close }, 'Fertig'));
      }

      function draw() {
        host.replaceChildren(st.phase === 'pick' ? pickView() : st.phase === 'map' ? mapView() : doneView());
      }
      draw();
      return host;
    });
  }

  /* ---- Wiederkehrende Buchungen bestätigen ---- */
  function recurringSheet() {
    liveSheet('Wiederkehrende Buchungen', (close) => {
      const due = State.dueRecurring();
      if (!due.length) {
        return h('div', { class: 'form' }, h('p', { class: 'done-line' }, icon('check'), 'Alles bestätigt.'),
          h('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: close }, 'Fertig'));
      }
      const nameOf = (lineId) => (S.snap.items.find((i) => i.lineId === lineId) || {}).name;
      return h('div', { class: 'form' },
        h('p', { class: 'small soft' }, 'Kommt die Zahlung später auch mit dem Bank-Import, wird sie automatisch verknüpft statt doppelt gezählt.'),
        h('div', { class: 'move-list' }, due.map((d) => h('div', { class: 'move-row' },
          h('div', { class: 'move-text' }, h('span', {}, d.tpl.merchant), h('span', { class: 'small soft' }, `${Utils.dayLabel(d.date)}${nameOf(d.tpl.lineId) ? `, ${nameOf(d.tpl.lineId)}` : ''}, ${d.tpl.type === 'income' ? '+' : '−'}${fmt(d.tpl.amountMinor)}`)),
          h('button', { type: 'button', class: 'btn', onclick: () => guard(State.confirmRecurring([d])).then(() => Fun.vibrate(12)) }, 'Bestätigen')))),
        due.length > 1 && h('button', { type: 'button', class: 'btn btn-primary btn-wide', onclick: () => guard(State.confirmRecurring(due)).then(() => Fun.vibrate([12, 30, 12])) }, `Alle ${due.length} bestätigen`));
    });
  }

  /* ---- Motivation im richtigen Moment ---- */
  /** Ein Sparschwein mit Motivation, das jeden Tag wechselt */
  function motivationCard() {
    const month = Budget.monthOf(S.snap, Utils.thisYm()) || [...S.snap.months].sort((a, b) => b.ym.localeCompare(a.ym))[0];
    if (!month) return null;
    const list = Budget.itemsOfMonth(S.snap, month.id).filter((i) => i.kind === 'fund' && i.motivation).sort((a, b) => a.sort - b.sort);
    if (!list.length) return null;
    const day = Math.floor(Date.now() / 86400000);
    const item = list[day % list.length];
    const actuals = Budget.actualsByItem(S.snap, month.id);
    const pg = Budget.piggy(S.snap, item, actuals);
    return h('aside', { class: 'motivation' },
      Fun.pig(pg.goal > 0 ? pg.pct : 40, { size: 64, done: pg.status === 'reached' }),
      h('div', { class: 'motivation-text' },
        h('span', { class: 'small soft' }, `Dein Sparschwein ${item.name}`),
        h('blockquote', { class: 'piggy-why' }, item.motivation),
        pg.goal > 0 && h('span', { class: 'small num' }, `${fmt(pg.saved)} von ${fmt(pg.goal)}, ${pg.pct} %`)));
  }

  /* ---- Startansicht „Jetzt“ ---- */
  function jetzt() {
    const ym = Utils.thisYm();
    const month = Budget.monthOf(S.snap, ym);
    const tasks = [];
    const inboxN = S.snap.transactions.filter((t) => t.splits.length === 0).length;
    const due = State.dueRecurring();
    const lastImp = (S.settings.lastImportAt || {})[S.snap.account.id];
    const days = lastImp ? Math.floor((Date.now() - Date.parse(lastImp)) / 86400000) : null;
    const toBudget = () => { S.ym = ym; location.hash = '#/budget'; };

    if (!month) {
      const chk = Budget.startCheck(S.snap, ym);
      if (!chk.ok) tasks.push({ ic: 'check', title: `${Utils.monthName(chk.prev.ym)} abschliessen`, sub: `Erst danach beginnt ${Utils.monthName(ym)}`, run: () => closeAssistant(chk.prev.id) });
      else tasks.push({ ic: 'budget', title: `${Utils.monthName(ym)} beginnen`, sub: 'Posten aus dem Vormonat übernehmen', run: toBudget });
    }
    if (inboxN) tasks.push({ ic: 'inbox', title: inboxN === 1 ? '1 Zahlung zuordnen' : `${inboxN} Zahlungen zuordnen`, sub: 'Im Posteingang warten Zahlungen ohne Posten', run: inboxSheet });
    if (due.length) tasks.push({ ic: 'repeat', title: due.length === 1 ? '1 wiederkehrende Buchung bestätigen' : `${due.length} wiederkehrende Buchungen bestätigen`, sub: due.map((d) => d.tpl.merchant).join(', '), run: recurringSheet });
    if (days === null || days >= 14) tasks.push({ ic: 'upload', title: 'Bankdaten importieren', sub: days === null ? 'CSV aus dem E-Banking laden' : `Letzter Import vor ${days} Tagen`, run: importSheet });
    if (month) {
      const rest = Budget.summary(S.snap, month.id).remaining;
      if (rest !== 0) tasks.push({ ic: 'budget', title: rest > 0 ? `${lab(rest)} verplanen` : `${lab(-rest)} zu viel verplant`, sub: 'Einnahmen minus Budget soll 0 ergeben', run: toBudget });
      const lastDay = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate();
      const left = lastDay - Number(Utils.today().slice(8, 10));
      if (left <= 3) tasks.push({ ic: 'check', title: `${Utils.monthName(ym)} abschliessen`, sub: left === 0 ? 'Heute ist der letzte Tag des Monats' : `Noch ${left} ${left === 1 ? 'Tag' : 'Tage'} im ${Utils.monthName(ym)}`, run: () => closeAssistant(month.id) });
    }

    const hour = new Date().getHours();
    const hello = hour < 11 ? 'Guten Morgen' : hour < 18 ? 'Hallo' : 'Guten Abend';
    const next = days === null ? null : Math.max(0, 14 - days);
    const shown = tasks.slice(0, 3);
    return [
      h('div', { class: 'page-head jetzt-head' }, h('div', {},
        h('h1', {}, hello),
        h('p', { class: 'soft' }, new Date().toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' })))),
      addressNotice(),
      backupNotice(),
      shown.length
        ? h('section', { class: 'tasks', 'aria-label': 'Was jetzt ansteht' },
          h('h2', { class: 'tasks-title' }, shown.length === 1 ? 'Eine Sache steht an' : `${shown.length} Dinge stehen an`),
          shown.map((t) => h('button', { type: 'button', class: 'task', onclick: t.run },
            h('span', { class: 'task-icon' }, icon(t.ic)),
            h('span', { class: 'task-text' }, h('span', { class: 'task-title' }, t.title), h('span', { class: 'task-sub small soft' }, t.sub)),
            icon('right'))),
          tasks.length > 3 && h('p', { class: 'small soft' }, `Danach noch ${tasks.length - 3} weitere.`))
        : h('section', { class: 'all-done' },
          Fun.pig(100, { size: 88, done: true }),
          h('div', {}, h('h2', {}, 'Alles erledigt'),
            h('p', {}, next === null ? 'Lade bei Gelegenheit deine Bankdaten.' : next === 0 ? 'Zeit für den nächsten Bank-Import.' : `Der nächste Bank-Import ist in ${next} ${next === 1 ? 'Tag' : 'Tagen'} fällig.`))),
      month && h('section', { class: 'glance' },
        h('h2', {}, Utils.monthLabel(ym)),
        glance(month)),
      motivationCard(),
      h('div', { class: 'btn-row jetzt-actions' },
        h('button', { type: 'button', class: 'btn', onclick: importSheet }, icon('upload'), 'Bankdaten importieren'),
        h('button', { type: 'button', class: 'btn btn-quiet', onclick: toBudget }, 'Zum Budget')),
    ];
  }

  /** Monatsstand auf einen Blick */
  function glance(month) {
    const sum = Budget.summary(S.snap, month.id);
    const chk = Budget.closeCheck(S.snap, month.id);
    const row = (a, b, cls) => h('div', { class: 'eq-row' }, h('span', {}, a), h('span', { class: `num${cls || ''}` }, b));
    return h('div', { class: 'equation' },
      row('Erhalten', fmt(sum.incomeActual)),
      row('Ausgegeben', fmt(sum.expenseActual)),
      row('In Sparschweine', fmt(sum.savingsActual)),
      h('div', { class: 'eq-row eq-total' }, h('span', {}, 'Offene Balancen'), h('span', { class: 'num' }, String(chk.open.length))));
  }

  /* ---- Jahresrückblick ---- */
  function yearReview(year) {
    const months = S.snap.months.filter((m) => m.ym.startsWith(`${year}-`)).sort((a, b) => a.ym.localeCompare(b.ym));
    if (!months.length) return null;
    const now = Utils.thisYm();
    let income = 0, spent = 0, saved = 0, paidFromSavings = 0, closed = 0, best = null;
    months.forEach((m) => {
      const sm = Budget.summary(S.snap, m.id);
      income += sm.incomeActual; spent += sm.expenseActual; saved += sm.savingsActual; paidFromSavings += sm.withdrawalActual;
      if (m.ym < now && Budget.closeCheck(S.snap, m.id).ok) closed++;
      if (sm.savingsActual > 0 && (!best || sm.savingsActual > best.v)) best = { ym: m.ym, v: sm.savingsActual };
    });
    const last = months[months.length - 1];
    const actuals = Budget.actualsByItem(S.snap, last.id);
    const reached = Budget.itemsOfMonth(S.snap, last.id).filter((i) => i.kind === 'fund' && Budget.piggy(S.snap, i, actuals).status === 'reached');
    const stat = (t, v) => h('div', {}, h('span', { class: 'soft small' }, t), h('span', { class: 'v num' }, v));
    return h('section', { class: 'section year' }, h('h2', {}, `Dein Jahr ${year}`),
      h('p', { class: 'lead year-lead' }, saved > 0
        ? `Du hast ${year} ${lab(saved)} in deine Sparschweine gelegt.${best ? ` Am meisten im ${Utils.monthName(best.ym)}.` : ''}`
        : `Dein ${year} in Zahlen.`),
      h('div', { class: 'stat-row' },
        stat('Erhalten', fmt(income)),
        stat('Ausgegeben', fmt(spent)),
        stat('Eingezahlt', fmt(saved)),
        paidFromSavings > 0 && stat('Aus Sparschweinen bezahlt', fmt(paidFromSavings)),
        stat('Monate abgeschlossen', String(closed)),
        stat('Sparziele erreicht', String(reached.length))));
  }

  /* ======================================================================
     Sicherheit: Passwort festlegen, Entsperren, Backups, Einstellungen
     ====================================================================== */

  /** Nach dem Entsperren: Datenschutz-Pflege, dann Daten laden */
  async function afterOpen() {
    await App.Maintenance.run();
    await State.refresh();
  }

  /*
   * Unsichtbares Benutzerfeld: Damit speichert der Passwortmanager (etwa Google)
   * App-Passwort und Backup-Passwort als zwei getrennte Einträge.
   */
  const userField = (name) => h('input', { type: 'text', name: 'username', autocomplete: 'username', value: name, class: 'sr', tabindex: '-1', 'aria-hidden': 'true', readonly: true });
  const pwField = (id, auto) => h('input', { class: 'input', type: 'password', id, autocomplete: auto, required: true, spellcheck: 'false', autocapitalize: 'off' });
  const MIN_PW = 10;

  /** Hinweise zur Adresse: Chat-Vorschau oder lokal geöffnete Datei */
  function addressNotice() {
    if (isFramed()) return h('p', { class: 'warn' }, 'Das ist die Vorschau im Chat. Gib hier keine echten Bankdaten ein. Für deine echten Daten nutze die Datei oder später deine eigene Web-Adresse.');
    if (location.protocol === 'file:') return h('p', { class: 'warn' }, 'Du hast die Datei direkt vom Gerät geöffnet. Je nach Browser teilen sich lokale Dateien den Speicher. Für echte Daten ist eine feste Web-Adresse sicherer.');
    return null;
  }

  /** Erster Start: App-Passwort festlegen */
  function setupScreen() {
    const pw = pwField('v-new', 'new-password');
    const pw2 = pwField('v-new2', 'new-password');
    const err = h('p', { class: 'error', role: 'alert' });
    const btn = h('button', { class: 'btn btn-primary btn-wide' }, 'Passwort festlegen');
    const existing = h('p', { class: 'small' });
    App.DB.countPlain('accounts').then((n) => { if (n > 0) existing.textContent = 'Deine vorhandenen Daten werden dabei verschlüsselt.'; }).catch(() => {});
    const form = h('form', {
      class: 'form', novalidate: true,
      onsubmit: async (e) => {
        e.preventDefault();
        err.textContent = '';
        if (!App.Crypto.available()) { err.textContent = 'Dieser Browser bietet hier keine Verschlüsselung an. Öffne Nullpunkt über https oder als Datei in Chrome.'; return; }
        if (pw.value.length < MIN_PW) { err.textContent = `Das Passwort braucht mindestens ${MIN_PW} Zeichen.`; pw.focus(); return; }
        if (pw.value !== pw2.value) { err.textContent = 'Die beiden Passwörter stimmen nicht überein.'; pw2.focus(); return; }
        btn.disabled = true; btn.textContent = 'Wird verschlüsselt …';
        try {
          await App.Vault.setup(pw.value);
          await afterOpen();
        } catch (ex) {
          console.error(ex && ex.name);
          btn.disabled = false; btn.textContent = 'Passwort festlegen';
          err.textContent = 'Das Verschlüsseln ist fehlgeschlagen. Deine Daten sind unverändert.';
        }
      },
    },
    userField('Nullpunkt'),
    h('div', { class: 'field' }, h('label', { for: 'v-new' }, 'App-Passwort'), pw),
    h('div', { class: 'field' }, h('label', { for: 'v-new2' }, 'Passwort wiederholen'), pw2),
    existing, err, btn);
    return h('div', { class: 'welcome' },
      UI.logo('logo-big'),
      h('div', {}, h('h1', {}, 'Nullpunkt schützen'),
        h('p', { style: 'margin-top:.5rem' }, 'Deine Finanzdaten werden auf diesem Gerät mit einem Passwort verschlüsselt. Ohne Passwort kann niemand sie lesen.')),
      addressNotice(),
      form,
      h('ul', { class: 'small hints' },
        h('li', {}, `Mindestens ${MIN_PW} Zeichen. Lass es am besten vom Passwortmanager erzeugen und speichern.`),
        h('li', {}, 'Vergisst du das Passwort, lassen sich die Daten nicht wiederherstellen. Dann hilft nur ein Backup.')));
  }

  /** Gesperrt: Passwort eingeben */
  function lockScreen() {
    const pw = pwField('v-pw', 'current-password');
    const err = h('p', { class: 'error', role: 'alert' });
    const btn = h('button', { class: 'btn btn-primary btn-wide' }, 'Entsperren');
    setTimeout(() => pw.focus(), 50);
    const form = h('form', {
      class: 'form', novalidate: true,
      onsubmit: async (e) => {
        e.preventDefault();
        err.textContent = '';
        if (!pw.value) { pw.focus(); return; }
        btn.disabled = true; btn.textContent = 'Wird entsperrt …';
        const ok = await App.Vault.unlock(pw.value);
        if (!ok) {
          btn.disabled = false; btn.textContent = 'Entsperren';
          err.textContent = 'Das Passwort stimmt nicht.';
          pw.select();
          return;
        }
        await afterOpen();
      },
    }, userField('Nullpunkt'), h('div', { class: 'field' }, h('label', { for: 'v-pw' }, 'App-Passwort'), pw), err, btn);
    return h('div', { class: 'welcome lock' },
      UI.logo('logo-big'),
      h('div', {}, h('h1', {}, 'Nullpunkt ist gesperrt'), h('p', { style: 'margin-top:.5rem' }, 'Deine Daten sind verschlüsselt.')),
      form,
      h('button', { type: 'button', class: 'btn btn-quiet', onclick: forgotSheet }, 'Passwort vergessen?'));
  }

  function forgotSheet() {
    sheet('Passwort vergessen', (close) => h('div', { class: 'form' },
      h('p', {}, 'Ohne das Passwort lassen sich die Daten nicht entschlüsseln, auch nicht von dir oder einer anderen Person. Schau zuerst im Google Passwortmanager unter dem Eintrag „Nullpunkt“ nach.'),
      h('p', {}, 'Findest du es nicht, kannst du alle Daten auf diesem Gerät löschen, neu beginnen und dein letztes Backup importieren.'),
      h('button', { type: 'button', class: 'btn btn-danger', onclick: () => { close(); wipeAll(); } }, 'Alle Daten löschen')));
  }

  async function wipeAll() {
    const ok = await confirm({
      title: 'Alle Daten löschen?', danger: true, action: 'Endgültig löschen', requireText: 'LÖSCHEN',
      text: 'Alle Konten, Buchungen, Sparschweine, Regeln und das App-Passwort werden von diesem Gerät entfernt. Das lässt sich nur mit einem Backup rückgängig machen.',
    });
    if (!ok) return;
    await App.Vault.wipe();
    location.reload();
  }

  /** Backup sichern: verschlüsselt mit eigenem Passwort, unverschlüsselt nur nach Warnung */
  function saveBackup() {
    sheet('Backup sichern', (close) => {
      const pw = pwField('b-pw', 'current-password');
      const pw2 = h('input', { class: 'input', type: 'password', id: 'b-pw2', autocomplete: 'off', spellcheck: 'false' });
      const err = h('p', { class: 'error', role: 'alert' });
      const btn = h('button', { class: 'btn btn-primary btn-wide' }, 'Verschlüsselt sichern');
      const name = `nullpunkt-backup-${Utils.today()}`;
      /* Vom Passwortmanager ausgefüllt? Dann ist kein Tippfehler möglich. */
      const autofilled = (el) => { try { return el.matches(':autofill') || el.matches(':-webkit-autofill'); } catch (e) { return false; } };
      return h('form', {
        class: 'form', novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          err.textContent = '';
          if (pw.value.length < MIN_PW) { err.textContent = `Das Backup-Passwort braucht mindestens ${MIN_PW} Zeichen.`; pw.focus(); return; }
          if (!autofilled(pw) && pw.value !== pw2.value) { err.textContent = 'Die beiden Passwörter stimmen nicht überein.'; pw2.focus(); return; }
          btn.disabled = true; btn.textContent = 'Wird verschlüsselt …';
          try {
            const enc = await App.Crypto.encryptBackup(await Backup.payloadText(), pw.value);
            close();
            downloadText(`${name}-verschluesselt.json`, enc, 'application/json', 'In dieser Ansicht kann die App keine Datei herunterladen. Kopiere den verschlüsselten Text und speichere ihn als .json-Datei.');
            await guard(State.patchSettings({ lastBackupAt: new Date().toISOString(), backupSnoozeUntil: null }));
            toast('Verschlüsseltes Backup gesichert');
          } catch (ex) {
            console.error(ex && ex.name);
            btn.disabled = false; btn.textContent = 'Verschlüsselt sichern';
            err.textContent = 'Das Backup konnte nicht erstellt werden.';
          }
        },
      },
      h('p', {}, 'Das Backup wird mit einem eigenen Passwort verschlüsselt. So darf es auch in Google Drive oder auf einem USB-Stick liegen.'),
      userField('Nullpunkt Backup'),
      h('div', { class: 'field' }, h('label', { for: 'b-pw' }, 'Backup-Passwort'), pw),
      h('div', { class: 'field' }, h('label', { for: 'b-pw2' }, 'Passwort wiederholen'), pw2,
        h('p', { class: 'small soft' }, 'Nicht nötig, wenn der Passwortmanager das Feld darüber ausgefüllt hat.')),
      err, btn,
      h('button', {
        type: 'button', class: 'btn btn-quiet',
        onclick: async () => {
          const ok = await confirm({
            title: 'Ohne Passwort sichern?', danger: true, action: 'Trotzdem unverschlüsselt sichern',
            text: 'Wer die Datei findet, kann alle Buchungen, Beträge und Notizen lesen. Speichere sie nicht in der Cloud oder in einem Chat.',
          });
          if (!ok) return;
          close();
          downloadText(`${name}.json`, await Backup.payloadText(), 'application/json', 'In dieser Ansicht kann die App keine Datei herunterladen. Kopiere den Text und speichere ihn als .json-Datei.');
          await guard(State.patchSettings({ lastBackupAt: new Date().toISOString(), backupSnoozeUntil: null }));
        },
      }, 'Ohne Passwort sichern (nicht empfohlen)'));
    });
  }

  /** Passwort für ein verschlüsseltes Backup abfragen */
  function askBackupPassword(raw) {
    sheet('Backup entschlüsseln', (close) => {
      const pw = pwField('ib-pw', 'current-password');
      const err = h('p', { class: 'error', role: 'alert' });
      const btn = h('button', { class: 'btn btn-primary btn-wide' }, 'Entschlüsseln');
      setTimeout(() => pw.focus(), 50);
      return h('form', {
        class: 'form', novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          btn.disabled = true; btn.textContent = 'Wird entschlüsselt …';
          let obj = null;
          try { obj = JSON.parse(await App.Crypto.decryptBackup(raw, pw.value)); } catch (ex) { obj = null; }
          if (!obj) {
            btn.disabled = false; btn.textContent = 'Entschlüsseln';
            err.textContent = 'Das Passwort stimmt nicht, oder die Datei ist beschädigt.';
            pw.select();
            return;
          }
          close();
          importParsed(obj);
        },
      }, userField('Nullpunkt Backup'), h('div', { class: 'field' }, h('label', { for: 'ib-pw' }, 'Backup-Passwort'), pw), err, btn);
    });
  }

  /* ---- Einstellungen: Sicherheit ---- */
  function changePasswordSheet() {

      const old = pwField('cp-old', 'current-password');
      const pw = pwField('cp-new', 'new-password');

      h('div', { class: 'field' }, h('label', { for: 'cp-new' }, 'Neues Passwort'), pw),

  function securitySettings() {

        h('button', { type: 'button', class: 'btn', onclick: () => App.Vault.lock() }, icon('lock'), 'Jetzt sperren'),
        h('button', { type: 'button', class: 'btn btn-quiet', onclick: changePasswordSheet }, 'App-Passwort ändern')),
      h('div', { class: 'set-row', style: 'margin-top:.75rem' },
        h('div', {}, h('div', {}, 'Alle Daten löschen'), h('div', { class: 'small soft' }, 'Entfernt Konten, Buchungen, Regeln und das Passwort von diesem Gerät.')),

  /** Datenschutz-Modus: Beträge unscharf, etwa wenn jemand mitschaut */

  /* ---- Rahmen und erster Start ---- */
  const NAV = [['jetzt', 'Jetzt', 'spark'], ['budget', 'Budget', 'budget'], ['buchungen', 'Buchungen', 'list'], ['auswertung', 'Auswertung', 'chart'], ['einstellungen', ['Optionen', 'Einstellungen'], 'gear']];

  function shell(route, content) {

        h('div', { class: 'acct-list' }, accountRows(), h('button', { type: 'button', class: 'acct-item acct-new', onclick: newAccountSheet }, 'Neues Konto eröffnen')),
        h('button', { type: 'button', class: 'btn btn-primary rail-add', onclick: () => txSheet() }, icon('plus'), 'Buchung erfassen'),
        h('nav', { class: 'tabs', 'aria-label': 'Hauptnavigation' }, NAV.map(([id, text, ic]) => h('a', { class: 'tab', href: `#/${id}`, 'aria-current': route === id ? 'page' : null }, icon(ic), Array.isArray(text) ? [h('span', { class: 't-short' }, text[0]), h('span', { class: 't-long' }, text[1])] : text)))),

  function welcome() {
    return h('div', { class: 'welcome' },
      UI.logo('logo-big'),
      h('div', {}, h('h1', {}, 'Nullpunkt'), h('p', { style: 'margin-top:.5rem' }, 'Gib jedem Betrag eine Aufgabe, bis Einnahmen minus Budget null ergibt. Alles bleibt auf diesem Gerät.')),
      h('div', {}, h('h2', { style: 'margin-bottom:1rem' }, 'Erstes Konto eröffnen'), accountForm()),
      h('div', { class: 'btn-row' },
        h('button', { type: 'button', class: 'btn', onclick: startDemo }, 'Mit Beispieldaten ausprobieren'),

    return h('div', { class: 'fatal' }, UI.logo('logo-big'),
      h('h1', {}, 'Speicher nicht verfügbar'),
      h('p', {}, 'Dieser Browser erlaubt Nullpunkt hier keinen lokalen Speicher. Das passiert oft im privaten Modus oder wenn die Datei direkt aus einer Dateien-App geöffnet wird.'),
      h('p', {}, 'Öffne die App in einem normalen Browserfenster oder unter einer festen Adresse.'));
  }

  return { jetzt, budget, transactions, reports, settings, shell, welcome, fatal, setupScreen, lockScreen };
})();

/* ==========================================================================
   11 ROUTER: Hash-Navigation
   ========================================================================== */
App.Router = (() => {
  const { State, Views, UI, Fun } = App;
  const ROUTES = { jetzt: Views.jetzt, budget: Views.budget, buchungen: Views.transactions, auswertung: Views.reports, einstellungen: Views.settings };

  function current() {
    const r = location.hash.replace(/^#\/?/, '').split('?')[0];
    return ROUTES[r] ? r : 'jetzt';
  }

  function applyTheme() {
    const t = State.s.settings ? State.s.settings.theme : 'system';
    if (t === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
  }

  function render() {
    applyTheme();
    document.body.classList.toggle('privacy', !!(State.s.settings && State.s.settings.privacy));
    const root = document.getElementById('root');
    /* Ohne Passwort oder gesperrt: nur Einrichtung oder Sperrbildschirm */
    if (App.Vault.status !== 'open') {
      UI.mount(root, App.Vault.status === 'none' ? Views.setupScreen() : Views.lockScreen());
      root.dataset.route = '';
      return;
    }
    if (!State.s.snap) { UI.mount(root, Views.welcome()); return; }
    /* Während des Ziehens nicht neu zeichnen, sonst verliert man das gezogene Element */
    if (document.body.classList.contains('drag-active')) return;
    const route = current();
    const prev = root.dataset.route;
    UI.mount(root, Views.shell(route, ROUTES[route]()));
    root.dataset.route = route;
    if (prev && prev !== route) window.scrollTo(0, 0);
    /* Erreichte Sparziel-Meilensteine feiern, nachdem gezeichnet ist */
    setTimeout(Fun.checkMilestones, 0);
  }

  return { render };
})();

/* ==========================================================================
   12 BOOTSTRAP: Start
   ========================================================================== */
App.Bootstrap = (async () => {
  const { DB, State, Router, UI, Views, Vault, Fun } = App;
  /* Läuft das Skript, wird der Hinweis für eine blockierte Sicherheitsregel entfernt. */
  const hint = document.getElementById('csp-hint');
  if (hint) hint.remove();
  try {
    await DB.open();
    await Vault.init();
  } catch (e) {
    console.error(e && e.name);
    UI.mount(document.getElementById('root'), Views.fatal());
    return;
  }
  State.subscribe(Router.render);
  window.addEventListener('hashchange', Router.render);
  /* Sperren: Dialoge schliessen, entschlüsselte Daten aus dem Speicher werfen */
  Vault.onLock(() => {
    document.querySelectorAll('dialog[open]').forEach((d) => d.close());
    document.body.classList.remove('drag-active');
    const toastEl = document.getElementById('toast');
    if (toastEl) { toastEl.textContent = ''; toastEl.className = ''; }
    Fun.reset();
    State.clear();
    State.notify();
  });
  Vault.startAutoLock(() => (State.s.settings && State.s.settings.autoLockMin) || 5);
  /* Im App-Wechsler möglichst nichts zeigen (Android erlaubt Web-Apps keinen vollständigen Schutz) */
  document.addEventListener('visibilitychange', () => document.body.classList.toggle('shield', document.visibilityState === 'hidden'));
  /*
   * Web-App (GitHub Pages, https): Manifest und Service Worker aus dem eigenen Ordner.
   * Lokal geöffnete Datei: Manifest wird im Speicher erzeugt, ohne Offline-Cache.
   */
  const web = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (web && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Offline-Cache geht es auch */ });
  if (web) {
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.webmanifest';
    document.head.append(link);
  } else try {
    const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#16325A"/><circle cx="48" cy="48" r="26" fill="none" stroke="#E8F0E9" stroke-width="11" stroke-dasharray="130 34" stroke-linecap="round" transform="rotate(-58 48 48)"/><circle cx="69" cy="27" r="8" fill="#FFE14D"/></svg>';
    const manifest = {
      name: 'Nullpunkt', short_name: 'Nullpunkt', start_url: location.href.split('#')[0], display: 'standalone',
      background_color: '#E8F0E9', theme_color: '#16325A',
      icons: [{ src: `data:image/svg+xml,${encodeURIComponent(iconSvg)}`, sizes: 'any', type: 'image/svg+xml' }],
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.append(link);
  } catch (e) { /* ohne Manifest geht es auch */ }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); App.installPrompt = e; State.notify(); });
  /* Änderungen aus einem anderen Tab übernehmen, aber laufende Eingaben schonen. */
  document.addEventListener('visibilitychange', () => {
    const busy = document.querySelector('dialog[open]') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (document.visibilityState === 'visible' && !busy && Vault.status === 'open') State.refresh();
  });
  Router.render();
})();
</script>
