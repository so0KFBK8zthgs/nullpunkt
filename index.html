    const isNow = S.ym === Utils.thisYm();
    return h('div', { class: 'page-head' },
      h('div', { class: 'month-nav' },
        iconBtn('left', 'Vorheriger Monat', () => go(-1)),
        h('h1', {}, Utils.monthLabel(S.ym)),
        iconBtn('right', 'Nächster Monat', () => go(1))),
      !isNow && h('button', { type: 'button', class: 'btn btn-quiet today', onclick: () => { S.ym = Utils.thisYm(); State.notify(); } }, 'Heute'));
  }

  /* ---- Nullring ---- */
  let lastRing = { fraction: null, state: null, accountYm: null };

  function zeroBlock(sum) {
    const { incomePlanned: inc, expensePlanned: exp, remaining: rest } = sum;
    const word = Config.CURRENCIES[cur()].word;
    const state = inc === 0 && exp === 0 ? 'empty' : rest === 0 ? 'closed' : rest < 0 ? 'over' : 'open';
    const fraction = inc > 0 ? Math.min(1, exp / inc) : (exp > 0 ? 1 : 0);
    const key = `${S.snap.account.id}:${S.ym}`;
    const same = lastRing.accountYm === key;
    const from = same && lastRing.fraction !== null ? lastRing.fraction : fraction;
    const justClosed = same && state === 'closed' && lastRing.state !== 'closed';
    lastRing = { fraction, state, accountYm: key };
    /* Nullpunkt erreicht: Konfetti und ein kurzes Vibrieren */
    if (justClosed) setTimeout(() => { Fun.confetti(); Fun.vibrate([15, 30, 15]); }, 380);

    const text = fmt(rest);
    const size = text.length <= 8 ? '1.625rem' : text.length <= 11 ? '1.3125rem' : '1.0625rem';
    const labels = { empty: 'zu verplanen', open: 'zu verplanen', over: 'zu viel verplant', closed: 'aufgegangen' };
    const messages = {
      empty: 'Trag zuerst deine erwarteten Einnahmen ein. Danach bekommt jeder ' + word + ' eine Aufgabe.',
      open: `${lab(rest)} haben noch keine Aufgabe.`,
      over: `Du hast ${lab(Math.abs(rest))} mehr verplant, als reinkommt. Kürze einen Posten oder erhöhe die Einnahmen.`,
      closed: `Jeder ${word} hat eine Aufgabe.`,
    };

    const ring = h('div', { class: 'ring' });
    /* Nur Zahlen fliessen in dieses Markup. */
    ring.innerHTML = `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-track" cx="100" cy="100" r="86"/><circle class="ring-arc" cx="100" cy="100" r="86" pathLength="100" stroke-dasharray="${(from * 100).toFixed(3)} 100" transform="rotate(-90 100 100)"/><circle class="ring-dot" cx="100" cy="14" r="9"/></svg>`;
    const arc = ring.querySelector('.ring-arc');
    /* Bei 0 % zeigte die runde Linienkappe sonst einen Punkt. */
    arc.style.visibility = fraction === 0 && from === 0 ? 'hidden' : 'visible';
    if (from !== fraction) requestAnimationFrame(() => requestAnimationFrame(() => arc.setAttribute('stroke-dasharray', `${(fraction * 100).toFixed(3)} 100`)));
    ring.append(h('div', { class: 'ring-center' },
      h('span', { class: `ring-amount num${state === 'open' || state === 'empty' ? ' mark' : ''}`, style: `--fs:${size}`, id: 'ring-amount' }, text),
      h('span', { class: 'ring-label' }, labels[state])));

    return h('section', { class: `zero is-${state}${justClosed ? ' just-closed' : ''}`, 'aria-label': 'Einnahmen minus Budget' },
      ring,
      h('div', { class: 'equation' },
        h('div', { class: 'eq-row' }, h('span', {}, 'Einnahmen'), h('span', { class: 'num' }, fmt(inc))),
        h('div', { class: 'eq-row' }, h('span', {}, 'minus Budget'), h('span', { class: 'num' }, fmt(exp))),
        h('div', { class: 'eq-row eq-total' }, h('span', {}, 'ergibt'), h('span', { class: `num${rest < 0 ? ' neg' : ''}` }, text))),
      h('p', { class: 'zero-msg', role: 'status' }, messages[state]));
  }

  /* ---- Backup sichern ---- */
  /* In einer eingebetteten Vorschau sind Downloads gesperrt. Dort erscheint der Inhalt als Text zum Kopieren. */
  function isFramed() { try { return window.top !== window.self; } catch (e) { return true; } }

  /* ---- Demo ---- */
  async function startDemo() {
    await guard(Demo.create());
    location.hash = '#/jetzt';
    toast('Demo-Konto mit Beispieldaten erstellt');
  }

  /* ---- Ansicht Budget ---- */
  function backupNotice() {
    const st = S.settings;
    const now = Date.now();
    const day = 86400000;
    if (st.backupSnoozeUntil && Date.parse(st.backupSnoozeUntil) > now) return null;
    if (S.snap.transactions.length === 0) return null;
    const last = st.lastBackupAt ? Date.parse(st.lastBackupAt) : null;
    if (last && now - last < Config.BACKUP_REMINDER_DAYS * day) return null;
    return h('div', { class: 'notice' },
      h('p', {}, last ? 'Dein letztes Backup ist über einen Monat alt.' : 'Deine Daten liegen nur auf diesem Gerät. Sichere sie mit einem Backup.'),
      h('div', { class: 'btn-row' },
        h('button', { type: 'button', class: 'btn', onclick: () => saveBackup() }, 'Backup sichern'),
        h('button', { type: 'button', class: 'btn btn-quiet', onclick: () => guard(State.patchSettings({ backupSnoozeUntil: new Date(now + Config.BACKUP_SNOOZE_DAYS * day).toISOString() })) }, 'Später')));
  }

  /** Beim Planen: Sparschweine mit Motivation und Vorschlag pro Monat */
  function planMotivation(source) {
    const actuals = Budget.actualsByItem(S.snap, source.id);
    const list = Budget.itemsOfMonth(S.snap, source.id).filter((i) => i.kind === 'fund' && (i.motivation || i.goalMinor > 0));
    if (!list.length) return null;
    return h('div', { class: 'plan-motivation' }, h('h3', {}, 'Deine Sparschweine'),
      list.map((i) => {
        const pg = Budget.piggy(S.snap, i, actuals);
        return h('div', { class: 'piggy' },
          h('div', { class: 'piggy-top' },
            h('span', { class: 'name piggy-name' }, Fun.pig(pg.goal > 0 ? pg.pct : 30, { size: 40, done: pg.status === 'reached' }), i.name),
            pg.goal > 0 && h('span', { class: 'num small' }, `${pg.pct} %`)),
          i.motivation && h('blockquote', { class: 'piggy-why' }, i.motivation),
          pg.perMonth > 0 && h('p', { class: 'small' }, `Vorschlag: ${lab(pg.perMonth)} pro Monat, damit es bis ${Utils.dateLabel(pg.goalDate)} reicht.`));
      }));
  }

  function monthEmpty() {
    const source = Budget.sourceMonth(S.snap, S.ym);
    const name = Utils.monthLabel(S.ym);
    const chk = Budget.startCheck(S.snap, S.ym);
    if (!chk.ok) {
      const prevName = Utils.monthLabel(chk.prev.ym);
      return h('div', { class: 'empty' },
        h('h2', {}, `Schliesse zuerst ${prevName} ab`),
        h('p', {}, `Bevor du ${name} beginnst, muss in ${prevName} jede Balance auf 0 stehen und Einnahmen minus Budget 0 ergeben. Verschiebe offene Beträge auf überzogene Posten oder in ein Sparschwein.`),
        closeList(chk),
        h('button', { type: 'button', class: 'btn btn-primary', onclick: () => { S.ym = chk.prev.ym; State.notify(); } }, `Zu ${prevName}`));
    }
    const make = (mode) => () => guard(State.createMonth(S.ym, mode));
    return h('div', { class: 'empty' },
      h('h2', {}, `${name} ist noch nicht geplant`),
      source
        ? [h('p', {}, `Übernimm die Posten aus ${Utils.monthLabel(source.ym)} und passe sie an, bis die Rechnung auf null aufgeht.`),
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: make('copy') }, 'Mit Beträgen übernehmen'),
            h('button', { type: 'button', class: 'btn', onclick: make('copy-empty') }, 'Nur Posten übernehmen')),
          planMotivation(source)]
        : [h('p', {}, 'Beginne mit der Vorlage oder lege deine Posten selbst an.'),
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: make('template') }, 'Vorlage verwenden'),
            h('button', { type: 'button', class: 'btn', onclick: make('empty') }, 'Leer beginnen'))]);
  }

  function itemRow(item, group, actuals) {
    const fig = Budget.itemFigures(S.snap, item, actuals);
    const income = group.type === 'income';
    const base = income ? fig.planned : fig.opening + fig.planned;
    const pct = base > 0 ? Math.min(100, Math.round((fig.actual / base) * 100)) : (fig.actual > 0 ? 100 : 0);
    /* Mehr einzahlen als geplant ist beim Sparschwein kein Fehler, deshalb nie rot. */
    const over = !income && !fig.isFund && fig.left < 0;
    const pg = fig.isFund ? Budget.piggy(S.snap, item, actuals) : null;
    let sub = null;
    if (pg) {
      sub = pg.goal > 0 ? `Gespart ${fmt(pg.saved)} von ${fmt(pg.goal)}` : `Gespart ${fmt(pg.saved)}`;
      if (pg.goal > 0 && pg.goalDate) sub += `, bis ${Utils.monthLabel(pg.goalDate.slice(0, 7))}`;
    }
    const handle = grip(item.name, `h-${item.lineId}`, (dir) => guard(State.moveItem(item, dir)));
    const row = h('div', { class: 'row', 'data-id': item.id },
      h('div', { class: 'row-namecell' }, handle,
      h('button', { type: 'button', class: 'row-name', 'data-fk': `n-${item.lineId}`, onclick: () => itemSheet(group, item) },
        pg
          ? h('span', { class: 'row-head' },
            Fun.pig(pg.goal > 0 ? pg.pct : 30, { size: 30, done: pg.status === 'reached', drop: Fun.deposited(item.id, pg.saved) }),
            h('span', { class: 'row-title' }, item.name))
          : h('span', { class: 'row-title' }, item.name),
        sub && h('span', { class: 'row-sub' }, sub),
        pg && pg.goal > 0
          ? goalBar(pg)
          : !pg && (fig.actual > 0) && h('span', { class: `meter${over ? ' over' : ''}` }, h('i', { style: `width:${pct}%` })),
        pg && item.motivation && h('span', { class: 'row-why' }, item.motivation))),
      h('div', { class: 'cell cell-input' }, plannedInput({
        value: item.plannedMinor, currency: cur(), label: `Geplant für ${item.name}`, fk: `p-${item.lineId}`,
        onCommit: (m) => guard(State.setPlanned(item.id, m)),
      })),
      /* Tippen auf die Ist-Zelle öffnet eine neue Buchung, mit diesem Posten vorausgewählt. */
      h('button', {
        type: 'button', class: 'cell num cell-tap', 'data-fk': `t-${item.lineId}`,
        'aria-label': `${fig.isFund ? 'Einzahlung' : income ? 'Einnahme' : 'Ausgabe'} für ${item.name} erfassen, bisher ${fmt(fig.actual)}`,
        onclick: () => txSheet(null, { type: income ? 'income' : 'expense', lineId: item.lineId }),
      }, icon('plus'), h('span', {}, fmt(fig.actual))),
      balCell(fig.balance, () => rebudgetSheet(item.id), item.name));
    /*
     * Posten verschieben: Ausgaben-Posten auch in eine andere Ausgaben-Gruppe.
     * Einnahmen und Sparschweine bleiben in ihrem Bereich.
     */
    const zoneOf = (sec) => ({ el: sec, end: sec.querySelector(':scope > .group-foot'), items: () => [...sec.children].filter((x) => x.classList.contains('row')) });
    draggable(row, handle, {
      zones: () => {
        const own = row.closest('.group');
        const main = row.closest('.budget-main');
        const secs = group.type === 'expense' && main ? [...main.querySelectorAll(':scope > .group-sortable')] : [own];
        return secs.filter(Boolean).map(zoneOf);
      },
      onDrop: (ids, parent) => {
        const target = parent && parent.dataset.id;
        const moved = target && target !== item.groupId;
        guard(State.moveItemTo(item.id, target || item.groupId, ids)).then(() => {
          if (moved) toast(`${item.name} nach ${(S.snap.groups.find((g) => g.id === target) || {}).name} verschoben`);
        });
      },
    });
    return row;
  }

  /* ---- Balance: farbig, damit offene Beträge auffallen ---- */
  function balCell(b, onTap, name) {
    const state = b === 0 ? 'zero' : b > 0 ? 'open' : 'over';
    const tip = { zero: 'Erledigt', open: 'Noch offen: antippen zum Umbudgetieren', over: 'Überzogen: antippen zum Ausgleichen' }[state];
    const pill = h('span', { class: `bal bal-${state}` }, state === 'zero' && icon('check'), fmt(b), h('span', { class: 'sr' }, `, ${tip}`));
    /* Offene und überzogene Balancen lassen sich antippen und direkt umbudgetieren. */
    if (onTap && b !== 0) return h('button', { type: 'button', class: 'cell num cell-bal', title: tip, 'aria-label': `Balance ${name}: ${fmt(b)}. Umbudgetieren`, onclick: onTap }, pill);
    return h('div', { class: 'cell num', title: tip }, pill);
  }

  /* ---- Sparschwein: Balken und Hinweistext ---- */
  function goalBar(pg) {
    return h('span', {
      class: `goal${pg.status === 'reached' ? ' done' : ''}`, role: 'progressbar',
      'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pg.pct), 'aria-label': `Sparziel zu ${pg.pct} Prozent erreicht`,
    }, h('i', { style: `width:${pg.pct}%` }), [25, 50, 75].map((x) => h('b', { style: `left:${x}%` })));
  }

  function piggyText(pg) {
    const when = pg.goalDate ? Utils.dateLabel(pg.goalDate) : '';
    switch (pg.status) {
      case 'none': return `Gespart: ${lab(pg.saved)}. Setze ein Sparziel, um den Fortschritt zu sehen.`;
      case 'reached': return `Ziel erreicht. ${lab(pg.saved)} gespart.`;
      case 'late': return `Das Zieldatum ${when} ist vorbei. Es fehlen noch ${lab(pg.missing)}.`;
      case 'due': return `Das Zieldatum ${when} liegt in diesem Monat. Es fehlen noch ${lab(pg.missing)}.`;
      default:
        return pg.perMonth !== null
          ? (pg.perMonth === 0
            ? `Noch ${lab(pg.missing)} bis ${when}. Mit der geplanten Einzahlung dieses Monats erreichst du das Ziel.`
            : `Noch ${lab(pg.missing)} bis ${when}. Zahle dafür ab nächstem Monat ${lab(pg.perMonth)} pro Monat ein.`)
          : `Noch ${lab(pg.missing)} bis zum Ziel.`;
    }
  }

  /** Übersicht eines Sparschweins: Motivation, Fortschritt, Hinweis */
  function piggyBlock(item, actuals, title) {
    const pg = Budget.piggy(S.snap, item, actuals);
    return h('div', { class: 'piggy' },
      h('div', { class: 'piggy-top' },
        h('span', { class: 'name piggy-name' }, Fun.pig(pg.goal > 0 ? pg.pct : 30, { size: 40, done: pg.status === 'reached' }), title ? item.name : 'Fortschritt'),
        h('span', { class: 'num small' }, pg.goal > 0 ? `${fmt(pg.saved)} von ${fmt(pg.goal)}, ${pg.pct} %` : fmt(pg.saved))),
      pg.goal > 0 && goalBar(pg),
      h('p', { class: 'small' }, piggyText(pg)),
      item.motivation && h('blockquote', { class: 'piggy-why' }, item.motivation));
  }

  function groupBlock(group, actuals) {
    const income = group.type === 'income';
    const items = Budget.itemsOfGroup(S.snap, group.id);
    const planned = Utils.sum(items, (i) => i.plannedMinor);
    const actual = Utils.sum(items, (i) => actuals.get(i.id) || 0);
    const balance = planned - actual;
    /* Ausgaben-Gruppen lassen sich verschieben, die Einnahmen bleiben oben. */
    const handle = !income && grip(group.name, `gh-${group.lineId}`, (dir) => guard(State.moveGroup(group, dir)));
    const section = h('section', { class: `group${income ? '' : ' group-sortable'}`, 'data-id': group.id },
      h('div', { class: 'group-head' },
        h('div', { class: 'group-titlecell' }, handle,
          h('button', { type: 'button', class: 'group-title', 'data-fk': `g-${group.lineId}`, onclick: () => groupSheet(group) }, group.name)),
        h('div', { class: 'col-head' }, 'Geplant'),
        h('div', { class: 'col-head' }, income ? 'Erhalten' : 'Ausgegeben'),
        h('div', { class: 'col-head', title: 'Geplant minus Ist. Soll am Monatsende 0 sein.' }, 'Balance')),
      items.map((i) => itemRow(i, group, actuals)),
      h('div', { class: 'group-foot' },
        h('button', { type: 'button', class: 'add', 'data-fk': `a-${group.lineId}`, onclick: () => itemSheet(group) }, icon('plus'), income ? 'Einnahme' : 'Posten'),
        h('div', { class: 'cell num' }, fmt(planned)),
        h('div', { class: 'cell num' }, fmt(actual)),
        balCell(balance)));
    if (handle) {
      draggable(section, handle, {
        list: () => (section.parentElement ? [...section.parentElement.children].filter((x) => x.classList.contains('group-sortable')) : [section]),
        onStart: () => section.parentElement.classList.add('sorting-groups'),
        onEnd: () => section.parentElement && section.parentElement.classList.remove('sorting-groups'),
        onDrop: (ids) => guard(State.reorder('groups', ids)),
      });
    }
    return section;
  }

  /** Eigener Bereich für Sparschweine, unabhängig von den Gruppen */
  function savingsSection(month, actuals) {
    const sg = Budget.savingsGroup(S.snap, month.id);
    const items = sg ? Budget.itemsOfGroup(S.snap, sg.id) : [];
    const planned = Utils.sum(items, (i) => i.plannedMinor);
    const paid = Utils.sum(items, (i) => actuals.get(i.id) || 0);
    const add = h('button', { type: 'button', class: 'add', 'data-fk': 'a-savings', onclick: () => itemSheet(null, null, { piggy: true, month }) }, icon('plus'), 'Sparschwein');
    if (!items.length) {
      return h('section', { class: 'group savings' },
        h('div', { class: 'group-head' }, h('h2', { class: 'group-title savings-title' }, 'Sparschweine')),
        h('p', { class: 'savings-empty soft' }, 'Ein Sparschwein sammelt Geld für ein Ziel über mehrere Monate. Was du einzahlst, bleibt drin und wird in den nächsten Monat mitgenommen.'),
        h('div', { class: 'btn-row' }, h('button', { type: 'button', class: 'btn', onclick: () => itemSheet(null, null, { piggy: true, month }) }, icon('plus'), 'Sparschwein anlegen')));
    }
    return h('section', { class: 'group savings' },
      h('div', { class: 'group-head' },
        h('h2', { class: 'group-title savings-title' }, 'Sparschweine'),
        h('div', { class: 'col-head' }, 'Geplant'),
        h('div', { class: 'col-head' }, 'Eingezahlt'),
        h('div', { class: 'col-head', title: 'Geplant minus Eingezahlt. Soll am Monatsende 0 sein.' }, 'Balance')),
      items.map((i) => itemRow(i, sg, actuals)),
      h('div', { class: 'group-foot' }, add,
        h('div', { class: 'cell num' }, fmt(planned)),
        h('div', { class: 'cell num' }, fmt(paid)),
        balCell(planned - paid)));
  }

  /** Liste der Posten, deren Balance noch nicht 0 ist */
  function closeList(chk) {
    return h('ul', { class: 'close-list' },
      chk.open.map((o) => h('li', {}, h('span', {}, o.item.name), h('span', { class: `num bal bal-${o.balance > 0 ? 'open' : 'over'}` }, fmt(o.balance)))),
      chk.unassignedCount > 0 && h('li', {}, h('span', {}, 'Buchungen ohne Posten'), h('span', { class: 'num' }, String(chk.unassignedCount))),
      chk.remaining !== 0 && h('li', {}, h('span', {}, 'Einnahmen minus Budget'), h('span', { class: `num bal bal-${chk.remaining > 0 ? 'open' : 'over'}` }, fmt(chk.remaining))));
  }

  function closeStatus(month) {
    const chk = Budget.closeCheck(S.snap, month.id);
    const next = Utils.monthName(Utils.addMonths(month.ym, 1));
    const n = chk.open.length;
    return h('div', { class: 'close-status', role: 'status' },
      chk.ok
        ? h('p', {}, `Alle Balancen stehen auf 0. Du kannst ${next} beginnen.`)
        : h('p', {}, [
          n > 0 && `${n === 1 ? '1 Posten hat' : `${n} Posten haben`} noch eine Balance ungleich 0.`,
          chk.unassignedCount > 0 && `${chk.unassignedCount === 1 ? '1 Buchung ist' : `${chk.unassignedCount} Buchungen sind`} ohne Posten.`,
          chk.remaining !== 0 && `Einnahmen minus Budget ergibt ${fmt(chk.remaining)}.`,
          `${next} lässt sich erst beginnen, wenn alles auf 0 steht.`,
        ].filter(Boolean).join(' ')),
      chk.ok && h('div', { class: 'stamp stamp-small' }, 'Abgeschlossen'),
      !chk.ok && h('p', { class: 'legend' },
        h('span', {}, h('i', { class: 'bal bal-open' }, 'orange'), 'noch offen'),
        h('span', {}, h('i', { class: 'bal bal-over' }, 'rot'), 'überzogen'),
        h('span', {}, 'Antippen zum Umbudgetieren')),
      h('button', { type: 'button', class: chk.ok ? 'btn btn-primary' : 'btn', onclick: () => closeAssistant(month.id) }, chk.ok ? `Weiter zu ${next}` : 'Monat abschliessen'));
  }

  function budget() {
    const month = Budget.monthOf(S.snap, S.ym);
    if (!month) return [monthNav(), monthEmpty()];
    const actuals = Budget.actualsByItem(S.snap, month.id);
    const groups = Budget.groupsOf(S.snap, month.id).filter((g) => g.type !== 'savings').sort((a, b) => (a.type === b.type ? a.sort - b.sort : a.type === 'income' ? -1 : 1));
    const open = Budget.unassigned(S.snap, month.id);
    const note = h('textarea', { class: 'input', id: 'month-note', rows: 2, value: month.note || '', placeholder: 'Besonderheiten in diesem Monat' });
    note.addEventListener('change', () => guard(State.saveMonthNote(month, note.value.trim())));

    return [
      monthNav(),
      backupNotice(),
      h('div', { class: 'budget-grid' },
        h('div', { class: 'budget-main' },
          groups.map((g) => groupBlock(g, actuals)),
          h('button', { type: 'button', class: 'add', onclick: () => groupSheet(null, month) }, icon('plus'), 'Gruppe'),
          savingsSection(month, actuals),
          h('div', { class: 'field month-note' }, h('label', { for: 'month-note' }, 'Notiz zum Monat'), note)),
        h('aside', { class: 'side' },
          zeroBlock(Budget.summary(S.snap, month.id)),
          closeStatus(month),
          open.length > 0 && h('button', {
            type: 'button', class: 'open-link',
            onclick: () => inboxSheet(),
          }, h('span', {}, open.length === 1 ? '1 Buchung ohne Posten' : `${open.length} Buchungen ohne Posten`), h('span', { class: 'mark num' }, 'Zuordnen')))),
    ];
  }

  /* ---- Formular: Gruppe ---- */
  function groupSheet(group, month) {
    const isNew = !group;
    sheet(isNew ? 'Gruppe hinzufügen' : 'Gruppe bearbeiten', (close) => {
      const name = h('input', { class: 'input', id: 'g-name', value: group ? group.name : '', required: true, maxlength: 60 });
      const err = h('p', { class: 'error', role: 'alert' });
      const income = group && group.type === 'income';
      const form = h('form', {
        class: 'form', novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          const v = name.value.trim();
          if (!v) { err.textContent = 'Gib der Gruppe einen Namen.'; name.setAttribute('aria-invalid', 'true'); name.focus(); return; }
          await guard(isNew ? State.addGroup(month, v) : State.updateGroup(group, { name: v }));
          close();
        },
      },
      h('div', { class: 'field' }, h('label', { for: 'g-name' }, 'Name'), name),
      err,
      h('button', { class: 'btn btn-primary btn-wide' }, isNew ? 'Gruppe hinzufügen' : 'Änderungen speichern'),
      !isNew && !income && h('div', { class: 'btn-row' },
        h('button', { type: 'button', class: 'btn', onclick: () => guard(State.moveGroup(group, -1)) }, icon('up'), 'Nach oben'),
        h('button', { type: 'button', class: 'btn', onclick: () => guard(State.moveGroup(group, 1)) }, icon('down'), 'Nach unten')),
      !isNew && !income && h('button', {
        type: 'button', class: 'btn btn-danger',
        onclick: async () => {
          const items = Budget.itemsOfGroup(S.snap, group.id);
          const n = State.txUsing(items.map((i) => i.id)).length;
          const ok = await confirm({
            title: 'Gruppe löschen?', danger: true, action: 'Gruppe löschen',
            text: `„${group.name}“ und ${items.length} Posten werden aus ${Utils.monthLabel(S.ym)} entfernt.${n ? ` ${n} Buchungen stehen danach ohne Posten da.` : ''}`,
          });
          if (ok) { await guard(State.deleteGroup(group)); close(); }
        },
      }, 'Gruppe löschen'));
      return form;
    });
  }

  /* ---- Formular: Posten ---- */
  /**
   * Formular für Posten und Sparschweine.
   * Ein neues Sparschwein: itemSheet(null, null, { piggy: true, month }).
   */
  function itemSheet(group, item, opts = {}) {
    const isNew = !item;
    const piggyMode = !!opts.piggy || (group && group.type === 'savings');
    const income = !piggyMode && group.type === 'income';
    const title = !isNew ? item.name : piggyMode ? 'Sparschwein anlegen' : income ? 'Einnahme hinzufügen' : 'Posten hinzufügen';
    sheet(title, (close) => {
      const name = h('input', { class: 'input', id: 'i-name', value: item ? item.name : '', required: true, maxlength: 60 });
      const planned = h('input', { class: 'input num', id: 'i-planned', inputmode: 'decimal', autocomplete: 'off', value: item ? Money.toInput(item.plannedMinor, cur()) : '', placeholder: fmt(0) });
      const groups = piggyMode ? [] : Budget.groupsOf(S.snap, group.monthId).filter((g) => g.type === group.type);
      const groupSel = !isNew && groups.length > 1 ? h('select', { class: 'input', id: 'i-group', value: group.id }, groups.map((g) => h('option', { value: g.id }, g.name))) : null;
      const err = h('p', { class: 'error', role: 'alert' });
      let facts = null, linked = null, piggyNow = null;

      /* Felder des Sparschweins */
      const goal = h('input', { class: 'input num', id: 'i-goal', inputmode: 'decimal', autocomplete: 'off', value: item && item.goalMinor ? Money.format(item.goalMinor, cur()) : '', placeholder: fmt(0) });
      const goalDate = h('input', { class: 'input', id: 'i-goal-date', type: 'date', value: (item && item.goalDate) || '' });
      const motivation = h('textarea', { class: 'input', id: 'i-why', rows: 3, maxlength: 500, value: (item && item.motivation) || '', placeholder: 'Wofür sparst du, und warum ist es dir wichtig?' });
      const nameLabel = h('label', { for: 'i-name' }, piggyMode ? 'Titel' : 'Name');
      const goalBox = piggyMode && h('div', { class: 'piggy-goal' },
        h('div', { class: 'field' }, h('label', { for: 'i-goal' }, `Sparziel in ${cur()}`), goal),
        h('div', { class: 'field' }, h('label', { for: 'i-goal-date' }, 'Gespart bis'), goalDate),
        h('div', { class: 'field' }, h('label', { for: 'i-why' }, 'Meine Motivation'), motivation,
          h('p', { class: 'small soft' }, 'Erscheint als Erinnerung beim Sparschwein und in der Auswertung.')));

      if (item) {
        const actuals = Budget.actualsByItem(S.snap, item.monthId);
        const f = Budget.itemFigures(S.snap, item, actuals);
        const row = (a, b) => h('div', {}, h('dt', {}, a), h('dd', {}, b));
        facts = h('dl', { class: 'facts' },
          row(piggyMode ? 'Eingezahlt diesen Monat' : income ? 'Erhalten' : 'Ausgegeben', fmt(f.actual)),
          row('Balance', fmt(f.balance)),
          piggyMode && f.withdrawn > 0 && row('Entnommen diesen Monat', fmt(f.withdrawn)),
          piggyMode && row('Aus Vormonaten', fmt(f.opening)),
          piggyMode && row('Im Sparschwein', fmt(f.saved)));
        if (piggyMode) {
          piggyNow = h('div', { class: 'form' }, piggyBlock(item, actuals, false),
            h('button', { type: 'button', class: 'btn', onclick: () => { close(); txSheet(null, { type: 'withdrawal', lineId: item.lineId }); } }, 'Geld entnehmen'));
        }
        const txs = S.snap.transactions.filter((t) => t.splits.some((s) => s.itemId === item.id)).sort((a, b) => b.date.localeCompare(a.date));
        if (txs.length) {
          linked = h('div', {}, h('h3', {}, piggyMode ? 'Einzahlungen und Entnahmen' : 'Buchungen'), txs.map((t) => {
            const amt = fmt(t.splits.find((s) => s.itemId === item.id).amountMinor);
            const part = piggyMode ? (t.type === 'withdrawal' ? `−${amt}` : `+${amt}`) : amt;
            return h('button', { type: 'button', class: 'tx', onclick: () => { close(); txSheet(t); } },
              h('span', { class: 'tx-main' }, h('span', { class: 'tx-title' }, t.merchant || 'Ohne Bezeichnung'),
                h('span', { class: 'tx-sub' }, `${piggyMode ? (t.type === 'withdrawal' ? 'Entnahme, ' : 'Einzahlung, ') : ''}${Utils.dayLabel(t.date)}`)),
              h('span', { class: 'num' }, part));
          }));
        }
      }

      return h('form', {
        class: 'form', novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          const v = name.value.trim();
          if (!v) { err.textContent = piggyMode ? 'Gib dem Sparschwein einen Titel.' : 'Gib dem Posten einen Namen.'; name.focus(); return; }
          const text = planned.value.trim();
          const minor = text === '' ? 0 : Money.parse(text, cur());
          if (minor === null) { err.textContent = `Betrag nicht erkannt. Beispiel: ${fmt(123450)}`; planned.focus(); return; }
          const fields = { name: v, plannedMinor: minor, kind: piggyMode ? 'fund' : 'normal' };
          if (piggyMode) {
            const gt = goal.value.trim();
            const g = gt === '' ? 0 : Money.parse(gt, cur());
            if (g === null) { err.textContent = `Sparziel nicht erkannt. Beispiel: ${fmt(500000)}`; goal.focus(); return; }
            if (goalDate.value && !Utils.isValidDate(goalDate.value)) { err.textContent = 'Wähle ein gültiges Datum.'; goalDate.focus(); return; }
            Object.assign(fields, { goalMinor: g, goalDate: goalDate.value || '', motivation: motivation.value.trim() });
          }
          if (groupSel) fields.groupId = groupSel.value;
          if (isNew && piggyMode) await guard(State.addPiggy(opts.month, fields));
          else await guard(isNew ? State.addItem(group, fields) : State.updateItem(item, fields));
          close();
        },
      },
      piggyNow,
      facts,
      h('div', { class: 'field' }, nameLabel, name),
      h('div', { class: 'field' }, h('label', { for: 'i-planned' }, piggyMode ? `Einzahlung geplant in ${Utils.monthName(S.ym)}, ${cur()}` : `Geplant in ${cur()}`), planned,
        piggyMode && h('p', { class: 'small soft' }, 'Eingezahlt ist, was du als Buchung auf dieses Sparschwein erfasst. Der gesparte Betrag wird in den nächsten Monat mitgenommen.')),
      goalBox,
      groupSel && h('div', { class: 'field' }, h('label', { for: 'i-group' }, 'Gruppe'), groupSel),
      err,
      h('button', { class: 'btn btn-primary btn-wide' }, isNew ? (piggyMode ? 'Sparschwein anlegen' : 'Hinzufügen') : 'Änderungen speichern'),
      !isNew && h('div', { class: 'btn-row' },
        h('button', { type: 'button', class: 'btn', onclick: () => guard(State.moveItem(item, -1)).then(close) }, icon('up'), 'Nach oben'),
        h('button', { type: 'button', class: 'btn', onclick: () => guard(State.moveItem(item, 1)).then(close) }, icon('down'), 'Nach unten')),
      linked,
      !isNew && h('button', {
        type: 'button', class: 'btn btn-danger',
        onclick: async () => {
          const n = State.txUsing([item.id]).length;
          const what = piggyMode ? 'Sparschwein' : 'Posten';
          const ok = await confirm({
            title: `${what} löschen?`, danger: true, action: `${what} löschen`,
            text: `„${item.name}“ wird aus ${Utils.monthLabel(S.ym)} entfernt.${n ? ` ${n} Buchungen stehen danach ohne Posten da.` : ''}`,
          });
          if (ok) { await guard(State.deleteItem(item)); close(); }
        },
      }, `${piggyMode ? 'Sparschwein' : 'Posten'} löschen`));
    });
  }

  /* ---- Formular: Buchung ---- */
  function defaultDate() { return S.ym === Utils.thisYm() ? Utils.today() : `${S.ym}-01`; }

  /**
   * Buchungsformular. preset füllt eine neue Buchung vor,
   * etwa { type: 'withdrawal', lineId } für „Geld entnehmen“.
   */
  function txSheet(tx, preset = {}) {
    const isNew = !tx;
    const c = cur();
    const st = {
      type: tx ? tx.type : (preset.type || 'expense'),
      date: tx ? tx.date : defaultDate(),
      split: false,
      rows: [{ lineId: preset.lineId || '', text: '' }],
    };
    if (tx && tx.splits.length) {
      const mapped = tx.splits.map((s) => ({ lineId: (S.snap.items.find((i) => i.id === s.itemId) || {}).lineId || '', text: Money.format(s.amountMinor, c) }));
      st.rows = mapped;
      st.split = mapped.length > 1;
    }

    sheet(isNew ? (st.type === 'withdrawal' ? 'Geld entnehmen' : 'Buchung erfassen') : 'Buchung bearbeiten', (close) => {
      const amount = h('input', { class: 'input input-big', id: 't-amount', inputmode: 'decimal', autocomplete: 'off', value: tx ? Money.format(tx.amountMinor, c) : '', placeholder: Money.format(0, c), 'aria-describedby': 't-err' });
      const date = h('input', { class: 'input', id: 't-date', type: 'date', value: st.date, required: true });
      const merchant = h('input', { class: 'input', id: 't-merchant', value: tx ? tx.merchant : '', maxlength: 80, autocomplete: 'off' });
      const note = h('input', { class: 'input', id: 't-note', value: tx ? tx.note : '', maxlength: 200, autocomplete: 'off' });
      const repeat = h('input', { type: 'checkbox', id: 't-repeat', style: 'width:1.25rem;height:1.25rem' });
      const err = h('p', { class: 'error', id: 't-err', role: 'alert' });
      const hint = h('p', { class: 'small soft' });
      const host = h('div', {});

      const isWithdrawal = () => st.type === 'withdrawal';
      const merchantLabel = h('label', { for: 't-merchant' }, isWithdrawal() ? 'Wofür' : 'Empfänger oder Zweck');
      const avail = h('p', { class: 'small', 'aria-live': 'polite' });

      /** Stand des gewählten Sparschweins im Monat der Buchung, ohne diese Buchung selbst */
      function piggyAvailable(lineId) {
        const month = Budget.monthOf(S.snap, Utils.ymOf(st.date));
        const item = month && S.snap.items.find((i) => i.monthId === month.id && i.lineId === lineId);
        if (!item) return null;
        const f = Budget.itemFigures(S.snap, item, Budget.actualsByItem(S.snap, month.id));
        const own = tx && tx.type === 'withdrawal' && tx.monthId === month.id ? Utils.sum(tx.splits.filter((x) => x.itemId === item.id), (x) => x.amountMinor) : 0;
        return f.saved + own;
      }
      function updateAvail() {
        avail.textContent = ''; avail.className = 'small';
        if (!isWithdrawal() || !st.rows[0].lineId) return;
        const have = piggyAvailable(st.rows[0].lineId);
        if (have === null) return;
        const a = amountMinor();
        if (a && a > have) { avail.textContent = `Im Sparschwein sind nur ${lab(have)}. Danach steht es im Minus.`; avail.className = 'small neg'; }
        else avail.textContent = `Im Sparschwein: ${lab(have)}`;
      }

      function select(row, label) {
        const groups = Budget.pickerGroups(S.snap, Utils.ymOf(st.date), st.type);
        return h('select', {
          class: 'input', 'aria-label': label, value: row.lineId,
          onchange: (e) => { row.lineId = e.target.value; updateAvail(); },
        }, h('option', { value: '' }, isWithdrawal() ? 'Sparschwein wählen' : 'Noch nicht zuordnen'),
        groups.map((g) => h('optgroup', { label: g.name }, g.items.map((i) => h('option', { value: i.lineId }, i.name)))));
      }

      const amountMinor = () => Money.parse(amount.value, c);
      function restMinor() {
        const a = amountMinor() || 0;
        return a - Utils.sum(st.rows, (r) => Money.parse(r.text, c) || 0);
      }
      const restEl = h('span', { class: 'num' });
      function updateRest() { const r = restMinor(); restEl.textContent = fmt(r); restEl.className = `num${r !== 0 ? ' neg' : ''}`; }

      function renderPosting() {
        host.replaceChildren();
        if (isWithdrawal()) {
          host.append(h('div', { class: 'field' }, h('span', { class: 'label' }, 'Aus Sparschwein'), select(st.rows[0], 'Sparschwein'), avail,
            h('p', { class: 'small soft' }, 'Eine Entnahme belastet dein Monatsbudget nicht. Sie verringert nur den Stand des Sparschweins.')));
          updateAvail();
          return;
        }
        if (!st.split) {
          host.append(h('div', { class: 'field' },
            h('span', { class: 'label' }, 'Posten'),
            select(st.rows[0], 'Posten'),
            h('button', { type: 'button', class: 'add', onclick: () => {
              st.split = true;
              st.rows[0].text = amount.value;
              st.rows.push({ lineId: '', text: '' });
              renderPosting();
            } }, icon('plus'), 'Auf mehrere Posten aufteilen')));
          return;
        }
        host.append(h('div', { class: 'field' }, h('span', { class: 'label' }, 'Aufteilung'),
          st.rows.map((row, i) => {
            const inp = h('input', { class: 'input num', inputmode: 'decimal', autocomplete: 'off', value: row.text, 'aria-label': `Betrag Teil ${i + 1}`, placeholder: fmt(0) });
            inp.addEventListener('input', () => { row.text = inp.value; updateRest(); });
            return h('div', { class: 'split-row' }, select(row, `Posten Teil ${i + 1}`), inp,
              iconBtn('close', `Teil ${i + 1} entfernen`, () => {
                st.rows.splice(i, 1);
                if (st.rows.length < 2) { st.split = false; st.rows = st.rows.length ? st.rows : [{ lineId: '', text: '' }]; }
                renderPosting();
              }));
          }),
          h('button', { type: 'button', class: 'add', onclick: () => {
            const r = Math.max(0, restMinor());
            st.rows.push({ lineId: '', text: r ? Money.format(r, c) : '' });
            renderPosting();
          } }, icon('plus'), 'Weiterer Teil'),
          h('div', { class: 'split-rest' }, h('span', {}, 'Noch zu verteilen'), restEl)));
        updateRest();
      }

      /* Bleibt ein gewählter Posten im neuen Monat nicht verfügbar, wird er geleert. */
      function refreshPicker(message) {
        const valid = new Set(Budget.pickerGroups(S.snap, Utils.ymOf(st.date), st.type).flatMap((g) => g.items.map((i) => i.lineId)));
        let cleared = false;
        st.rows.forEach((r) => { if (r.lineId && !valid.has(r.lineId)) { r.lineId = ''; cleared = true; } });
        hint.textContent = cleared && message ? message : '';
        renderPosting();
      }

      amount.addEventListener('input', () => { if (st.split) updateRest(); updateAvail(); });
      date.addEventListener('change', () => { if (Utils.isValidDate(date.value)) { st.date = date.value; refreshPicker('Der gewählte Posten fehlt in diesem Monat. Wähle einen anderen.'); } });
      renderPosting();

      const typeRadio = (value, text) => h('label', {}, h('input', {
        type: 'radio', name: 't-type', value, checked: st.type === value,
        onchange: () => {
          st.type = value;
          /* Eine Entnahme kommt immer aus genau einem Sparschwein. */
          if (value === 'withdrawal' && st.split) { st.split = false; st.rows = [st.rows[0]]; }
          merchantLabel.textContent = value === 'withdrawal' ? 'Wofür' : 'Empfänger oder Zweck';
          refreshPicker();
        },
      }), h('span', {}, text));

      return h('form', {
        class: 'form', novalidate: true,
        onsubmit: async (e) => {
          e.preventDefault();
          err.textContent = '';
          const a = amountMinor();
          if (a === null || a <= 0) { err.textContent = `Gib einen Betrag über null ein. Beispiel: ${fmt(123450)}`; amount.setAttribute('aria-invalid', 'true'); amount.focus(); return; }
          amount.removeAttribute('aria-invalid');
          if (!Utils.isValidDate(date.value)) { err.textContent = 'Wähle ein Datum.'; date.focus(); return; }
          const startChk = Budget.startCheck(S.snap, Utils.ymOf(date.value));
          if (!startChk.ok) {
            err.textContent = `${Utils.monthLabel(Utils.ymOf(date.value))} ist noch nicht begonnen. Bringe zuerst jede Balance in ${Utils.monthLabel(startChk.prev.ym)} auf 0.`;
            date.focus(); return;
          }

          let lineSplits = [];
          if (isWithdrawal()) {
            if (!st.rows[0].lineId) { err.textContent = 'Wähle das Sparschwein, aus dem du bezahlst.'; return; }
            lineSplits = [{ lineId: st.rows[0].lineId, amountMinor: a }];
          } else if (st.split) {
            const merged = new Map();
            for (const r of st.rows) {
              const part = Money.parse(r.text, c);
              if (!r.lineId) { err.textContent = 'Wähle für jeden Teil einen Posten.'; return; }
              if (part === null || part <= 0) { err.textContent = 'Jeder Teil braucht einen Betrag über null.'; return; }
              merged.set(r.lineId, (merged.get(r.lineId) || 0) + part);
            }
            const total = [...merged.values()].reduce((x, y) => x + y, 0);
            if (total !== a) { err.textContent = `Die Teile ergeben ${fmt(total)}, der Betrag ist ${fmt(a)}.`; return; }
            lineSplits = [...merged].map(([lineId, amountMinor]) => ({ lineId, amountMinor }));
          } else if (st.rows[0].lineId) {
            lineSplits = [{ lineId: st.rows[0].lineId, amountMinor: a }];
          }

          await guard(State.saveTransaction({
            id: tx ? tx.id : null, date: date.value, type: st.type,
            merchant: merchant.value.trim(), note: note.value.trim(), amountMinor: a, lineSplits,
            repeat: repeat.checked && !isWithdrawal(),
          }));
          close();
          toast(isNew ? (isWithdrawal() ? 'Entnahme erfasst' : 'Buchung erfasst') : 'Änderungen gespeichert');
        },
      },
      h('div', { class: 'segment', role: 'radiogroup', 'aria-label': 'Art der Buchung' }, typeRadio('expense', 'Ausgabe'), typeRadio('income', 'Einnahme'), typeRadio('withdrawal', 'Entnahme')),
      h('div', { class: 'field' }, h('label', { for: 't-amount' }, 'Betrag'), h('div', { class: 'affix' }, amount, h('span', {}, c === 'CHF' ? 'CHF' : '€'))),
      h('div', { class: 'field' }, h('label', { for: 't-date' }, 'Datum'), date),
      h('div', { class: 'field' }, merchantLabel, merchant),
      host, hint,
      h('div', { class: 'field' }, h('label', { for: 't-note' }, 'Notiz'), note),
      isNew && h('label', { class: 'check-row' }, repeat, 'Jeden Monat am gleichen Tag wiederholen'),
      err,
      h('button', { class: 'btn btn-primary btn-wide' }, isNew ? (st.type === 'withdrawal' ? 'Entnahme erfassen' : 'Buchung erfassen') : 'Änderungen speichern'),
      !isNew && h('button', {
        type: 'button', class: 'btn btn-danger',
        onclick: async () => {
          const ok = await confirm({ title: 'Buchung löschen?', danger: true, action: 'Buchung löschen', text: `${tx.merchant || 'Ohne Bezeichnung'}, ${lab(tx.amountMinor)}` });
          if (ok) { await guard(State.deleteTransaction(tx.id)); close(); }
        },
      }, 'Buchung löschen'));
    });
  }

  /* ---- Ansicht Buchungen ---- */
  function txListNodes() {
    const month = Budget.monthOf(S.snap, S.ym);
    let txs = month ? Budget.txOfMonth(S.snap, month.id) : [];
    const total = txs.length;
    if (S.txFilter === 'open') txs = txs.filter((t) => t.splits.length === 0);
    const q = S.txSearch.trim().toLowerCase();
    if (q) txs = txs.filter((t) => `${t.merchant} ${t.note}`.toLowerCase().includes(q));
    if (txs.length === 0) {
      if (total === 0) {
        return h('div', { class: 'empty' }, h('h2', {}, `Keine Buchungen in ${Utils.monthName(S.ym)}`), h('p', {}, 'Erfasse Einnahmen und Ausgaben, sobald sie anfallen.'),
          h('button', { type: 'button', class: 'btn btn-primary', onclick: () => txSheet() }, 'Buchung erfassen'));
      }
      return h('div', { class: 'empty' }, h('p', {}, S.txFilter === 'open' && !q ? 'Alle Buchungen haben einen Posten.' : 'Keine Buchung passt zu dieser Suche.'));
    }
    const itemsById = new Map(S.snap.items.map((i) => [i.id, i]));
    const byDay = new Map();
    txs.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt)).forEach((t) => {
      if (!byDay.has(t.date)) byDay.set(t.date, []);
      byDay.get(t.date).push(t);
    });
    return [...byDay].map(([date, list]) => h('section', { class: 'day' },
      h('h3', {}, Utils.dayLabel(date)),
      list.map((t) => {
        const names = t.splits.map((s) => (itemsById.get(s.itemId) || {}).name).filter(Boolean);
        const where = t.type === 'withdrawal' ? `Aus Sparschwein ${names.join(', ')}` : names.join(', ');
        const sub = [where, t.note].filter(Boolean).join(': ');
        return h('button', { type: 'button', class: 'tx', onclick: () => txSheet(t) },
          h('span', { class: 'tx-main' },
            h('span', { class: 'tx-title' }, t.merchant || 'Ohne Bezeichnung'),
            t.splits.length === 0
              ? h('span', { class: 'tx-sub' }, h('span', { class: 'mark' }, 'Ohne Posten'), t.note ? ` ${t.note}` : '')
              : h('span', { class: 'tx-sub' }, sub)),
          h('span', { class: 'num' }, `${t.type === 'income' ? '+' : '−'}${fmt(t.amountMinor)}`));
      })));
  }

  function transactions() {
    const list = h('div', {});
    const draw = () => UI.mount(list, txListNodes());
    draw();
    const search = h('input', { class: 'input search', type: 'search', placeholder: 'Empfänger oder Notiz suchen', 'aria-label': 'Buchungen durchsuchen', value: S.txSearch });
    search.addEventListener('input', () => { S.txSearch = search.value; draw(); });
    const radio = (value, text) => h('label', {}, h('input', {
      type: 'radio', name: 'tx-filter', value, checked: S.txFilter === value,
      onchange: () => { S.txFilter = value; draw(); },
    }), h('span', {}, text));
    return [monthNav(), h('div', { class: 'tools' }, search, h('div', { class: 'segment', role: 'radiogroup', 'aria-label': 'Filter' }, radio('all', 'Alle'), radio('open', 'Ohne Posten'))), list];
  }

  /* ---- Ansicht Auswertung ---- */
  function reports() {
    const month = Budget.monthOf(S.snap, S.ym);
    if (!month) return [monthNav(), h('div', { class: 'empty' }, h('p', {}, `Für ${Utils.monthLabel(S.ym)} gibt es noch kein Budget.`))];
    const sum = Budget.summary(S.snap, month.id);
    const actuals = Budget.actualsByItem(S.snap, month.id);
    const expenseGroups = Budget.groupsOf(S.snap, month.id).filter((g) => g.type === 'expense');
    const net = sum.incomeActual - sum.expenseActual - sum.savingsActual;
    const stat = (t, v, cls) => h('div', {}, h('span', { class: 'soft small' }, t), h('span', { class: `v num${cls || ''}` }, v));

    const groupRows = expenseGroups.map((g) => {
      const items = Budget.itemsOfGroup(S.snap, g.id);
      const planned = Utils.sum(items, (i) => i.plannedMinor);
      const spent = Utils.sum(items, (i) => actuals.get(i.id) || 0);
      const max = Math.max(planned, spent, 1);
      const over = spent > planned;
      return h('div', { class: 'bar-row', title: `${g.name}: ${lab(spent)} von ${lab(planned)}` },
        h('div', { class: 'bar-top' }, h('span', { class: 'name' }, g.name), h('span', { class: 'num small' }, `${fmt(spent)} von ${fmt(planned)}`)),
        h('span', { class: `bar${over ? ' over' : ''}` }, h('i', { style: `width:${(spent / max) * 100}%` }), planned > 0 && h('b', { style: `left:calc(${(planned / max) * 100}% - 2px)` })));
    });

    /* Leere Monate am Anfang ausblenden, bis Daten vorhanden sind. */
    const allTrend = Budget.trend(S.snap, S.ym, 6);
    const firstData = allTrend.findIndex((r) => r.income || r.expense);
    const trend = firstData < 0 ? allTrend : allTrend.slice(firstData);
    const trendMax = Math.max(1, ...trend.flatMap((r) => [r.income, r.expense]));
    const hasTrend = trend.some((r) => r.income || r.expense);
    const line = (v, color, name, m) => h('div', { class: 'trend-line', title: `${name} ${Utils.monthLabel(m)}: ${lab(v)}` },
      h('span', { class: 'track' }, v > 0 && h('i', { style: `width:${(v / trendMax) * 100}%;background:var(${color})` })),
      h('span', { class: 'num' }, fmt(v)));

    const funds = Budget.groupsOf(S.snap, month.id).flatMap((g) => Budget.itemsOfGroup(S.snap, g.id)).filter((i) => i.kind === 'fund');

    return [
      monthNav(),
      h('div', { class: 'stat-row' },
        stat('Erhalten', fmt(sum.incomeActual)),
        stat('Ausgegeben', fmt(sum.expenseActual)),
        stat('Eingezahlt', fmt(sum.savingsActual)),
        sum.withdrawalActual > 0 && stat('Aus Sparschweinen bezahlt', fmt(sum.withdrawalActual)),
        stat('Differenz', fmt(net), net < 0 ? ' neg' : '')),
      funds.length > 0 && h('section', { class: 'section' }, h('h2', {}, 'Sparschweine'),
        funds.map((f) => piggyBlock(f, actuals, true))),
      h('section', { class: 'section' }, h('h2', {}, 'Ausgaben je Gruppe'),
        h('p', { class: 'lead soft' }, 'Der Balken zeigt das Ausgegebene, der Strich das Geplante.'),
        groupRows.length ? groupRows : h('p', { class: 'soft' }, 'Noch keine Ausgaben-Gruppen.')),
      h('section', { class: 'section' }, h('h2', {}, 'Letzte 6 Monate'),
        hasTrend
          ? [h('div', { class: 'legend' }, h('span', {}, h('i', { style: 'background:var(--income)' }), 'Erhalten'), h('span', {}, h('i', { style: 'background:var(--expense)' }), 'Ausgegeben')),
            trend.map((r) => h('div', { class: 'trend-row' },
              h('span', { class: 'small' }, Utils.monthShort(r.ym)),
              h('div', { class: 'trend-bars' }, line(r.income, '--income', 'Erhalten', r.ym), line(r.expense, '--expense', 'Ausgegeben', r.ym))))]
          : h('p', { class: 'soft' }, 'Sobald du Buchungen erfasst, erscheint hier der Verlauf.')),
      yearReview(S.ym.slice(0, 4)),
    ];
  }

  async function importFile(file) {
    if (file.size > 25 * 1024 * 1024) { toast('Die Datei ist zu gross für ein Nullpunkt-Backup.', true); return; }
    let raw;
    try { raw = JSON.parse(await file.text()); }
    catch (e) { toast('Die Datei ist kein gültiges JSON.', true); return; }
    if (App.Crypto.isEncryptedBackup(raw)) { askBackupPassword(raw); return; }
    await importParsed(raw);
  }

  /** Prüft ein (entschlüsseltes) Backup und ersetzt nach Bestätigung alle Daten. */
  async function importParsed(raw) {
    const res = Backup.validate(raw);
    if (!res.ok) {
      sheet('Backup nicht importiert', () => h('div', { class: 'form' },
        h('p', {}, 'Die Datei wurde geprüft und abgelehnt. Deine Daten sind unverändert.'),
        h('ul', { class: 'small', style: 'margin:0;padding-left:1.25rem' }, res.errors.slice(0, 8).map((m) => h('li', {}, m))),
        res.errors.length > 8 && h('p', { class: 'small soft' }, `Dazu ${res.errors.length - 8} weitere Fehler.`)));
      return;
    }
    const ok = await confirm({
      title: 'Backup importieren?', danger: true, action: 'Alle Daten ersetzen',
      text: `Das Backup enthält ${res.counts.accounts} Konten, ${res.counts.months} Monate und ${res.counts.transactions} Buchungen. Alle Daten auf diesem Gerät werden dadurch ersetzt.`,
    });
    if (!ok) return;
    await guard(Backup.restore(res.data));
    toast('Backup importiert');
  }

     Neue Abläufe: Live-Sheets, Umbudgetieren, Abschluss, Posteingang,
