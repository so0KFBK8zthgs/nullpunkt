})();

/* ==========================================================================
   6c ERINNERUNGEN: Kalenderdatei (.ics) ohne Server
   ========================================================================== */
App.Reminders = (() => {
  const pad = (n) => String(n).padStart(2, '0');
  const DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const local = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

  /**
   * Zwei wiederkehrende Termine: alle 2 Wochen Bank-Import, am letzten Tag des
   * Monats der Abschluss. Lokale Uhrzeit ohne Zeitzone, damit sie überall passt.
   */
  function ics({ weekday, time }) {
    const [hh, mm] = time.split(':').map(Number);
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm);
    let diff = (weekday - start.getDay() + 7) % 7;
    if (diff === 0 && start < now) diff = 7;
    start.setDate(start.getDate() + diff);
    let last = new Date(now.getFullYear(), now.getMonth() + 1, 0, 19, 0);
    if (last < now) last = new Date(now.getFullYear(), now.getMonth() + 2, 0, 19, 0);
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const id = App.Utils.uid();
    const ev = (uid, dt, rrule, title, desc) => [
      'BEGIN:VEVENT', `UID:${uid}-${id}@nullpunkt`, `DTSTAMP:${stamp}`, `DTSTART:${local(dt)}`, 'DURATION:PT15M',
      `RRULE:${rrule}`, `SUMMARY:${title}`, `DESCRIPTION:${desc}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT',
    ];
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nullpunkt//DE', 'CALSCALE:GREGORIAN',
      ...ev('import', start, `FREQ=WEEKLY;INTERVAL=2;BYDAY=${DAYS[weekday]}`, 'Nullpunkt: Bank-Import', 'CSV aus dem E-Banking laden und die Zahlungen zuordnen. Dauert etwa 10 Minuten.'),
      ...ev('close', last, 'FREQ=MONTHLY;BYMONTHDAY=-1', 'Nullpunkt: Monat abschliessen', 'Alle Balancen auf 0 bringen und den nächsten Monat beginnen.'),
      'END:VCALENDAR'].join('\r\n');
  }

  return { ics };
})();

/* ==========================================================================
   6d PFLEGE: Datenschutz-Bereinigung nach dem Entsperren
   Läuft einmal pro Datenstand: maskiert Bankdaten
   in allen Empfängerfeldern und ersetzt Duplikat-Schlüssel und
   Bankformat-Kennungen durch Prüfsummen.
   Läuft auch nach dem Import älterer Backups.
   ========================================================================== */
App.Maintenance = (() => {
  const { DB, Repo, Crypto, Importer } = App;
  const isHash = (s) => /^[0-9a-f]{64}$/.test(s);
  const VERSION = 1;

  async function run() {
    const settings = await Repo.loadSettings();
    if ((settings.privacyVersion || 0) >= VERSION) return;
    const ops = [];
    for (const t of await DB.getAll('transactions')) {
      const n = { ...t };
      let changed = false;
      if (typeof t.importKey === 'string' && !isHash(t.importKey)) { n.importKey = await Crypto.sha256Hex(t.importKey); changed = true; }
      /* Auch von Hand erfasste Empfänger: IBAN oder Kartennummern gehören nicht in die App. */
      const m = Importer.sanitize(t.merchant);
      if (m !== t.merchant) { n.merchant = m; changed = true; }
      if (changed) ops.push({ store: 'transactions', put: n });
    }
    const profiles = {};
    for (const [k, v] of Object.entries(settings.importProfiles || {})) profiles[isHash(k) ? k : await Crypto.sha256Hex(k)] = v;
    ops.push(Repo.settingsOp({ ...settings, importProfiles: profiles, privacyVersion: VERSION }));
    await DB.apply(ops);
  }

  return { run };
})();

/* ==========================================================================
   7 STATE: Zustand, Benachrichtigung und Aktionen
   ========================================================================== */
App.State = (() => {
  const { DB, Repo, Budget, Utils, Config, Importer, Crypto } = App;
  const { uid, nextSort, ymOf } = Utils;
  const listeners = new Set();
  const s = {
    settings: null, accounts: [], snap: null,
    ym: Utils.thisYm(),
    txFilter: 'all', txSearch: '',
  };

  /** Gibt eine Funktion zum Abmelden zurück. */
  const subscribe = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
  const notify = () => listeners.forEach((fn) => fn());

  /** Entfernt alle entschlüsselten Daten aus dem Arbeitsspeicher. */
  function clear() {
    s.settings = null; s.accounts = []; s.snap = null;
    s.ym = Utils.thisYm(); s.txFilter = 'all'; s.txSearch = '';
  }

  /** Lädt den Stand aus der Datenbank neu und zeichnet die Oberfläche. */
  async function refresh() {
    /* Gesperrt: nichts lesen, nur neu zeichnen (Sperrbildschirm) */
    if (App.Vault.status !== 'open') { clear(); notify(); return; }
    s.settings = await Repo.loadSettings();
    s.accounts = (await Repo.listAccounts()).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    const active = s.accounts.find((a) => a.id === s.settings.activeAccountId) || s.accounts[0] || null;
    s.snap = active ? await Repo.loadSnapshot(active) : null;
    notify();
  }

  async function commit(ops) { await DB.apply(ops); await refresh(); }
  const puts = (store, rows) => rows.map((put) => ({ store, put }));
  const monthOps = (m) => [{ store: 'months', put: m.month }, ...puts('groups', m.groups), ...puts('items', m.items)];

  function patchSettings(patch) {
    return commit([Repo.settingsOp({ ...s.settings, ...patch })]);
  }

  /* ---- Konten: die Währung wird nur beim Eröffnen gesetzt ---- */
  async function createAccount({ name, currency, useTemplate }) {
    if (!Config.CURRENCIES[currency]) throw new Error('Ungültige Währung');
    const account = { id: uid(), name, currency, createdAt: new Date().toISOString() };
    s.ym = Utils.thisYm();
    const first = Budget.freshMonth(account.id, s.ym, useTemplate);
    await commit([
      { store: 'accounts', put: account }, ...monthOps(first),
      Repo.settingsOp({ ...s.settings, activeAccountId: account.id }),
    ]);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    return account;
  }

  /* Bewusst nur der Name: currency wird nach dem Eröffnen nie geschrieben. */
  const renameAccount = (account, name) => commit([{ store: 'accounts', put: { ...account, name } }]);

  function switchAccount(id) { s.txFilter = 'all'; s.txSearch = ''; return patchSettings({ activeAccountId: id }); }

  async function deleteAccount(account) {
    const snap = await Repo.loadSnapshot(account);
    const ops = [{ store: 'accounts', del: account.id }];
    ['months', 'groups', 'items', 'transactions'].forEach((st) => snap[st].forEach((r) => ops.push({ store: st, del: r.id })));
    await commit(ops);
  }

  /* ---- Monate ---- */
  function buildMonth(ym, mode) {
    const snap = s.snap;
    const source = Budget.sourceMonth(snap, ym);
    if ((mode === 'copy' || mode === 'copy-empty') && source) return Budget.copyMonth(snap, ym, source, mode === 'copy');
    return Budget.freshMonth(snap.account.id, ym, mode === 'template');
  }
  /** Fehler, wenn der Vormonat noch nicht abgeschlossen ist */
  function assertCanStart(ym) {
    const chk = Budget.startCheck(s.snap, ym);
    if (!chk.ok) throw new Error(`Vormonat ${chk.prev.ym} ist noch nicht abgeschlossen`);
  }
  const createMonth = (ym, mode) => { assertCanStart(ym); return commit(monthOps(buildMonth(ym, mode))); };
  function saveMonthNote(month, note) { return commit([{ store: 'months', put: { ...month, note } }]); }

  /* ---- Gruppen und Posten ---- */
  const findItem = (id) => s.snap.items.find((i) => i.id === id);

  function setPlanned(itemId, minor) {
    const item = findItem(itemId);
    if (!item || item.plannedMinor === minor) return Promise.resolve();
    return commit([{ store: 'items', put: { ...item, plannedMinor: minor } }]);
  }

  function addGroup(month, name) {
    const existing = Budget.groupsOf(s.snap, month.id);
    return commit([{ store: 'groups', put: { id: uid(), accountId: month.accountId, monthId: month.id, lineId: uid(), name, type: 'expense', sort: nextSort(existing) } }]);
  }
  const updateGroup = (group, patch) => commit([{ store: 'groups', put: { ...group, ...patch } }]);

  function addItem(group, fields) {
    const siblings = Budget.itemsOfGroup(s.snap, group.id);
    return commit([{ store: 'items', put: { id: uid(), accountId: group.accountId, monthId: group.monthId, groupId: group.id, lineId: uid(), sort: nextSort(siblings), plannedMinor: 0, kind: 'normal', goalMinor: 0, goalDate: '', motivation: '', ...fields } }]);
  }

  /** Legt ein Sparschwein an. Fehlt der Sparbereich in diesem Monat, entsteht er dabei. */
  function addPiggy(month, fields) {
    const ops = [];
    let sg = Budget.savingsGroup(s.snap, month.id);
    if (!sg) {
      sg = { id: uid(), accountId: month.accountId, monthId: month.id, lineId: `savings:${month.accountId}`, name: 'Sparschweine', type: 'savings', sort: 999 };
      ops.push({ store: 'groups', put: sg });
    }
    const siblings = Budget.itemsOfGroup(s.snap, sg.id);
    ops.push({ store: 'items', put: { id: uid(), accountId: month.accountId, monthId: month.id, groupId: sg.id, lineId: uid(), sort: nextSort(siblings), plannedMinor: 0, goalMinor: 0, goalDate: '', motivation: '', ...fields, kind: 'fund' } });
    return commit(ops);
  }

  /* Diese Felder gehören zum Sparschwein als Ganzes und gelten auch in späteren Monaten. */
  const PIGGY_FIELDS = ['name', 'kind', 'goalMinor', 'goalDate', 'motivation'];

  function updateItem(item, patch) {
    const next = { ...item, ...patch };
    if (patch.groupId && patch.groupId !== item.groupId) next.sort = nextSort(Budget.itemsOfGroup(s.snap, patch.groupId));
    const ops = [{ store: 'items', put: next }];
    if (item.kind === 'fund' || next.kind === 'fund') {
      const ymOfItem = (i) => (s.snap.months.find((m) => m.id === i.monthId) || {}).ym || '';
      const from = ymOfItem(item);
      const shared = Object.fromEntries(PIGGY_FIELDS.filter((k) => k in patch).map((k) => [k, patch[k]]));
      s.snap.items
        .filter((i) => i.lineId === item.lineId && i.id !== item.id && ymOfItem(i) > from)
        .forEach((i) => ops.push({ store: 'items', put: { ...i, ...shared } }));
    }
    return commit(ops);
  }

  /** Tauscht die Reihenfolge mit dem Nachbarn. */
  function moveOps(store, list, row, dir) {
    const i = list.findIndex((x) => x.id === row.id), j = i + dir;
    if (j < 0 || j >= list.length) return [];
    return [{ store, put: { ...list[i], sort: list[j].sort } }, { store, put: { ...list[j], sort: list[i].sort } }];
  }
  const moveItem = (item, dir) => commit(moveOps('items', Budget.itemsOfGroup(s.snap, item.groupId), item, dir));

  /** Neue Reihenfolge nach Ziehen und Ablegen: sort entspricht der Position */
  /**
   * Posten an eine Stelle setzen, auch in eine andere Gruppe desselben Monats.
   * ids: neue Reihenfolge der Posten in der Zielgruppe.
   * Buchungen bleiben dem Posten zugeordnet, nur die Gruppe ändert sich.
   */
  function moveItemTo(itemId, groupId, ids) {
    const ops = [];
    ids.forEach((id, i) => {
      const r = s.snap.items.find((x) => x.id === id);
      if (!r) return;
      const next = { ...r, sort: i, ...(id === itemId ? { groupId } : {}) };
      if (next.sort !== r.sort || next.groupId !== r.groupId) ops.push({ store: 'items', put: next });
    });
    return ops.length ? commit(ops) : Promise.resolve(notify());
  }

  function reorder(store, ids) {
    const rows = store === 'items' ? s.snap.items : s.snap.groups;
    const ops = [];
    ids.forEach((id, i) => {
      const r = rows.find((x) => x.id === id);
      if (r && r.sort !== i) ops.push({ store, put: { ...r, sort: i } });
    });
    return ops.length ? commit(ops) : Promise.resolve(notify());
  }
  function moveGroup(group, dir) {
    /* Die Einnahmen bleiben oben, verschoben werden nur Ausgaben-Gruppen. */
    const list = Budget.groupsOf(s.snap, group.monthId).filter((g) => g.type === group.type);
    return commit(moveOps('groups', list, group, dir));
  }

  const txUsing = (itemIds) => s.snap.transactions.filter((t) => t.splits.some((x) => itemIds.includes(x.itemId)));
  const clearSplitsOps = (txs) => txs.map((t) => ({ store: 'transactions', put: { ...t, splits: [], updatedAt: new Date().toISOString() } }));

  const deleteItem = (item) => commit([...clearSplitsOps(txUsing([item.id])), { store: 'items', del: item.id }]);
  function deleteGroup(group) {
    const items = Budget.itemsOfGroup(s.snap, group.id);
    return commit([...clearSplitsOps(txUsing(items.map((i) => i.id))), ...items.map((i) => ({ store: 'items', del: i.id })), { store: 'groups', del: group.id }]);
  }

  /* ---- Buchungen ---- */
  /**
   * Speichert eine Buchung. Das Formular arbeitet mit lineId, damit ein
   * geändertes Datum automatisch den passenden Posten im Zielmonat findet.
   * Ist der Zielmonat noch nicht angelegt, entsteht er als Kopie.
   */
  function saveTransaction(form) {
    const snap = s.snap, accountId = snap.account.id;
    const ym = ymOf(form.date);
    const ops = [];
    let month = Budget.monthOf(snap, ym);
    let items, groups;
    if (month) {
      items = Budget.itemsOfMonth(snap, month.id);
      groups = Budget.groupsOf(snap, month.id);
    } else {
      assertCanStart(ym);
      const built = buildMonth(ym, 'copy');
      month = built.month; items = built.items; groups = built.groups;
      ops.push(...monthOps(built));
    }
    const types = new Map(groups.map((g) => [g.id, g.type]));
    const now = new Date().toISOString();
    const prev = form.id ? snap.transactions.find((t) => t.id === form.id) : null;
    const tx = {
      id: form.id || uid(), accountId, monthId: month.id, date: form.date, type: form.type,
      merchant: form.merchant, note: form.note, amountMinor: form.amountMinor,
      splits: Budget.resolveSplits(form.lineSplits, items, types, form.type),
      createdAt: prev ? prev.createdAt : now, updatedAt: now,
    };
    /* Herkunft bleibt beim Bearbeiten erhalten: Bank-Import und wiederkehrende Vorlage. */
    if (prev && prev.importKey) tx.importKey = prev.importKey;
    if (prev && prev.recurringId) tx.recurringId = prev.recurringId;
    if (form.repeat && !form.id && form.type !== 'withdrawal') {
      const tpl = {
        id: uid(), accountId, day: Number(form.date.slice(8, 10)), type: form.type, merchant: form.merchant || 'Wiederkehrende Buchung',
        amountMinor: form.amountMinor, lineId: form.lineSplits.length === 1 ? form.lineSplits[0].lineId : '', startYm: ym,
      };
      tx.recurringId = tpl.id;
      s.settings = { ...s.settings, recurring: [...(s.settings.recurring || []), tpl] };
      ops.push(Repo.settingsOp(s.settings));
    }
    ops.push({ store: 'transactions', put: tx });
    /* Händler merken, damit der Bank-Import ihn künftig vorschlägt. */
    if (form.learn !== false && form.lineSplits.length === 1) {
      const op = learnOp(accountId, form.merchant, form.lineSplits[0].lineId, form.type);
      if (op) ops.push(op);
    }
    return commit(ops).then(() => tx);
  }
  const deleteTransaction = (id) => commit([{ store: 'transactions', del: id }]);

  /* ---- Lernende Regeln: Händler → Posten ---- */
  const rulesOf = (accountId) => ((s.settings.rules || {})[accountId]) || {};

  /** Merkt sich, welchem Posten ein Händler zugeordnet wurde (als Einstellungs-Operation). */
  function learnOp(accountId, merchant, lineId, type) {
    const key = Importer.merchantKey(merchant);
    if (!key || !lineId) return null;
    const rules = { ...(s.settings.rules || {}) };
    rules[accountId] = { ...rulesOf(accountId), [key]: { lineId, type } };
    s.settings = { ...s.settings, rules };
    return Repo.settingsOp(s.settings);
  }

  /** Vorschlag für eine Buchung ohne Posten, aus den gelernten Regeln */
  function suggestFor(tx) {
    const key = Importer.merchantKey(tx.merchant);
    if (!key) return null;
    /* Erst der genaue Schlüssel, dann das erste Wort: „Coop Bern“ findet auch eine Regel für „Coop“. */
    const rules = rulesOf(tx.accountId);
    const firstWord = key.split(' ')[0];
    const r = rules[key] || rules[firstWord] || Object.entries(rules).find(([k]) => k.split(' ')[0] === firstWord)?.[1];
    if (!r) return null;
    if (r.type === 'withdrawal' ? tx.type !== 'expense' : r.type !== tx.type) return null;
    const groups = new Map(Budget.groupsOf(s.snap, tx.monthId).map((g) => [g.id, g.type]));
    const item = Budget.itemsOfMonth(s.snap, tx.monthId).find((i) => i.lineId === r.lineId && Budget.fitsType(groups.get(i.groupId), r.type));
    return item ? { lineId: r.lineId, type: r.type, name: item.name } : null;
  }

  function forgetRules() {
    const rules = { ...(s.settings.rules || {}) };
    delete rules[s.snap.account.id];
    return patchSettings({ rules });
  }

  /** Ordnet eine Buchung einem Posten zu und lernt dabei den Händler. */
  function assign(tx, lineId, type) {
    return saveTransaction({
      id: tx.id, date: tx.date, type: type || tx.type, merchant: tx.merchant, note: tx.note,
      amountMinor: tx.amountMinor, lineSplits: [{ lineId, amountMinor: tx.amountMinor }],
    });
  }

  /** Übernimmt viele Vorschläge in einer einzigen Transaktion. */
  function assignMany(pairs) {
    const now = new Date().toISOString();
    const ops = pairs.map(([tx, sug]) => {
      const groups = Budget.groupsOf(s.snap, tx.monthId);
      const types = new Map(groups.map((g) => [g.id, g.type]));
      const splits = Budget.resolveSplits([{ lineId: sug.lineId, amountMinor: tx.amountMinor }], Budget.itemsOfMonth(s.snap, tx.monthId), types, sug.type);
      return { store: 'transactions', put: { ...tx, type: sug.type, splits, updatedAt: now } };
    });
    return commit(ops);
  }

  /* ---- Umbudgetieren: Geplantes von einem Posten zum anderen ---- */
  /**
   * fromId null: Geld aus „zu verplanen“. toId null: zurück zu „zu verplanen“.
   * Geplante Beträge werden nie negativ.
   */
  function moveBudget(fromId, toId, amount) {
    const ops = [];
    if (fromId) {
      const f = findItem(fromId);
      if (!f || amount > f.plannedMinor) return Promise.reject(new Error('Zu wenig geplant'));
      ops.push({ store: 'items', put: { ...f, plannedMinor: f.plannedMinor - amount } });
    }
    if (toId) {
      const t = findItem(toId);
      ops.push({ store: 'items', put: { ...t, plannedMinor: t.plannedMinor + amount } });
    }
    return commit(ops);
  }

  /** Rest des Monats ins Sparschwein: plant ihn ein und bucht die Einzahlung. */
  function restToPiggy(month, piggy, amount) {
    const last = new Date(Number(month.ym.slice(0, 4)), Number(month.ym.slice(5, 7)), 0).getDate();
    const date = Utils.today().slice(0, 7) === month.ym ? Utils.today() : `${month.ym}-${String(last).padStart(2, '0')}`;
    const now = new Date().toISOString();
    return commit([
      { store: 'items', put: { ...piggy, plannedMinor: piggy.plannedMinor + amount } },
      { store: 'transactions', put: { id: uid(), accountId: month.accountId, monthId: month.id, date, type: 'expense', merchant: 'Rest des Monats', note: '', amountMinor: amount, splits: [{ itemId: piggy.id, amountMinor: amount }], createdAt: now, updatedAt: now } },
    ]);
  }

  /* ---- Wiederkehrende Buchungen ---- */
  const recurringOf = (accountId) => (s.settings.recurring || []).filter((r) => r.accountId === accountId);
  function clampDay(ym, day) {
    const last = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate();
    return `${ym}-${String(Math.min(day, last)).padStart(2, '0')}`;
  }

  /** Fällige Vorlagen im laufenden Kalendermonat, die noch nicht gebucht sind */
  function dueRecurring() {
    const ym = Utils.thisYm();
    const month = Budget.monthOf(s.snap, ym);
    if (!month) return [];
    const today = Utils.today();
    return recurringOf(s.snap.account.id)
      .filter((r) => (!r.startYm || r.startYm < ym) && clampDay(ym, r.day) <= today)
      .filter((r) => !s.snap.transactions.some((t) => t.monthId === month.id && t.recurringId === r.id))
      .map((r) => ({ tpl: r, date: clampDay(ym, r.day) }));
  }

  function confirmRecurring(list) {
    const now = new Date().toISOString();
    const ops = list.map(({ tpl, date }) => {
      const month = Budget.monthOf(s.snap, ymOf(date));
      const types = new Map(Budget.groupsOf(s.snap, month.id).map((g) => [g.id, g.type]));
      const splits = tpl.lineId ? Budget.resolveSplits([{ lineId: tpl.lineId, amountMinor: tpl.amountMinor }], Budget.itemsOfMonth(s.snap, month.id), types, tpl.type) : [];
      return { store: 'transactions', put: { id: uid(), accountId: tpl.accountId, monthId: month.id, date, type: tpl.type, merchant: tpl.merchant, note: '', amountMinor: tpl.amountMinor, splits, recurringId: tpl.id, createdAt: now, updatedAt: now } };
    });
    return commit(ops);
  }

  const deleteRecurring = (id) => patchSettings({ recurring: (s.settings.recurring || []).filter((r) => r.id !== id) });

  /* ---- Bank-Import ---- */
  const saveImportProfile = (sig, mapping) => patchSettings({ importProfiles: { ...(s.settings.importProfiles || {}), [sig]: mapping } });
  const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 86400000);

  /**
   * Übernimmt Zeilen aus der Bankdatei.
   * Doppelte (gleiches Datum, gleicher Betrag, gleicher Text) werden übersprungen.
   * Monate, die wegen der Monatssperre noch nicht beginnen dürfen, warten.
   * Eine bereits als wiederkehrend erfasste Buchung wird verknüpft statt verdoppelt.
   */
  async function importRows(rows) {
    const acc = s.snap.account.id;
    const first = [...s.snap.months].sort((a, b) => a.ym.localeCompare(b.ym))[0];
    const existing = new Set(s.snap.transactions.map((t) => t.importKey).filter(Boolean));
    const seen = new Map();
    const fresh = [];
    let dup = 0, tooOld = 0;
    for (const r of rows) {
      const base = `${r.date}|${r.amountMinor}|${(r.rawText || r.text).toLowerCase().replace(/\s+/g, ' ')}`;
      const n = (seen.get(base) || 0) + 1;
      seen.set(base, n);
      /* Nur die Prüfsumme wird gespeichert, nie der Originaltext der Bank. */
      const key = await Crypto.sha256Hex(`${base}#${n}`);
      if (existing.has(key)) { dup++; continue; }
      if (first && ymOf(r.date) < first.ym) { tooOld++; continue; }
      fresh.push({ ...r, key });
    }
    const blocked = new Set();
    for (const ym of [...new Set(fresh.map((r) => ymOf(r.date)))].sort()) {
      if (Budget.monthOf(s.snap, ym)) continue;
      if (blocked.size || !Budget.startCheck(s.snap, ym).ok) { blocked.add(ym); continue; }
      await commit(monthOps(buildMonth(ym, 'copy')));
    }
    const now = new Date().toISOString();
    const ops = [];
    const used = new Set();
    let added = 0, linked = 0, waiting = 0;
    for (const r of fresh) {
      const ym = ymOf(r.date);
      if (blocked.has(ym)) { waiting++; continue; }
      const month = Budget.monthOf(s.snap, ym);
      const type = r.amountMinor > 0 ? 'income' : 'expense';
      const amt = Math.abs(r.amountMinor);
      const rec = s.snap.transactions.find((t) => t.monthId === month.id && t.recurringId && !t.importKey && !used.has(t.id)
        && t.type === type && t.amountMinor === amt && Math.abs(dayDiff(t.date, r.date)) <= 5);
      if (rec) {
        used.add(rec.id);
        ops.push({ store: 'transactions', put: { ...rec, importKey: r.key, date: r.date, updatedAt: now } });
        linked++;
        continue;
      }
      ops.push({ store: 'transactions', put: { id: uid(), accountId: acc, monthId: month.id, date: r.date, type, merchant: r.text.slice(0, 80), note: '', amountMinor: amt, splits: [], importKey: r.key, createdAt: now, updatedAt: now } });
      added++;
    }
    ops.push(Repo.settingsOp({ ...s.settings, lastImportAt: { ...(s.settings.lastImportAt || {}), [acc]: now } }));
    await commit(ops);
    return { added, dup, linked, waiting, tooOld, waitingMonths: [...blocked] };
  }


  return {
    s, subscribe, notify, refresh, clear, patchSettings, createAccount, renameAccount, switchAccount, deleteAccount,
    createMonth, saveMonthNote, setPlanned, reorder, moveItemTo, addGroup, addPiggy, updateGroup, addItem, updateItem, moveItem, moveGroup,
    txUsing, deleteItem, deleteGroup, saveTransaction, deleteTransaction,
    suggestFor, forgetRules, assign, assignMany, moveBudget, restToPiggy,
    recurringOf, dueRecurring, confirmRecurring, deleteRecurring, saveImportProfile, importRows,
  };
})();

/* ==========================================================================
   8 BACKUP: Export, Prüfung, Import
   ========================================================================== */
App.Backup = (() => {
  const { Config, DB, Repo, State, Utils } = App;

  /** Backup als JSON-Text, etwa zum Kopieren, wenn Downloads gesperrt sind */
  async function payloadText() {
    const data = await Repo.dumpAll();
    return JSON.stringify({
      app: Config.APP_ID, schemaVersion: Config.SCHEMA_VERSION, exportedAt: new Date().toISOString(),
      data: { ...data, meta: data.meta.filter((m) => m.key === 'settings'), items: data.items.map(({ actualAdjustMinor, ...item }) => item) },
    }, null, 2);
  }

  async function exportFile() {
    const data = await Repo.dumpAll();
    const payload = {
      app: Config.APP_ID, schemaVersion: Config.SCHEMA_VERSION, exportedAt: new Date().toISOString(),
      /* Reste des früheren Korrekturfelds kommen nicht mehr ins Backup. */
      data: { ...data, meta: data.meta.filter((m) => m.key === 'settings'), items: data.items.map(({ actualAdjustMinor, ...item }) => item) },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `nullpunkt-backup-${Utils.today()}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    await State.patchSettings({ lastBackupAt: payload.exportedAt, backupSnoozeUntil: null });
  }

  const isStr = (v) => typeof v === 'string';
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  /** Übernimmt Regeln, Vorlagen und weitere Einstellungen nur in gültiger Form. */
  function cleanExtras(sv, accounts) {
    const out = { effects: sv.effects !== false, privacy: sv.privacy === true, autoLockMin: [1, 5, 15, 30].includes(sv.autoLockMin) ? sv.autoLockMin : 5 };
    const rules = {};
    if (isObj(sv.rules)) Object.entries(sv.rules).forEach(([acc, map]) => {
      if (!accounts.has(acc) || !isObj(map)) return;
      rules[acc] = Object.fromEntries(Object.entries(map).filter(([, r]) => isObj(r) && isStr(r.lineId) && ['income', 'expense', 'withdrawal'].includes(r.type)).map(([k, r]) => [k, { lineId: r.lineId, type: r.type }]));
    });
    out.rules = rules;
    out.recurring = Array.isArray(sv.recurring) ? sv.recurring.filter((r) => isObj(r) && accounts.has(r.accountId) && isStr(r.id)
      && Number.isInteger(r.day) && r.day >= 1 && r.day <= 31 && ['income', 'expense'].includes(r.type)
      && Number.isSafeInteger(r.amountMinor) && r.amountMinor > 0 && isStr(r.merchant) && isStr(r.lineId))
      .map((r) => ({ id: r.id, accountId: r.accountId, day: r.day, type: r.type, merchant: r.merchant, amountMinor: r.amountMinor, lineId: r.lineId, startYm: isStr(r.startYm) ? r.startYm : '' })) : [];
    out.importProfiles = isObj(sv.importProfiles) ? Object.fromEntries(Object.entries(sv.importProfiles).filter(([, m]) => isObj(m)
      && ['date', 'text', 'text2', 'amount', 'debit', 'credit', 'header'].every((k) => m[k] === undefined || Number.isInteger(m[k])))) : {};
    out.lastImportAt = isObj(sv.lastImportAt) ? Object.fromEntries(Object.entries(sv.lastImportAt).filter(([k, v]) => accounts.has(k) && isStr(v))) : {};
    out.celebrated = isObj(sv.celebrated) ? Object.fromEntries(Object.entries(sv.celebrated).filter(([, v]) => Number.isInteger(v))) : {};
    const rm = isObj(sv.reminder) ? sv.reminder : {};
    out.reminder = { weekday: Number.isInteger(rm.weekday) && rm.weekday >= 0 && rm.weekday <= 6 ? rm.weekday : 0, time: isStr(rm.time) && /^\d{2}:\d{2}$/.test(rm.time) ? rm.time : '18:00' };
    return out;
  }
  const isMinor = (v) => Number.isSafeInteger(v) && Math.abs(v) <= Config.MAX_MINOR;

  /**
   * Prüft ein Backup vollständig, bevor etwas geschrieben wird.
   * Übernimmt nur bekannte Felder.
   * @returns {{ok:true,data:object,counts:object}|{ok:false,errors:string[]}}
   */
  function validate(raw) {
    const errors = [];
    const fail = (m) => ({ ok: false, errors: [m] });
    if (!raw || typeof raw !== 'object') return fail('Die Datei enthält kein gültiges Backup.');
    if (raw.app !== Config.APP_ID) return fail('Die Datei ist kein Nullpunkt-Backup.');
    if (!Number.isInteger(raw.schemaVersion) || raw.schemaVersion < 1) return fail('Die Versionsangabe des Backups fehlt.');
    if (raw.schemaVersion > Config.SCHEMA_VERSION) return fail('Das Backup stammt aus einer neueren Version von Nullpunkt.');
    const d = raw.data;
    if (!d || typeof d !== 'object') return fail('Im Backup fehlen die Daten.');
    for (const s of ['accounts', 'months', 'groups', 'items', 'transactions']) {
      if (!Array.isArray(d[s])) return fail(`Im Backup fehlt der Bereich „${s}“.`);
    }
    const unique = (list, name) => {
      const seen = new Set();
      list.forEach((r, i) => {
        if (!r || !isStr(r.id) || !r.id) errors.push(`${name} ${i + 1}: ID fehlt.`);
        else if (seen.has(r.id)) errors.push(`${name}: doppelte ID ${r.id}.`);
        else seen.add(r.id);
      });
    };
    unique(d.accounts, 'Konto'); unique(d.months, 'Monat'); unique(d.groups, 'Gruppe'); unique(d.items, 'Posten'); unique(d.transactions, 'Buchung');
    if (errors.length) return { ok: false, errors };

    const accounts = new Map(d.accounts.map((a) => [a.id, a]));
    const months = new Map(d.months.map((m) => [m.id, m]));
    const groups = new Map(d.groups.map((g) => [g.id, g]));
    const items = new Map(d.items.map((i) => [i.id, i]));

    d.accounts.forEach((a) => {
      if (!isStr(a.name) || !a.name.trim()) errors.push(`Konto ${a.id}: Name fehlt.`);
      if (!Config.CURRENCIES[a.currency]) errors.push(`Konto ${a.id}: Währung muss CHF oder EUR sein.`);
      if (!isStr(a.createdAt)) errors.push(`Konto ${a.id}: Datum fehlt.`);
    });
    d.months.forEach((m) => {
      if (!accounts.has(m.accountId)) errors.push(`Monat ${m.id}: Konto fehlt.`);
      if (!Utils.isValidYm(m.ym)) errors.push(`Monat ${m.id}: ungültiger Monat.`);
      if (m.id !== `${m.accountId}:${m.ym}`) errors.push(`Monat ${m.id}: ID passt nicht zu Konto und Monat.`);
    });
    d.groups.forEach((g) => {
      const m = months.get(g.monthId);
      if (!m || m.accountId !== g.accountId) errors.push(`Gruppe ${g.id}: Monat fehlt.`);
      if (!isStr(g.name) || !isStr(g.lineId) || !Number.isInteger(g.sort)) errors.push(`Gruppe ${g.id}: Felder ungültig.`);
      if (!['income', 'expense', 'savings'].includes(g.type)) errors.push(`Gruppe ${g.id}: Typ ungültig.`);
    });
    d.items.forEach((i) => {
      const g = groups.get(i.groupId);
      if (!g || g.monthId !== i.monthId || g.accountId !== i.accountId) errors.push(`Posten ${i.id}: Gruppe fehlt.`);
      if (!isStr(i.name) || !isStr(i.lineId) || !Number.isInteger(i.sort)) errors.push(`Posten ${i.id}: Felder ungültig.`);
      if (!isMinor(i.plannedMinor) || i.plannedMinor < 0) errors.push(`Posten ${i.id}: Betrag ist keine gültige Ganzzahl.`);
      if (i.kind !== 'normal' && i.kind !== 'fund') errors.push(`Posten ${i.id}: Art ungültig.`);
      if (i.goalMinor !== undefined && (!isMinor(i.goalMinor) || i.goalMinor < 0)) errors.push(`Posten ${i.id}: Sparziel ist keine gültige Ganzzahl.`);
      if (i.goalDate !== undefined && i.goalDate !== '' && !Utils.isValidDate(i.goalDate)) errors.push(`Posten ${i.id}: Zieldatum ungültig.`);
      if (i.motivation !== undefined && !isStr(i.motivation)) errors.push(`Posten ${i.id}: Motivation ungültig.`);
      /* Backups aus Version 1 kennen das Feld noch nicht. */
    });
    d.transactions.forEach((t) => {
      const m = months.get(t.monthId);
      if (!m || m.accountId !== t.accountId) errors.push(`Buchung ${t.id}: Monat fehlt.`);
      if (!Utils.isValidDate(t.date) || (m && Utils.ymOf(t.date) !== m.ym)) errors.push(`Buchung ${t.id}: Datum passt nicht zum Monat.`);
      if (!['income', 'expense', 'withdrawal'].includes(t.type)) errors.push(`Buchung ${t.id}: Typ ungültig.`);
      if (!isStr(t.merchant) || !isStr(t.note) || !isStr(t.createdAt) || !isStr(t.updatedAt)) errors.push(`Buchung ${t.id}: Felder ungültig.`);
      if ((t.importKey !== undefined && !isStr(t.importKey)) || (t.recurringId !== undefined && !isStr(t.recurringId))) errors.push(`Buchung ${t.id}: Herkunft ungültig.`);
      if (!isMinor(t.amountMinor) || t.amountMinor <= 0) errors.push(`Buchung ${t.id}: Betrag ist keine gültige Ganzzahl.`);
      if (!Array.isArray(t.splits)) { errors.push(`Buchung ${t.id}: Aufteilung fehlt.`); return; }
      let total = 0;
      t.splits.forEach((s) => {
        const it = s && items.get(s.itemId);
        if (!it || it.monthId !== t.monthId) { errors.push(`Buchung ${t.id}: Posten fehlt.`); return; }
        const gt = groups.get(it.groupId).type;
        if (!(gt === t.type || (gt === 'savings' && (t.type === 'expense' || t.type === 'withdrawal')))) errors.push(`Buchung ${t.id}: Posten passt nicht zum Typ.`);
        if (!isMinor(s.amountMinor) || s.amountMinor <= 0) errors.push(`Buchung ${t.id}: Teilbetrag ungültig.`);
        total += s.amountMinor;
      });
      if (t.splits.length && total !== t.amountMinor) errors.push(`Buchung ${t.id}: Aufteilung ergibt nicht den Betrag.`);
    });
    if (errors.length) return { ok: false, errors };

    const pick = (o, keys) => Object.fromEntries(keys.map((k) => [k, o[k]]));
    const metaRow = Array.isArray(d.meta) ? d.meta.find((m) => m && m.key === 'settings') : null;
    const sv = (metaRow && metaRow.value) || {};
    const data = {
      accounts: d.accounts.map((r) => ({ ...pick(r, ['id', 'name', 'currency', 'createdAt']), ...(r.demo === true ? { demo: true } : {}) })),
      months: d.months.map((r) => ({ ...pick(r, ['id', 'accountId', 'ym', 'createdAt']), note: isStr(r.note) ? r.note : '' })),
      groups: d.groups.map((r) => pick(r, ['id', 'accountId', 'monthId', 'lineId', 'name', 'type', 'sort'])),
      items: d.items.map((r) => ({ ...pick(r, ['id', 'accountId', 'monthId', 'groupId', 'lineId', 'name', 'sort', 'plannedMinor', 'kind']), goalMinor: r.goalMinor ?? 0, goalDate: r.goalDate ?? '', motivation: r.motivation ?? '' })),
      transactions: d.transactions.map((r) => ({
        ...pick(r, ['id', 'accountId', 'monthId', 'date', 'type', 'merchant', 'note', 'amountMinor', 'createdAt', 'updatedAt']),
        ...(isStr(r.importKey) ? { importKey: r.importKey } : {}),
        ...(isStr(r.recurringId) ? { recurringId: r.recurringId } : {}),
        splits: r.splits.map((s) => pick(s, ['itemId', 'amountMinor'])),
      })),
      meta: [
        { key: 'settings', value: {
          theme: ['system', 'light', 'dark'].includes(sv.theme) ? sv.theme : 'system',
          activeAccountId: accounts.has(sv.activeAccountId) ? sv.activeAccountId : null,
          lastBackupAt: isStr(raw.exportedAt) ? raw.exportedAt : null,
          backupSnoozeUntil: null,
          ...cleanExtras(sv, accounts),
        } },
        { key: 'schemaVersion', value: Config.SCHEMA_VERSION },
      ],
    };
    /* Überlange Texte kürzen, damit eine manipulierte Datei die App nicht lahmlegt */
    const cut = (o, k, n) => { if (typeof o[k] === 'string' && o[k].length > n) o[k] = o[k].slice(0, n); };
    data.accounts.forEach((r) => cut(r, 'name', 80));
    data.months.forEach((r) => cut(r, 'note', 1000));
    data.groups.forEach((r) => cut(r, 'name', 80));
    data.items.forEach((r) => { cut(r, 'name', 80); cut(r, 'motivation', 500); });
    data.transactions.forEach((r) => { cut(r, 'merchant', 120); cut(r, 'note', 500); });
    /* Backups älterer Versionen: Sparschweine in den eigenen Bereich verschieben. */
    const norm = Utils.normalizeSavings(data.groups, data.items);
    data.groups = data.groups.filter((g) => !norm.delGroups.includes(g.id)).concat(norm.putGroups);
    return { ok: true, data, counts: { accounts: data.accounts.length, months: data.months.length, transactions: data.transactions.length }, exportedAt: raw.exportedAt };
  }

  async function restore(data) {
    /* Der Tresor bleibt: Das Backup wird mit dem aktuellen App-Passwort verschlüsselt gespeichert. */
    await DB.replaceAll(data, App.Vault.row ? [App.Vault.row] : []);
    await App.Maintenance.run();
    State.s.ym = Utils.thisYm();
    await State.refresh();
  }

  return { exportFile, payloadText, validate, restore };
})();

/* ==========================================================================
   8b DEMO: Beispielkonto mit Vormonat und laufendem Monat
   Alles Erfundene steht in einem eigenen Konto „Demo-Haushalt“, das man
   wie jedes Konto löschen kann. Echte Daten bleiben unberührt.
   ========================================================================== */
App.Demo = (() => {
  const { Budget, DB, Repo, State, Utils } = App;

  /* Geplante Beträge in Rappen. Einnahmen 5'485.00 = Ausgaben 5'485.00 */
  const PLAN = {
    'Lohn': 520000, 'Nebeneinkünfte': 28500,
    'Miete': 185000, 'Nebenkosten': 18000, 'Internet und Telefon': 6900,
    'Lebensmittel': 70000, 'Auswärts essen': 20000, 'ÖV': 8500, 'Auto': 0,
    'Krankenkasse': 42000, 'Haftpflicht und Hausrat': 3500,
    'Kleidung': 15000, 'Freizeit': 25000, 'Abos': 4600,
    'Notgroschen': 60000, 'Ferien': 40000, 'Steuern': 50000,
  };
  /* Im laufenden Monat bleiben CHF 150.00 offen, damit man die Null selbst erreichen kann. */
  const PLAN_NOW = { ...PLAN, 'Freizeit': 10000 };

  /* [Tag, Empfänger, Art, [[Posten, Betrag], ...]]; leere Liste = ohne Posten */
  const TX_PREV = [
    [1, 'Arbeitgeber', 'income', [['Lohn', 520000]]],
    [1, 'Liegenschaftsverwaltung', 'expense', [['Miete', 185000]]],
    [2, 'Krankenkasse', 'expense', [['Krankenkasse', 42000]]],
    [3, 'Supermarkt', 'expense', [['Lebensmittel', 9840]]],
    [4, 'Monatsabo ÖV', 'expense', [['ÖV', 8500]]],
    [6, 'Pizzeria', 'expense', [['Auswärts essen', 6450]]],
    [8, 'Supermarkt', 'expense', [['Lebensmittel', 12370]]],
    [10, 'Elektrizitätswerk', 'expense', [['Nebenkosten', 18000]]],
    [11, 'Telefonanbieter', 'expense', [['Internet und Telefon', 6900]]],
    [12, 'Warenhaus', 'expense', [['Lebensmittel', 4200], ['Kleidung', 8990]]],
    [14, 'Streamingdienst', 'expense', [['Abos', 2290]]],
    [15, 'Bäckerei', 'expense', [['Lebensmittel', 1860]]],
    [16, 'Kino', 'expense', [['Freizeit', 3800]]],
    [18, 'Nachhilfe', 'income', [['Nebeneinkünfte', 28500]]],
    [19, 'Supermarkt', 'expense', [['Lebensmittel', 15430]]],
    [21, 'Restaurant', 'expense', [['Auswärts essen', 16900]]],
    [22, 'Musikdienst', 'expense', [['Abos', 2310]]],
    [23, 'Hausratversicherung', 'expense', [['Haftpflicht und Hausrat', 3500]]],
    [25, 'Kletterhalle', 'expense', [['Freizeit', 21200]]],
    [26, 'Supermarkt', 'expense', [['Lebensmittel', 16300]]],
    [25, 'Sparkonto', 'expense', [['Notgroschen', 60000], ['Ferien', 40000], ['Steuern', 50000]]],
    [27, 'Zahnarzt', 'withdrawal', [['Notgroschen', 18000]]],
    [28, 'Wochenmarkt', 'expense', [['Lebensmittel', 9550]]],
  ];
  const TX_NOW = [
    [1, 'Arbeitgeber', 'income', [['Lohn', 520000]]],
    [1, 'Liegenschaftsverwaltung', 'expense', [['Miete', 185000]]],
    [2, 'Krankenkasse', 'expense', [['Krankenkasse', 42000]]],
    [2, 'Sparkonto', 'expense', [['Notgroschen', 60000]]],
    [3, 'Supermarkt', 'expense', [['Lebensmittel', 8735]]],
    [4, 'Monatsabo ÖV', 'expense', [['ÖV', 8500]]],
    [6, 'Thai-Imbiss', 'expense', [['Auswärts essen', 4600]]],
    [8, 'Warenhaus', 'expense', [['Lebensmittel', 5200], ['Freizeit', 1890]]],
    [10, 'Kiosk', 'expense', []],
    [12, 'Streamingdienst', 'expense', [['Abos', 2290]]],
    [13, 'Supermarkt', 'expense', [['Lebensmittel', 9150]]],
  ];
  const KIOSK = 1250;

  function txRows(accountId, month, items, groups, list, maxDay) {
    const typeOf = new Map(groups.map((g) => [g.id, g.type]));
    const now = new Date().toISOString();
    return list.filter(([day]) => day <= maxDay).map(([day, merchant, type, parts]) => {
      const splits = parts.map(([name, amountMinor]) => {
        const item = items.find((i) => i.name === name && Budget.fitsType(typeOf.get(i.groupId), type));
        return { itemId: item.id, amountMinor };
      });
      const amountMinor = splits.length ? Utils.sum(splits, (x) => x.amountMinor) : KIOSK;
      return {
        id: Utils.uid(), accountId, monthId: month.id, date: `${month.ym}-${String(day).padStart(2, '0')}`,
        type, merchant, note: '', amountMinor, splits, createdAt: now, updatedAt: now,
      };
    });
  }

  const applyPlan = (items, plan) => items.forEach((i) => { i.plannedMinor = plan[i.name] ?? 0; });

  async function create() {
    const accountId = Utils.uid();
    const account = { id: accountId, name: 'Demo-Haushalt', currency: 'CHF', createdAt: new Date().toISOString(), demo: true };
    const ym = Utils.thisYm();
    const prevYm = Utils.addMonths(ym, -1);

    /* Vormonat aus der Vorlage, laufender Monat als Kopie: so teilen beide die lineId. */
    const prev = Budget.freshMonth(accountId, prevYm, true);
    applyPlan(prev.items, PLAN);
    const snap = { account, months: [prev.month], groups: prev.groups, items: prev.items, transactions: [] };
    const cur = Budget.copyMonth(snap, ym, prev.month, true);
    applyPlan(cur.items, PLAN_NOW);
    const year = Number(ym.slice(0, 4)) + 1;
    const GOALS = {
      'Notgroschen': [1000000, `${year}-12-31`, 'Drei Monatsmieten auf der Seite, damit mich eine kaputte Waschmaschine oder ein Jobverlust nicht aus der Bahn wirft.'],
      'Ferien': [250000, `${year}-06-30`, 'Zwei Wochen Portugal im Sommer, ohne danach aufs Konto schauen zu müssen.'],
      'Steuern': [500000, `${year}-03-31`, 'Die Steuerrechnung soll mich nicht mehr überraschen.'],
    };
    [...prev.items, ...cur.items].forEach((i) => {
      const g = GOALS[i.name];
      if (g) Object.assign(i, { goalMinor: g[0], goalDate: g[1], motivation: g[2] });
    });

    const today = Number(Utils.today().slice(8, 10));
    const txs = [
      ...txRows(accountId, prev.month, prev.items, prev.groups, TX_PREV, 31),
      ...txRows(accountId, cur.month, cur.items, cur.groups, TX_NOW, today),
    ];
    /* Der Vormonat ist abgeschlossen: wie nach dem Umbudgetieren steht jede Balance auf 0. */
    const paid = new Map();
    txs.filter((t) => t.monthId === prev.month.id && t.type !== 'withdrawal')
      .forEach((t) => t.splits.forEach((x) => paid.set(x.itemId, (paid.get(x.itemId) || 0) + x.amountMinor)));
    prev.items.forEach((i) => { i.plannedMinor = paid.get(i.id) || 0; });
    const prevType = new Map(prev.groups.map((g) => [g.id, g.type]));
    const rest = Utils.sum(prev.items, (i) => (prevType.get(i.groupId) === 'income' ? i.plannedMinor : -i.plannedMinor));
    if (rest > 0) {
      /* Was übrig blieb, ging in den Notgroschen. */
      const ng = prev.items.find((i) => i.name === 'Notgroschen');
      ng.plannedMinor += rest;
      const now = new Date().toISOString();
      txs.push({ id: Utils.uid(), accountId, monthId: prev.month.id, date: `${prev.month.ym}-28`, type: 'expense', merchant: 'Sparkonto', note: 'Rest des Monats', amountMinor: rest, splits: [{ itemId: ng.id, amountMinor: rest }], createdAt: now, updatedAt: now });
    }

    /* Wiederkehrende Miete, gelernte Händler und ein gefüllter Posteingang */
    const lineOf = (name) => cur.items.find((i) => i.name === name).lineId;
    const rent = { id: Utils.uid(), accountId, day: 1, type: 'expense', merchant: 'Liegenschaftsverwaltung', amountMinor: 185000, lineId: lineOf('Miete'), startYm: prevYm };
    txs.filter((t) => t.merchant === 'Liegenschaftsverwaltung').forEach((t) => { t.recurringId = rent.id; });
    const rules = {
      'supermarkt': ['Lebensmittel', 'expense'], 'backerei': ['Lebensmittel', 'expense'], 'pizzeria': ['Auswärts essen', 'expense'],
      'restaurant': ['Auswärts essen', 'expense'], 'kino': ['Freizeit', 'expense'], 'streamingdienst': ['Abos', 'expense'],
      'arbeitgeber': ['Lohn', 'income'], 'krankenkasse': ['Krankenkasse', 'expense'],
    };
    const nowIso = new Date().toISOString();
    [[2, 'Supermarkt Seefeld', 3480], [5, 'Pizzeria Bella', 2850], [6, 'Elektrofachmarkt', 5990]].filter(([d]) => d <= today).forEach(([d, merchant, amountMinor]) => {
      txs.push({ id: Utils.uid(), accountId, monthId: cur.month.id, date: `${ym}-${String(d).padStart(2, '0')}`, type: 'expense', merchant, note: '', amountMinor, splits: [], createdAt: nowIso, updatedAt: nowIso });
    });

    const settings = await Repo.loadSettings();
    settings.recurring = [...(settings.recurring || []), rent];
    settings.rules = { ...(settings.rules || {}), [accountId]: Object.fromEntries(Object.entries(rules).map(([k, [name, type]]) => [k, { lineId: lineOf(name), type }])) };
    const put = (store) => (row) => ({ store, put: row });
    await DB.apply([
      { store: 'accounts', put: account },
      ...[prev, cur].flatMap((m) => [{ store: 'months', put: m.month }, ...m.groups.map(put('groups')), ...m.items.map(put('items'))]),
      ...txs.map(put('transactions')),
      Repo.settingsOp({ ...settings, activeAccountId: accountId }),
    ]);
    State.s.ym = ym;
    await State.refresh();
  }

  return { create };
})();

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    let value;
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'value') value = v;
      else if (k === 'checked' || k === 'disabled' || k === 'required') el[k] = !!v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    append(el, kids);
    if (value !== undefined) el.value = value;
    return el;
  }
  function append(el, kids) {
    kids.flat(Infinity).forEach((k) => {
      if (k == null || k === false) return;
      el.append(k instanceof Node ? k : String(k));

  function icon(name) { const s = h('span', { class: 'icon', 'aria-hidden': 'true' }); s.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`; return s; }
  function logo(cls) { const s = h('span', { class: cls || '' }); s.innerHTML = LOGO; return s; }
  const iconBtn = (name, label, onclick, extra) => h('button', { type: 'button', class: 'btn btn-icon', 'aria-label': label, title: label, onclick, ...extra }, icon(name));

  /**
   * Ersetzt den Inhalt eines Containers und erhält dabei Fokus, Eingabe und
   * Scrollposition. So springt man beim Tabben durch die Beträge nicht heraus.
   */
  function mount(container, ...nodes) {
    const a = document.activeElement;
    const fk = a && a.dataset ? a.dataset.fk : null;
    const inside = fk && container.contains(a);
    const val = inside ? a.value : null;
    const y = window.scrollY;
    container.replaceChildren(...nodes.flat(Infinity).filter(Boolean));
    if (inside) {
      const n = container.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
      if (n) {
        n.focus({ preventScroll: true });
        if (n.tagName === 'INPUT') { n.value = val; n.select(); }
      }
    }
    window.scrollTo(0, y);
  }

  function sheet(title, build) {
    const dlg = h('dialog', { 'aria-label': title });
    const close = () => dlg.close();
    const body = h('div', { class: 'sheet-body' });
    dlg.append(h('div', { class: 'sheet-head' }, h('h2', {}, title), iconBtn('close', 'Schliessen', close)), body);
    dlg.addEventListener('close', () => dlg.remove());
    /* Tippen auf den Hintergrund schliesst, Klicks im Inhalt nicht. */
    dlg.addEventListener('mousedown', (e) => { if (e.target === dlg && !inDialogBox(e, dlg)) close(); });
    append(body, [build(close, body)]);
    document.body.append(dlg);
    dlg.showModal();
    return { close, dlg };
  }
  function inDialogBox(e, dlg) {
    const r = dlg.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }

  /**
   * Bestätigungsdialog als Promise. Mit requireText muss ein Name
   * eingetippt werden, etwa beim Löschen eines Kontos.
   */
  function confirm({ title, text, action, danger, requireText }) {
    return new Promise((resolve) => {
      let result = false;
      const { dlg } = sheet(title, (close) => {
        const input = requireText ? h('input', { class: 'input', 'aria-label': `Zum Bestätigen „${requireText}“ eintippen`, autocomplete: 'off' }) : null;
        const go = h('button', {
          type: 'button', class: `btn ${danger ? 'btn-danger' : 'btn-primary'}`, disabled: !!requireText,
          onclick: () => { result = true; close(); },
        }, action);
        if (input) input.addEventListener('input', () => { go.disabled = input.value.trim() !== requireText; });
        return h('div', { class: 'form' },
          h('p', {}, text),
          input && h('div', { class: 'field' }, h('span', { class: 'label' }, `Tippe „${requireText}“ ein`), input),
          h('div', { class: 'btn-row' }, go, h('button', { type: 'button', class: 'btn btn-quiet', onclick: close }, 'Abbrechen')));
      });
      dlg.addEventListener('close', () => resolve(result));
    });
  }

  let toastTimer;
  function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show${bad ? ' bad' : ''}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, bad ? 4000 : 2400);
  }

  /** Betragsfeld, das beim Verlassen speichert und ungültige Eingaben zurücksetzt */
  function plannedInput({ value, currency, label, fk, onCommit }) {
    const input = h('input', {
      class: 'planned num', type: 'text', inputmode: 'decimal', autocomplete: 'off', enterkeyhint: 'done',
      'aria-label': label, 'data-fk': fk, value: Money.toInput(value, currency), placeholder: Money.format(0, currency),
    });
    input.addEventListener('focus', () => input.select());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = Money.toInput(value, currency); input.blur(); }
    });
    input.addEventListener('change', () => {
      const text = input.value.trim();
      const minor = text === '' ? 0 : Money.parse(text, currency);
      if (minor === null) {
        toast('Betrag nicht erkannt. Beispiel: ' + Money.format(123450, currency), true);
        input.value = Money.toInput(value, currency);
        return;
      }
      input.value = Money.toInput(minor, currency);
      onCommit(minor);
    });
    return input;
  }

  /**
   * Ziehen und Ablegen per Maus, Finger oder Stift (Pointer Events).
   * Gezogen wird nur am Griff. opts:
   *   list()     Geschwister, zwischen denen sortiert wird (in DOM-Reihenfolge)
   *   zones()    stattdessen mehrere Bereiche: [{ el, end, items() }], etwa Gruppen;
   *              end ist das Element, vor dem am Ende eines Bereichs eingefügt wird
   *   onDrop(ids) neue Reihenfolge der data-id-Werte
   *   onStart / onEnd optional, etwa um Gruppen zusammenzuklappen
   */
  function draggable(el, handle, opts) {
    handle.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const startY = e.clientY;
      let lastY = startY, dragging = false, grab = 0, shift = 0, raf = 0;
      try { handle.setPointerCapture(e.pointerId); } catch (ex) { /* ältere Browser */ }

      const frame = () => {
        raf = 0;
        const r = el.getBoundingClientRect();
        const center = lastY - grab + r.height / 2;
        const mid = (o) => { const q = o.getBoundingClientRect(); return q.top + q.height / 2; };
        if (opts.zones) {
          /*
           * Mehrere Bereiche (Gruppen): Ziel ist der Bereich unter dem Zeiger,
           * sonst der nächstgelegene. Darin vor die erste tiefere Zeile, sonst ans Ende.
           */
          const zones = opts.zones();
          const dist = (z) => { const q = z.el.getBoundingClientRect(); return center < q.top ? q.top - center : center > q.bottom ? center - q.bottom : 0; };
          const zone = zones.reduce((best, z) => (dist(z) < dist(best) ? z : best), zones[0]);
          const before = zone.items().filter((o) => o !== el).find((o) => center < mid(o));
          const ref = before || zone.end;
          if (el.nextElementSibling !== ref) ref.before(el);
          zones.forEach((z) => z.el.classList.toggle('drop-target', z === zone));
        } else {
          const others = opts.list().filter((o) => o !== el);
          const before = others.find((o) => center < mid(o));
          if (before) { if (el.nextElementSibling !== before) before.before(el); }
          else if (others.length && others[others.length - 1].nextElementSibling !== el) others[others.length - 1].after(el);
        }
        const naturalTop = el.getBoundingClientRect().top - shift;
        shift = lastY - grab - naturalTop;
        el.style.transform = `translateY(${shift}px)`;
        /* Am Bildschirmrand automatisch weiterscrollen */
        const edge = 72;
        const dy = lastY < edge ? -14 : lastY > innerHeight - edge ? 14 : 0;
        if (dy) { scrollBy(0, dy); raf = requestAnimationFrame(frame); }
      };
      const begin = () => {
        dragging = true;
        /* Klappt onStart etwas zusammen, Seite so verschieben, dass das Element unter dem Finger bleibt */
        const topBefore = el.getBoundingClientRect().top;
        if (opts.onStart) opts.onStart();
        const jump = el.getBoundingClientRect().top - topBefore;
        if (jump) scrollBy(0, jump);
        const r = el.getBoundingClientRect();
        grab = lastY - r.top;
        if (grab < 0 || grab > r.height) grab = r.height / 2;
        el.classList.add('is-dragging');
        document.body.classList.add('drag-active');
        App.Fun && App.Fun.vibrate(10);
        frame();
      };
      const move = (ev) => {
        if (ev.pointerId !== e.pointerId) return;
        lastY = ev.clientY;
        if (!dragging && Math.abs(lastY - startY) > 5) begin();
        if (dragging && !raf) raf = requestAnimationFrame(frame);
      };
      const end = (ev) => {
        if (ev && ev.pointerId !== e.pointerId) return;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', end);
        window.removeEventListener('pointercancel', end);
        if (raf) cancelAnimationFrame(raf);
        if (!dragging) return;
        el.style.transform = '';
        el.classList.remove('is-dragging');
        document.body.classList.remove('drag-active');
        if (opts.onEnd) opts.onEnd();
        if (opts.zones) opts.zones().forEach((z) => z.el.classList.remove('drop-target'));
        const ids = (opts.zones ? [...el.parentElement.children].filter((x) => x.classList.contains(el.classList[0])) : opts.list()).map((x) => x.dataset.id);
        opts.onDrop(ids, el.parentElement);
      };
      /*
       * Auf window hören: Beim Umsortieren wird das Element im DOM verschoben,
       * dabei verliert der Griff die Zeigererfassung.
       */
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
    });
  }

  /** Griff zum Verschieben. Mit Pfeiltasten geht es auch ohne Maus. */
  function grip(label, fk, onKey) {
    return h('button', {
      type: 'button', class: 'grip', 'aria-label': `${label} verschieben, ziehen oder Pfeiltasten`, title: 'Ziehen zum Verschieben', 'data-fk': fk,
      onkeydown: (e) => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); onKey(e.key === 'ArrowUp' ? -1 : 1); }
      },
    }, icon('grip'));
  }

  return { h, icon, logo, iconBtn, mount, sheet, confirm, toast, plannedInput, draggable, grip, LOGO };
})();

/* ==========================================================================
   9b FUN: Konfetti, Vibration, Sparschwein-Figur, Meilensteine
   Alles lässt sich in den Einstellungen abschalten und respektiert
   „Bewegung reduzieren“ des Systems.
   ========================================================================== */
App.Fun = (() => {
  const { State, Budget, Utils, UI } = App;
  const enabled = () => !State.s.settings || State.s.settings.effects !== false;
  const calm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /** Kurzes Vibrieren auf Android. iPhones unterstützen das in Web-Apps nicht. */
  function vibrate(pattern) {
    if (!enabled() || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* nicht unterstützt */ }
  }

  /** Konfetti aus den Farben der App, etwa 2 Sekunden */
  function confetti(power = 1) {
    if (!enabled() || calm()) return;
    const c = document.createElement('canvas');
    c.className = 'confetti';
    c.setAttribute('aria-hidden', 'true');
    document.body.append(c);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const x = c.getContext('2d');
    x.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const cols = ['--marker', '--income', '--moss', '--expense', '--ink'].map((v) => css.getPropertyValue(v).trim() || '#FFE14D');
    const ps = Array.from({ length: Math.round(120 * power) }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.35, y: H * 0.38,
      vx: (Math.random() - 0.5) * 10, vy: -Math.random() * 12 - 4,
      r: Math.random() * 6 + 5, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.35,
      c: cols[Math.floor(Math.random() * cols.length)],
    }));
    const t0 = performance.now();
    (function frame(t) {
      const dt = t - t0;
      x.clearRect(0, 0, W, H);
      ps.forEach((p) => {
        p.vy += 0.33; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        x.save(); x.translate(p.x, p.y); x.rotate(p.a);
        x.globalAlpha = Math.max(0, 1 - dt / 2000); x.fillStyle = p.c;
        x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        x.restore();
      });
      if (dt < 2000) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }

  /**
   * Eigene Sparschwein-Figur, gefüllt bis fill Prozent.
   * drop: eine Münze fällt hinein. done: Ziel erreicht, Füllung in Textmarker-Gelb.
   */
  let seq = 0;
  function pig(fill, { size = 48, done = false, drop = false } = {}) {
    const id = `pig${++seq}`;
    const level = 77 - (Math.max(0, Math.min(100, fill)) / 100) * 52;
    const wrap = document.createElement('span');
    wrap.className = `pig${drop && enabled() ? ' drop' : ''}${done ? ' done' : ''}`;
    wrap.style.width = `${size}px`;
    wrap.style.height = `${Math.round(size * 0.9)}px`;
    wrap.setAttribute('aria-hidden', 'true');
    /* Nur Zahlen fliessen in dieses Markup. */
    wrap.innerHTML = `<svg viewBox="0 0 100 90">
      <defs><clipPath id="${id}"><ellipse cx="48" cy="51" rx="35" ry="26"/></clipPath></defs>
      <path class="pig-tail" d="M14 46c-8 0-10-8-4-10 5-1 5 6 0 7"/>
      <rect class="pig-leg" x="24" y="68" width="10" height="14" rx="3"/><rect class="pig-leg" x="58" y="68" width="10" height="14" rx="3"/>
      <ellipse class="pig-body" cx="48" cy="51" rx="35" ry="26"/>
      <rect class="pig-fill" clip-path="url(#${id})" x="10" y="${level.toFixed(1)}" width="80" height="60"/>
      <ellipse class="pig-line" cx="48" cy="51" rx="35" ry="26"/>
      <path class="pig-ear" d="M58 29l7-13 8 15z"/>
      <rect class="pig-snout" x="78" y="44" width="15" height="15" rx="6"/>
      <circle class="pig-dot" cx="83.5" cy="51.5" r="1.7"/><circle class="pig-dot" cx="88.5" cy="51.5" r="1.7"/>
      <circle class="pig-eye" cx="69" cy="43" r="2.6"/>
      <path class="pig-slot" d="M39 29h15"/>
      <circle class="pig-coin" cx="46.5" cy="6" r="6"/>
    </svg>`;
    return wrap;
  }

  /* Gesparter Stand je Sparschwein beim letzten Zeichnen, um Einzahlungen zu bemerken */
  const lastSaved = new Map();
  /** true, wenn seit dem letzten Zeichnen eingezahlt wurde */
  function deposited(lineId, saved) {
    const before = lastSaved.get(lineId);
    lastSaved.set(lineId, saved);
    return before !== undefined && saved > before;
  }

  /**
   * Meilensteine bei 25, 50, 75 und 100 % feiern. Beim ersten Mal wird der
   * aktuelle Stand still gemerkt, damit alte Fortschritte nicht gefeiert werden.
   */
  let busy = false;
  function checkMilestones() {
    const S = State.s;
    if (!S.snap || busy) return;
    const month = Budget.monthOf(S.snap, Utils.thisYm()) || [...S.snap.months].sort((a, b) => b.ym.localeCompare(a.ym))[0];
    if (!month) return;
    const actuals = Budget.actualsByItem(S.snap, month.id);
    const cel = S.settings.celebrated || {};
    const patch = {};
    let best = null;
    Budget.itemsOfMonth(S.snap, month.id).filter((i) => i.kind === 'fund' && i.goalMinor > 0).forEach((item) => {
      const pct = Budget.piggy(S.snap, item, actuals).pct;
      const stage = [100, 75, 50, 25].find((x) => pct >= x) || 0;
      const prev = cel[item.lineId];
      if (prev === stage) return;
      patch[item.lineId] = stage;
      if (prev !== undefined && stage > prev && (!best || stage > best.stage)) best = { item, stage };
    });
    if (!Object.keys(patch).length) return;
    busy = true;
    State.patchSettings({ celebrated: { ...cel, ...patch } }).finally(() => { busy = false; });
    if (best) {
      setTimeout(() => {
        confetti(best.stage === 100 ? 1.5 : 0.7);
        vibrate([20, 40, 20]);
        UI.toast(best.stage === 100 ? `${best.item.name}: Sparziel erreicht!` : `${best.item.name}: ${best.stage} % geschafft`);
      }, 300);
    }
  }

  return { vibrate, confetti, pig, deposited, checkMilestones, enabled, reset: () => lastSaved.clear() };
})();
