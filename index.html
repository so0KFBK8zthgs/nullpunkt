<style>
/* ==========================================================================
   1 TOKENS: Kontenblatt-Grün, Tinte, Rotstift und Textmarker
   ========================================================================== */
:root {
  --paper: #E8F0E9;
  --sheet: #F5F9F4;
  --ink: #16325A;
  --ink-soft: #46607F;
  --rule: #BCCFC2;
  --rule-strong: #16325A;
  --margin: rgba(179, 38, 30, .32);
  --red: #B3261E;
  --marker: #FFE14D;
  --on-marker: #16325A;
  --on-ink: #F5F9F4;
  --hover: rgba(22, 50, 90, .07);
  --income: #C27A12;
  --expense: #2B5C9E;
  --track: #D6E2D9;
  --moss: #2F7A55;
  /* Balance-Status: offen (noch zu verteilen) und überzogen */
  --open-bg: #FCE9C4; --open-fg: #7A4A00;
  --over-bg: #F8DCD9; --over-fg: #9E1F18;
  --backdrop: rgba(14, 32, 44, .45);

  --sans: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", "Book Antiqua", serif;

  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2rem; --s7: 3rem;
  --tabs-h: 3.75rem;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #122027; --sheet: #1A2B33; --ink: #E4EEE6; --ink-soft: #A5B9B6;
    --rule: #33494F; --rule-strong: #A5B9B6; --margin: rgba(255, 138, 127, .28);
    --red: #FF9A90; --on-ink: #122027; --hover: rgba(228, 238, 230, .08);
    --income: #C08220; --expense: #5A96E0; --track: #2A3E46; --backdrop: rgba(0, 0, 0, .6); color-scheme: dark; --moss: #6CC59A;
    --open-bg: rgba(224, 160, 60, .2); --open-fg: #F2C27A; --over-bg: rgba(255, 138, 127, .18); --over-fg: #FFA49B;
  }
}
:root[data-theme="dark"] {
  --paper: #122027; --sheet: #1A2B33; --ink: #E4EEE6; --ink-soft: #A5B9B6;
  --rule: #33494F; --rule-strong: #A5B9B6; --margin: rgba(255, 138, 127, .28);
  --red: #FF9A90; --on-ink: #122027; --hover: rgba(228, 238, 230, .08);
  --income: #C08220; --expense: #5A96E0; --track: #2A3E46; --backdrop: rgba(0, 0, 0, .6); color-scheme: dark; --moss: #6CC59A;
    --open-bg: rgba(224, 160, 60, .2); --open-fg: #F2C27A; --over-bg: rgba(255, 138, 127, .18); --over-fg: #FFA49B;
}

/* ==========================================================================
   2 BASIS
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink);
  font: 400 1rem/1.45 var(--sans);
}
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--serif); font-weight: 600; line-height: 1.2; }
h1 { font-size: 1.625rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--expense); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.soft { color: var(--ink-soft); }
.small { font-size: .875rem; }
.neg { color: var(--red); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icon { display: inline-flex; width: 1.25rem; height: 1.25rem; flex: none; }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ==========================================================================
   3 LAYOUT: Handy mit Tab-Leiste, Desktop mit Seitenleiste
   ========================================================================== */
.rail {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  padding: calc(var(--s3) + var(--safe-t)) var(--s4) var(--s3);
}
.brand { display: flex; align-items: center; gap: var(--s2); font: 600 1.1875rem/1 var(--serif); }
.brand svg { width: 1.75rem; height: 1.75rem; }
.rail .acct-list, .rail .rail-add { display: none; }
.acct-btn {
  display: flex; align-items: center; gap: var(--s1); min-height: 2.75rem; min-width: 0; max-width: 60%;
  padding: 0 var(--s1) 0 var(--s3); font-weight: 600;
}
.acct-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs {
  position: fixed; inset: auto 0 0 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--sheet); border-top: 1px solid var(--rule); padding-bottom: var(--safe-b);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: var(--tabs-h); font-size: .75rem; color: var(--ink-soft); text-decoration: none;
}
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.fab {
  position: fixed; right: var(--s4); bottom: calc(var(--tabs-h) + var(--safe-b) + var(--s4)); z-index: 11;
  width: 3.5rem; height: 3.5rem; border-radius: 50%; background: var(--ink); color: var(--on-ink);
  display: grid; place-items: center; box-shadow: 0 3px 10px rgba(14, 32, 44, .3);
}
.fab .icon { width: 1.625rem; height: 1.625rem; }
main {
  padding: 0 var(--s4) calc(var(--tabs-h) + var(--safe-b) + 5.5rem);
  max-width: 68rem; margin: 0 auto;
}

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 16rem minmax(0, 1fr); min-height: 100dvh; }
  .rail {
    position: sticky; top: 0; height: 100dvh; flex-direction: column; align-items: stretch;
    justify-content: flex-start; gap: var(--s5); padding: var(--s5) var(--s4);
    background: var(--sheet); border-right: 1px solid var(--rule); overflow-y: auto;
  }
  .acct-btn, .fab { display: none; }
  .rail .acct-list { display: flex; flex-direction: column; gap: 2px; }
  .rail .rail-add { display: flex; }
  .tabs { position: static; display: flex; flex-direction: column; gap: 2px; background: none; border: 0; padding: 0; margin-top: auto; }
  .tab { flex-direction: row; justify-content: flex-start; gap: var(--s3); height: 2.75rem; padding: 0 var(--s3); font-size: 1rem; border-radius: 6px; }
  .tab:hover { background: var(--hover); }
  .tab[aria-current="page"] { background: var(--hover); }
  main { padding: var(--s5) var(--s6) var(--s7); width: 100%; }
}

/* ==========================================================================
   4 KOMPONENTEN
   ========================================================================== */
/* Knöpfe */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 2.75rem; padding: 0 var(--s4); border-radius: 6px; font-weight: 600;
  border: 1px solid var(--rule-strong); text-align: center;
}
.btn:hover { background: var(--hover); }
.btn-primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink); opacity: .9; }
.btn-danger { color: var(--red); border-color: var(--red); }
.btn-quiet { border-color: transparent; font-weight: 500; padding: 0 var(--s2); }
.btn-wide { width: 100%; }
.btn-icon { width: 2.75rem; padding: 0; border-color: transparent; }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s2); }
.btn[disabled] { opacity: .4; cursor: default; }

/* Formulare */
.field { display: flex; flex-direction: column; gap: var(--s1); }
.field > label, .field > .label, fieldset > legend { font-size: .875rem; font-weight: 600; padding: 0; }
.input, select.input, textarea.input {
  width: 100%; min-height: 2.75rem; padding: var(--s2) var(--s3); font-size: 1rem;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px;
}
.input:focus { border-color: var(--ink); }
.input[aria-invalid="true"] { border-color: var(--red); }
textarea.input { min-height: 4.5rem; resize: vertical; }
.input-big { font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.affix { display: flex; align-items: center; gap: var(--s2); }
.affix .input { flex: 1; min-width: 0; }
.affix > span { font-weight: 600; }
.error { color: var(--red); font-size: .875rem; }
.error:empty { display: none; }
.form { display: flex; flex-direction: column; gap: var(--s4); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

/* Segment-Auswahl */
.segment { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s2); margin-top: var(--s1); }
.segment label {
  position: relative; display: grid; place-items: center; min-height: 2.75rem; padding: var(--s2); text-align: center;
  border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; font-weight: 600;
}
.segment input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.segment input:checked + span { display: block; }
.segment label:has(input:checked) { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.segment label:has(input:focus-visible) { outline: 2px solid var(--expense); outline-offset: 2px; }

/* Bottom-Sheet und Dialog */
dialog {
  border: 0; padding: 0; color: var(--ink); background: var(--sheet);
  width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 14px 14px 0 0;
  max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
}
dialog::backdrop { background: var(--backdrop); }
.sheet-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
  gap: var(--s3); padding: var(--s3) var(--s2) var(--s2) var(--s4); background: var(--sheet);
}
.sheet-body { padding: var(--s2) var(--s4) calc(var(--s5) + var(--safe-b)); }
@media (min-width: 640px) {
  dialog { width: 30rem; margin: auto; border-radius: 10px; }
}

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: calc(var(--tabs-h) + var(--safe-b) + 5rem); transform: translateX(-50%);
  z-index: 30; width: max-content; max-width: calc(100vw - 2rem); padding: var(--s2) var(--s4); border-radius: 6px;
  background: var(--ink); color: var(--on-ink); font-size: .9375rem; opacity: 0; pointer-events: none;
  transition: opacity .15s;
}
#toast.show { opacity: 1; }
#toast.bad { background: var(--red); }
@media (min-width: 900px) { #toast { bottom: var(--s5); } }

/* Hinweisleiste */
.notice {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3);
  padding: var(--s3) 0; border-block: 1px solid var(--rule); margin-bottom: var(--s4);
}
.notice p { flex: 1 1 14rem; font-size: .9375rem; }

/* Monatswähler */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s4); }
.month-nav { display: flex; align-items: center; gap: var(--s1); margin-left: calc(var(--s3) * -1); }
.month-nav h1 { min-width: 0; text-align: left; }
.today { flex: none; }

/* Textmarker */
.mark {
  background: linear-gradient(to bottom, transparent 8%, var(--marker) 8%, var(--marker) 92%, transparent 92%);
  color: var(--on-marker); padding: 0 .25em; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
}

/* Leerer Zustand */
.empty { padding: var(--s6) 0; display: flex; flex-direction: column; gap: var(--s3); align-items: flex-start; max-width: 32rem; }

/* ==========================================================================
   5 ANSICHTEN
   ========================================================================== */
/* Nullring */
.budget-grid { display: grid; gap: var(--s5); }
.zero { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4); }
.ring { position: relative; width: 8.5rem; height: 8.5rem; flex: none; margin-inline: auto; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring-track { fill: none; stroke: var(--track); stroke-width: 12; }
.ring-arc { fill: none; stroke: var(--ink); stroke-width: 12; stroke-linecap: round; transition: stroke-dasharray .5s cubic-bezier(.3, .7, .2, 1); }
.is-over .ring-arc { stroke: var(--red); }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
.ring-amount { font-weight: 700; line-height: 1.25; font-size: calc(var(--fs) * .76); }
.ring-label { font-size: .75rem; line-height: 1.15; max-width: 5.5rem; color: var(--ink-soft); }
.is-over .ring-amount { background: none; color: var(--red); }
.is-closed .ring-amount { background: none; color: var(--ink); }
.ring-dot { fill: var(--marker); stroke: var(--ink); stroke-width: 2.5; opacity: 0; }
.is-closed .ring-dot { opacity: 1; }
.just-closed .ring { animation: snap .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes snap { 0% { transform: scale(.94); } 100% { transform: scale(1); } }
.equation { flex: 1 1 10rem; min-width: 0; }
.eq-row { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s1) 0; }
.eq-total { font-weight: 700; border-top: 1px solid var(--rule-strong); border-bottom: 3px double var(--rule-strong); margin-top: var(--s1); }
.zero-msg { flex: 1 1 100%; font-size: .9375rem; }

/* Budget-Tabelle im Kontenblatt-Stil */
.group { margin-bottom: var(--s6); }
.group-head, .row, .group-foot { display: grid; grid-template-columns: minmax(0, 1fr) 7rem 7rem 7rem; align-items: stretch; }
.group-head { align-items: end; border-bottom: 2px solid var(--rule-strong); }
.group-title { text-align: left; font: 600 1.1875rem/1.2 var(--serif); padding: var(--s2) var(--s2) var(--s2) 0; min-height: 2.75rem; }
.group-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.col-head { text-align: right; font-size: .75rem; color: var(--ink-soft); padding: 0 .375rem var(--s1); border-left: 1px solid var(--margin); }
.row { border-bottom: 1px solid var(--rule); min-height: 3.25rem; }
.row-namecell { display: flex; align-items: stretch; min-width: 0; }
.row-namecell .row-name { flex: 1; }
.group-titlecell { display: flex; align-items: center; min-width: 0; }
.group-titlecell .group-title { flex: 1; min-width: 0; }
/* Ziehgriff: nur hier startet das Verschieben, damit Scrollen normal bleibt */
.grip { display: grid; place-items: center; width: 1.75rem; flex: none; margin-left: -.375rem; color: var(--ink-soft); opacity: .55; cursor: grab; touch-action: none; border-radius: 4px; -webkit-user-select: none; user-select: none; }
.grip:hover, .grip:focus-visible { opacity: 1; background: var(--hover); }
.grip .icon { width: 1.125rem; height: 1.125rem; }
.grip .icon svg { fill: currentColor; stroke: none; }
.drop-target > .group-head { background: var(--hover); box-shadow: inset 3px 0 0 var(--marker); }
.is-dragging { position: relative; z-index: 20; background: var(--sheet); box-shadow: 0 10px 28px rgba(14, 32, 44, .28); border-radius: 6px; }
.drag-active, .drag-active * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
/* Beim Verschieben von Gruppen nur die Köpfe zeigen, damit es auch auf dem Handy handlich bleibt */
.sorting-groups .group-sortable .row, .sorting-groups .group-sortable .group-foot, .sorting-groups .group-sortable .col-head { display: none; }
.row-name { display: flex; flex-direction: column; justify-content: center; gap: 3px; text-align: left; padding: var(--s2) var(--s2) var(--s2) 0; min-width: 0; }
.row-name:hover .row-title { text-decoration: underline; text-underline-offset: 3px; }
.row-title { overflow-wrap: break-word; hyphens: auto; line-height: 1.25; }
.row-sub { font-size: .8125rem; color: var(--ink-soft); line-height: 1.2; }
.meter { display: block; height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ink-soft); border-radius: 2px; }
.meter.over > i { background: var(--red); }
/* Sparschwein: Fortschritt zum Sparziel, Motivation als Erinnerung */
.goal { display: block; height: 6px; background: var(--track); border-radius: 0 3px 3px 0; overflow: hidden; }
.goal > i { display: block; height: 100%; background: var(--income); border-radius: 0 3px 3px 0; }
.goal.done > i { background: var(--ink); }
.row-why { display: block; max-width: 100%; font: italic .8125rem/1.3 var(--serif); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.piggy { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3) 0; border-bottom: 1px solid var(--rule); }
.piggy-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--s1) var(--s3); }
.piggy-top .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.piggy-why { margin: 0; padding-left: var(--s3); border-left: 3px solid var(--marker); font: italic 1rem/1.45 var(--serif); overflow-wrap: anywhere; }
.piggy-goal[hidden] { display: none; }
/* Balance farbig: orange = noch offen, rot = überzogen, grau = erledigt */
.bal { display: inline-block; padding: 1px 5px; margin-right: -5px; border-radius: 4px; font-variant-numeric: tabular-nums lining-nums; }
.bal-open { background: var(--open-bg); color: var(--open-fg); font-weight: 600; }
.bal-over { background: var(--over-bg); color: var(--over-fg); font-weight: 600; }
.bal-zero { color: var(--moss); display: inline-flex; align-items: center; gap: 2px; }
.bal-zero .icon { width: .8rem; height: .8rem; }
.close-status { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3) 0; border-block: 1px solid var(--rule); font-size: .9375rem; }
.close-status .legend { margin: 0; }
.close-status .legend i { width: auto; height: auto; padding: 0 5px; border-radius: 4px; font-style: normal; }
.close-list { list-style: none; margin: 0; padding: 0; max-width: 32rem; }
.close-list li { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--rule); }
.savings { padding-top: var(--s2); }
.savings .savings-title:hover { text-decoration: none; }
.savings-empty { padding: var(--s3) 0; font-size: .9375rem; max-width: 34rem; }
.piggy-goal { display: flex; flex-direction: column; gap: var(--s4); padding: var(--s3) 0 0; }
.cell { display: flex; align-items: center; justify-content: flex-end; border-left: 1px solid var(--margin); padding: 0 .375rem; min-width: 0; font-size: .875rem; }
.cell-input { padding: 0; }
/* Ist-Zelle: Tippen erfasst eine Buchung für diesen Posten */
.cell-tap { justify-content: space-between; gap: 2px; width: 100%; min-height: 3.25rem; text-align: right; cursor: pointer; }
.cell-tap .icon { width: .875rem; height: .875rem; color: var(--ink-soft); opacity: .55; }
.cell-tap:hover { background: var(--hover); }
.cell-tap:hover .icon { opacity: 1; }
.cell-tap:active { background: var(--track); }
.cell-tap:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 3px; }
.planned {
  width: 100%; height: 100%; min-height: 3.25rem; border: 0; background: transparent; text-align: right;
  padding: 0 .375rem; font-size: 1rem; font-variant-numeric: tabular-nums lining-nums;
}
.planned:hover { background: var(--hover); }
.planned:focus { background: var(--sheet); outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 3px; }
.group-foot { font-weight: 700; border-bottom: 3px double var(--rule-strong); min-height: 2.5rem; }
.group-foot .add { justify-self: start; font-weight: 500; }
.group-foot > .label { display: flex; align-items: center; }
.add { display: inline-flex; align-items: center; gap: var(--s1); min-height: 2.75rem; color: var(--ink-soft); font-size: .9375rem; }
.add:hover { color: var(--ink); }

<div id="csp-hint" role="alert">Nullpunkt konnte nicht starten. Wahrscheinlich passt die Prüfsumme in der Sicherheitsregel (Content-Security-Policy) im Kopf der Datei nicht mehr zum Skript. Deine Daten sind unverändert.</div>

<script>
'use strict';
/* ==========================================================================
   Nullpunkt: Zero-Based-Budget in einer Datei.

   Abhängigkeiten laufen nur von oben nach unten:
   Config > Utils > Money > DB > Repo > Budget > State > Backup > UI > Views
   > Router > Bootstrap. Money und Budget greifen nie auf das DOM zu.

   Grundidee: Jedes Konto ist ein eigenes Nullbudget mit fester Währung.
   Beträge sind überall Ganzzahlen in Rappen/Cent (Felder ...Minor).
   ========================================================================== */
const App = {};

/* ==========================================================================
   1 CONFIG: Konstanten und Währungen
   ========================================================================== */
App.Config = (() => {
  const CURRENCIES = {
    CHF: { code: 'CHF', group: "'", decimal: '.', word: 'Franken' },
    EUR: { code: 'EUR', group: '.', decimal: ',', word: 'Euro' },
  };

  /* Grenze pro Betrag, damit Ganzzahlen auch in Summen sicher bleiben. */
  const MAX_MINOR = 99999999999;

  /* Startvorlage für ein neues Konto. kind 'fund' ist ein Sparschwein: der Rest wandert in den nächsten Monat. */
  const TEMPLATE = [
    { name: 'Einnahmen', type: 'income', items: [['Lohn'], ['Nebeneinkünfte']] },
    { name: 'Wohnen', type: 'expense', items: [['Miete'], ['Nebenkosten'], ['Internet und Telefon']] },
    { name: 'Essen', type: 'expense', items: [['Lebensmittel'], ['Auswärts essen']] },
    { name: 'Mobilität', type: 'expense', items: [['ÖV'], ['Auto']] },
    { name: 'Versicherungen', type: 'expense', items: [['Krankenkasse'], ['Haftpflicht und Hausrat']] },
    { name: 'Alltag', type: 'expense', items: [['Kleidung'], ['Freizeit'], ['Abos']] },
    { name: 'Sparschweine', type: 'savings', items: [['Notgroschen', 'fund'], ['Ferien', 'fund'], ['Steuern', 'fund']] },
  ];

  return {
    /* APP_VERSION bei jeder veröffentlichten Änderung erhöhen, ebenso VERSION in sw.js */
    APP_ID: 'nullpunkt', APP_VERSION: '1.0.2', DB_NAME: 'nullpunkt', SCHEMA_VERSION: 3,
    CURRENCIES, MAX_MINOR, TEMPLATE,
    BACKUP_REMINDER_DAYS: 30, BACKUP_SNOOZE_DAYS: 7,
  };
})();

/* ==========================================================================
   2 UTILS: IDs, Datum, Monate
   ========================================================================== */
App.Utils = (() => {
  /* Funktioniert auch ohne sicheren Kontext, anders als crypto.randomUUID. */
  function uid() {
    const b = crypto.getRandomValues(new Uint8Array(12));
    return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  }
  const pad = (n) => String(n).padStart(2, '0');

  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  const ymOf = (date) => date.slice(0, 7);
  const thisYm = () => ymOf(today());

  function addMonths(ym, delta) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  }

  /* Prüft auch unmögliche Tage wie den 31. April. */
  function isValidDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const x = new Date(y, m - 1, d);
    return x.getFullYear() === y && x.getMonth() === m - 1 && x.getDate() === d;
  }
  const isValidYm = (s) => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s);

  function ymDate(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1); }
  const monthLabel = (ym) => ymDate(ym).toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });
  const monthName = (ym) => ymDate(ym).toLocaleDateString('de-CH', { month: 'long' });
  const monthShort = (ym) => ymDate(ym).toLocaleDateString('de-CH', { month: 'short' });
  function dayLabel(date) {
    const [y, m, d] = date.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function dateLabel(date) {
    const [y, m, d] = date.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('de-CH', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  /** Ganze Monate von ym a bis ym b (gleicher Monat = 0) */
  function monthsBetween(a, b) {
    const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
    return (yb - ya) * 12 + (mb - ma);
  }
  /**
   * Sparschweine stehen ausserhalb der Gruppen. Technisch liegen sie je Monat
   * in einer festen Gruppe vom Typ 'savings', die nie als Gruppe angezeigt wird.
   * Ältere Daten hatten Sparschweine (kind 'fund') in normalen Gruppen. Diese
   * Funktion verschiebt sie und löscht Gruppen, die dadurch leer werden.
   * Ändert die übergebenen Posten direkt und meldet, was zu speichern ist.
   */
  function normalizeSavings(groups, items) {
    const byId = new Map(groups.map((g) => [g.id, g]));
    const savingsOf = new Map(groups.filter((g) => g.type === 'savings').map((g) => [g.monthId, g]));
    const putGroups = [], putItems = new Set(), emptied = new Set();
    items.filter((i) => i.kind === 'fund' && (byId.get(i.groupId) || {}).type !== 'savings').forEach((i) => {
      let sg = savingsOf.get(i.monthId);
      if (!sg) {
        sg = { id: uid(), accountId: i.accountId, monthId: i.monthId, lineId: `savings:${i.accountId}`, name: 'Sparschweine', type: 'savings', sort: 999 };
        savingsOf.set(i.monthId, sg); byId.set(sg.id, sg); putGroups.push(sg);
      }
      emptied.add(i.groupId);
      i.sort = items.filter((x) => x.groupId === sg.id).reduce((m, x) => Math.max(m, x.sort), -1) + 1;
      i.groupId = sg.id;
      putItems.add(i);
    });
    items.filter((i) => (byId.get(i.groupId) || {}).type === 'savings' && i.kind !== 'fund').forEach((i) => { i.kind = 'fund'; putItems.add(i); });
    const delGroups = [...emptied].filter((gid) => !items.some((i) => i.groupId === gid));
    return { putGroups, putItems: [...putItems], delGroups };
  }

  const bySort = (a, b) => a.sort - b.sort;
  const nextSort = (list) => list.reduce((max, x) => Math.max(max, x.sort), -1) + 1;
  const sum = (list, f) => list.reduce((acc, x) => acc + f(x), 0);

  return { uid, today, ymOf, thisYm, addMonths, isValidDate, isValidYm, monthLabel, monthName, monthShort, dayLabel, dateLabel, monthsBetween, normalizeSavings, bySort, nextSort, sum };
})();

/* ==========================================================================
   2b CRYPTO: Verschlüsselung mit der Web Crypto API des Browsers
   AES-GCM mit 256 Bit, Schlüssel aus dem Passwort per PBKDF2-SHA-256.
   Kein eigener Krypto-Code, nur die geprüften Funktionen des Browsers.
   ========================================================================== */
App.Crypto = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  /* Iterationen nach aktueller OWASP-Empfehlung für PBKDF2-SHA-256 */
  const ITER = 600000;
  const available = () => !!(window.crypto && crypto.subtle);

  function b64(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function unb64(str) {
    const s = atob(String(str || ''));
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }

  /** Schlüssel aus dem Passwort ableiten. Absichtlich langsam gegen Durchprobieren. */
  async function kek(password, salt, iterations = ITER) {
    const base = await crypto.subtle.importKey('raw', te.encode(String(password).normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  /**
   * Verschlüsseln. aad bindet den Inhalt an seinen Platz (etwa „transactions:abc“),
   * damit niemand verschlüsselte Datensätze unbemerkt vertauschen kann.
   */
  async function seal(key, bytes, aad) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(aad) }, key, bytes));
    return { iv, ct };
  }
  /** Entschlüsseln. Wirft bei falschem Schlüssel oder veränderten Daten. */
  async function unseal(key, box, aad) {
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: box.iv, additionalData: te.encode(aad) }, key, box.ct));
  }
  /* Der Datenschlüssel ist nach dem Import nicht mehr auslesbar. */
  const importAes = (raw) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);

  async function sha256Hex(str) {
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(String(str))));
    return Array.from(hash, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  /* ---- Verschlüsselte Backup-Datei ---- */
  const BACKUP_AAD = 'nullpunkt-backup-v1';

  async function encryptBackup(text, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const box = await seal(await kek(password, salt), te.encode(text), BACKUP_AAD);
    return JSON.stringify({
      app: 'nullpunkt', format: 'encrypted-backup', version: 1,
      kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: ITER, salt: b64(salt) },
      cipher: 'AES-GCM', iv: b64(box.iv), data: b64(box.ct),
    });
  }

  const isEncryptedBackup = (o) => !!o && o.app === 'nullpunkt' && o.format === 'encrypted-backup';

  async function decryptBackup(o, password) {
    const it = o.kdf && o.kdf.iterations;
    if (!Number.isInteger(it) || it < 100000 || it > 5000000) throw new Error('format');
    const k = await kek(password, unb64(o.kdf.salt), it);
    return td.decode(await unseal(k, { iv: unb64(o.iv), ct: unb64(o.data) }, BACKUP_AAD));
  }

  return { ITER, te, td, available, b64, unb64, kek, seal, unseal, importAes, sha256Hex, encryptBackup, decryptBackup, isEncryptedBackup };
})();

/* ==========================================================================
   3 MONEY: Eingaben parsen und formatieren, immer als Ganzzahl
   ========================================================================== */
App.Money = (() => {
  const { CURRENCIES, MAX_MINOR } = App.Config;

  /**
   * Wandelt Text in Rappen/Cent um, ohne Gleitkomma-Rechnung.
   * Akzeptiert 1'234.50, 1.234,50, 1234,5, 12.50 und 1 234.
   * Eine einzelne Trennstelle mit drei Folgeziffern gilt nur dann als
   * Tausendertrenner, wenn sie zur Kontowährung passt (EUR: 1.234).
   * @returns {number|null} null bei ungültiger Eingabe
   */
  function parse(text, currency, opts = {}) {
    let s = String(text ?? '').trim().replace(/[\s  '’]/g, '');
    let negative = false;
    if (/^[-−]/.test(s)) { negative = true; s = s.slice(1); }
    if (!s || !/^[\d.,]+$/.test(s) || !/\d/.test(s)) return null;
    if (negative && !opts.allowNegative) return null;

    const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
    let whole = s, frac = '';

    if (lastDot >= 0 && lastComma >= 0) {
      /* Beide Zeichen vorhanden: das letzte ist das Dezimalzeichen. */
      const dec = Math.max(lastDot, lastComma);
      whole = s.slice(0, dec); frac = s.slice(dec + 1);
      const sep = dec === lastDot ? ',' : '.';
      if (whole.includes(dec === lastDot ? '.' : ',')) return null;
      if (!validGroups(whole, sep)) return null;
      whole = whole.split(sep).join('');
    } else if (lastDot >= 0 || lastComma >= 0) {
      const sep = lastDot >= 0 ? '.' : ',';
      const parts = s.split(sep);
      if (parts.length > 2) {
        if (!validGroups(s, sep)) return null;
        whole = parts.join('');
      } else if (parts[1].length === 3) {
        if (sep !== CURRENCIES[currency].group || !parts[0] || parts[0].length > 3) return null;
        whole = parts.join('');
      } else {
        whole = parts[0]; frac = parts[1];
      }
    }

    if (frac.length > 2 || !/^\d*$/.test(frac) || !/^\d*$/.test(whole)) return null;
    if (whole === '' && frac === '') return null;
    whole = whole.replace(/^0+(?=\d)/, '');
    if (whole.length > 10) return null;

    const minor = Number(whole || '0') * 100 + Number(frac.padEnd(2, '0') || '0');
    if (!Number.isSafeInteger(minor) || minor > MAX_MINOR) return null;
    return negative ? -minor : minor;
  }

  function validGroups(s, sep) {
    const p = s.split(sep);
    return p[0].length >= 1 && p[0].length <= 3 && p.slice(1).every((x) => x.length === 3);
  }

  function parts(minor) {
    const abs = Math.abs(minor);
    return { sign: minor < 0 ? '−' : '', whole: String(Math.floor(abs / 100)), cents: String(abs % 100).padStart(2, '0') };
  }

  /** Anzeige ohne Währung: 1'234.50 oder 1.234,50 */
  function format(minor, currency) {
    const c = CURRENCIES[currency], p = parts(minor);
    return `${p.sign}${p.whole.replace(/\B(?=(\d{3})+$)/g, c.group)}${c.decimal}${p.cents}`;
  }

  /** Anzeige mit Währung: CHF 1'234.50 oder 1.234,50 € */
  function label(minor, currency) {
    return currency === 'CHF' ? `CHF ${format(minor, currency)}` : `${format(minor, currency)} €`;
  }

  /** Wert für Eingabefelder, leer bei 0 */
  function toInput(minor, currency) { return minor ? format(minor, currency) : ''; }

  return { parse, format, label, toInput };
})();

/* ==========================================================================
   4 DB: IndexedDB und Migrationen
   ========================================================================== */
App.DB = (() => {
  const { DB_NAME, SCHEMA_VERSION } = App.Config;
  const STORES = ['meta', 'accounts', 'months', 'groups', 'items', 'transactions'];
  let db = null;

  /* Jede Schema-Version bekommt einen eigenen Schritt. */
  const MIGRATIONS = {
    1(d) {
      const make = (name, key, indexes = []) => {
        const s = d.createObjectStore(name, { keyPath: key });
        indexes.forEach((i) => s.createIndex(i, i));
      };
      make('meta', 'key');
      make('accounts', 'id');
      make('months', 'id', ['accountId']);
      make('groups', 'id', ['accountId', 'monthId']);
      make('items', 'id', ['accountId', 'monthId', 'groupId', 'lineId']);
      make('transactions', 'id', ['accountId', 'monthId', 'date']);
    },
    /*
     * Version 2 brachte ein inzwischen entferntes Korrekturfeld. Der Schritt
     * bleibt leer erhalten, weil sich eine IndexedDB nicht zurückstufen lässt.
     * Ältere Werte des Feldes werden nirgends mehr gelesen.
     */
    2() {},
    /* Version 3: Sparschweine aus den Gruppen in einen eigenen Bereich verschieben. */
    3(d, tx) {
      const gs = tx.objectStore('groups'), is = tx.objectStore('items');
      gs.getAll().onsuccess = (e1) => {
        const groups = e1.target.result;
        is.getAll().onsuccess = (e2) => {
          const r = App.Utils.normalizeSavings(groups, e2.target.result);
          r.putGroups.forEach((g) => gs.put(g));
          r.putItems.forEach((i) => is.put(i));
          r.delGroups.forEach((id) => gs.delete(id));
        };
      };
    },
  };

  function open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB fehlt')); return; }
      const req = indexedDB.open(DB_NAME, SCHEMA_VERSION);
      req.onupgradeneeded = (e) => {
        for (let v = e.oldVersion + 1; v <= SCHEMA_VERSION; v++) MIGRATIONS[v](req.result, req.transaction);
      };
      req.onsuccess = () => {
        db = req.result;
        db.onversionchange = () => db.close();
        resolve();
      };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('Datenbank ist in einem anderen Tab blockiert'));
    });
  }

  const asPromise = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  /*
   * Verschlüsselung je Datensatz. Gespeichert wird nur { id, iv, ct }:
   * ID, Zufallswert und Geheimtext. Beträge, Texte und Daten sind nicht lesbar.
   * Nur der Tresor-Eintrag („vault“) bleibt unverschlüsselt, er enthält
   * den mit dem Passwort verpackten Schlüssel.
   */
  let cipher = null;
  const PLAIN_META = new Set(['vault']);
  const keyOf = (store, rec) => (store === 'meta' ? rec.key : rec.id);
  function setCipher(k) { cipher = k; }

  async function encode(store, rec) {
    if (!cipher || (store === 'meta' && PLAIN_META.has(rec.key))) return rec;
    const k = keyOf(store, rec);
    const box = await App.Crypto.seal(cipher, App.Crypto.te.encode(JSON.stringify(rec)), `${store}:${k}`);
    return { [store === 'meta' ? 'key' : 'id']: k, iv: box.iv, ct: box.ct };
  }
  async function decode(store, rec) {
    if (!rec || !(rec.ct instanceof Uint8Array)) return rec;
    if (!cipher) throw new Error('gesperrt');
    const pt = await App.Crypto.unseal(cipher, rec, `${store}:${keyOf(store, rec)}`);
    return JSON.parse(App.Crypto.td.decode(pt));
  }

  const rawAll = (store) => asPromise(db.transaction(store).objectStore(store).getAll());
  async function getAll(store) {
    const rows = await rawAll(store);
    return Promise.all(rows.map((r) => decode(store, r)));
  }
  /* Indizes helfen bei verschlüsselten Datensätzen nicht, deshalb wird nach dem Entschlüsseln gefiltert. */
  async function getBy(store, index, value) {
    return (await getAll(store)).filter((r) => r && r[index] === value);
  }
  /** Unverschlüsselter Eintrag, etwa der Tresor */
  const getPlain = (key) => asPromise(db.transaction('meta').objectStore('meta').get(key));
  const countPlain = (store) => asPromise(db.transaction(store).objectStore(store).count());
  function close() { if (db) db.close(); db = null; }

  /** Führt alle Schreibvorgänge in einer einzigen Transaktion aus. */
  async function apply(rawOps) {
    /* Erst verschlüsseln, dann schreiben: Eine IndexedDB-Transaktion darf nicht auf anderes warten. */
    const ops = await Promise.all(rawOps.map(async (op) => (op.put ? { store: op.store, put: await encode(op.store, op.put) } : op)));
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORES, 'readwrite');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
      ops.forEach((op) => {
        const s = tx.objectStore(op.store);
        if (op.put) s.put(op.put); else s.delete(op.del);
      });
    });
  }

  /**
   * Ersetzt alle Daten atomar: scheitert ein Datensatz, bleibt alles wie zuvor.
   * keep: unverschlüsselte Meta-Einträge, die erhalten bleiben (der Tresor).
   */
  async function replaceAll(data, keep = []) {
    const enc = {};
    for (const name of STORES) {
      const rows = (data[name] || []).filter((r) => !(name === 'meta' && PLAIN_META.has(r.key)));
      enc[name] = await Promise.all(rows.map((r) => encode(name, r)));
    }
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORES, 'readwrite');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
      STORES.forEach((name) => {
        const s = tx.objectStore(name);
        s.clear();
        enc[name].forEach((row) => s.add(row));
      });
      keep.forEach((row) => tx.objectStore('meta').put(row));
    });
  }

  return { open, getAll, getBy, getPlain, countPlain, apply, replaceAll, setCipher, close, STORES };
})();

/* ==========================================================================
   4b TRESOR: App-Passwort, Entsperren, automatische Sperre
   Ein zufälliger Datenschlüssel verschlüsselt alle Daten. Er liegt nur
   verschlüsselt mit dem Passwort in der Datenbank („vault“) und nach dem
   Entsperren als nicht auslesbarer Schlüssel im Arbeitsspeicher.
   ========================================================================== */
App.Vault = (() => {
  const { DB, Crypto, Config } = App;
  const AAD = 'nullpunkt-vault-v1';
  let status = 'none';          // none: noch kein Passwort, locked, open
  let row = null;
  let lastActivity = Date.now();
  const lockHandlers = [];

  async function init() {
    row = await DB.getPlain('vault');
    status = row ? 'locked' : 'none';
  }

  /** Passwort festlegen. Vorhandene unverschlüsselte Daten werden dabei verschlüsselt. */
  async function setup(password) {
    if (status !== 'none') throw new Error('Passwort ist schon gesetzt');
    const data = {};
    for (const s of DB.STORES) data[s] = await DB.getAll(s);
    data.meta = data.meta.filter((m) => m.key !== 'vault');
    const raw = crypto.getRandomValues(new Uint8Array(32));
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const wrapped = await Crypto.seal(await Crypto.kek(password, salt), raw, AAD);
    const next = { key: 'vault', v: 1, kdf: 'PBKDF2-SHA-256', iterations: Crypto.ITER, salt, iv: wrapped.iv, wrapped: wrapped.ct, createdAt: new Date().toISOString() };
    const key = await Crypto.importAes(raw);
    raw.fill(0);
    DB.setCipher(key);
    try {
      await DB.replaceAll(data, [next]);
    } catch (e) {
      DB.setCipher(null);
      throw e;
    }
    row = next;
    status = 'open';
    touch();
  }

  async function unwrap(password) {
    const k = await Crypto.kek(password, row.salt, row.iterations);
    return Crypto.unseal(k, { iv: row.iv, ct: row.wrapped }, AAD);
  }

  /** true bei richtigem Passwort */
  async function unlock(password) {
    let raw;
    try { raw = await unwrap(password); } catch (e) { return false; }
    const key = await Crypto.importAes(raw);
    raw.fill(0);
    DB.setCipher(key);
    status = 'open';
    touch();
    return true;
  }

  /** Neues Passwort: nur der Datenschlüssel wird neu verpackt, die Daten bleiben. */
  async function changePassword(oldPw, newPw) {
    let raw;
    try { raw = await unwrap(oldPw); } catch (e) { return false; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const w = await Crypto.seal(await Crypto.kek(newPw, salt), raw, AAD);
    raw.fill(0);
    const next = { ...row, iterations: Crypto.ITER, salt, iv: w.iv, wrapped: w.ct };
    await DB.apply([{ store: 'meta', put: next }]);
    row = next;
    return true;
  }

  /** Schlüssel verwerfen und alles aus der Anzeige entfernen */
  function lock() {
    if (status !== 'open') return;
    DB.setCipher(null);
    status = 'locked';
    lockHandlers.forEach((f) => f());
  }

  function touch() { lastActivity = Date.now(); }

  /**
   * Sperrt nach einigen Minuten ohne Bedienung. Zeit im Hintergrund zählt mit,
   * geprüft wird spätestens beim Zurückkehren in die App.
   */
  function startAutoLock(minutes) {
    ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach((ev) => addEventListener(ev, touch, { passive: true, capture: true }));
    const check = () => { if (status === 'open' && Date.now() - lastActivity > minutes() * 60000) lock(); };
    setInterval(check, 15000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  }

  /** Löscht die ganze Datenbank auf diesem Gerät. */
  async function wipe() {
    DB.setCipher(null);
    DB.close();
    await new Promise((res) => {
      const r = indexedDB.deleteDatabase(Config.DB_NAME);
      r.onsuccess = r.onerror = r.onblocked = () => res();
    });
  }

  return {
    get status() { return status; }, get row() { return row; },
    init, setup, unlock, lock, changePassword, startAutoLock, wipe, touch,
    onLock: (f) => lockHandlers.push(f),
  };
})();

/* ==========================================================================
   5 REPO: Lesen je Store
   ========================================================================== */
App.Repo = (() => {

    importProfiles: {},

    lastImportAt: {},
    /* Je Sparschwein (lineId): zuletzt gefeierter Meilenstein in Prozent */
    celebrated: {},
    /* Kalender-Erinnerung: Wochentag (0 = Sonntag) und Uhrzeit */
    reminder: { weekday: 0, time: '18:00' },

  async function loadSettings() {

  async function loadSnapshot(account) {

/* ==========================================================================
   6 BUDGET: reine Rechenfunktionen und Datensatz-Bausteine
   ========================================================================== */
App.Budget = (() => {
  const { uid, bySort, sum, addMonths } = App.Utils;
  const Utils = App.Utils;
  const { TEMPLATE } = App.Config;

  const monthId = (accountId, ym) => `${accountId}:${ym}`;
  const monthOf = (snap, ym) => snap.months.find((m) => m.ym === ym) || null;
  const groupsOf = (snap, mid) => snap.groups.filter((g) => g.monthId === mid).sort(bySort);
  const itemsOfGroup = (snap, gid) => snap.items.filter((i) => i.groupId === gid).sort(bySort);
  const itemsOfMonth = (snap, mid) => snap.items.filter((i) => i.monthId === mid);
  const txOfMonth = (snap, mid) => snap.transactions.filter((t) => t.monthId === mid);

  /**
   * Tatsächlicher Betrag je Posten: Summe der Buchungen eines Monats.
   * Entnahmen aus Sparschweinen (type 'withdrawal') zählen hier nicht mit,
   * sie stehen in withdrawalsByItem.
   */
  function actualsByItem(snap, mid) {
    const map = new Map();
    txOfMonth(snap, mid).filter((t) => t.type !== 'withdrawal')
      .forEach((t) => t.splits.forEach((s) => map.set(s.itemId, (map.get(s.itemId) || 0) + s.amountMinor)));
    return map;
  }

  /** Entnahmen je Sparschwein in einem Monat */
  function withdrawalsByItem(snap, mid) {
    const map = new Map();
    txOfMonth(snap, mid).filter((t) => t.type === 'withdrawal')
      .forEach((t) => t.splits.forEach((s) => map.set(s.itemId, (map.get(s.itemId) || 0) + s.amountMinor)));

  /** Übertrag eines Sparschweins: Einzahlungen minus Entnahmen aller früheren Monate */

    let total = 0;
    snap.items.filter((i) => i.lineId === item.lineId).forEach((i) => {
      const m = snap.months.find((x) => x.id === i.monthId);
      if (!m || m.ym >= current.ym) return;
      total += (actualsByItem(snap, m.id).get(i.id) || 0) - (withdrawalsByItem(snap, m.id).get(i.id) || 0);
    });
    return total;

   * Kennzahlen eines Postens.
   * balance: Geplant minus Ist, soll am Monatsende 0 sein.
   * Beim Sparschwein ist actual die Einzahlung dieses Monats, withdrawn die
   * Entnahme dieses Monats und saved der aktuelle Stand inklusive Vormonate.
   */
  function itemFigures(snap, item, actuals) {
    const actual = actuals.get(item.id) || 0;
    const isFund = item.kind === 'fund';
    const opening = isFund ? fundOpening(snap, item) : 0;
    const withdrawn = isFund ? (withdrawalsByItem(snap, item.monthId).get(item.id) || 0) : 0;
    return { planned: item.plannedMinor, actual, opening, isFund, withdrawn, balance: item.plannedMinor - actual, left: item.plannedMinor - actual, saved: opening + actual - withdrawn };
  }

  /**
   * Stand eines Sparschweins im Monat des Postens.
   * saved: tatsächlich eingezahlt, inklusive Vormonate.
   * perMonth: nötige Einzahlung pro Monat ab dem nächsten Monat, aufgerundet auf
   * Rappen/Cent. Die noch offene Einzahlung dieses Monats ist schon eingerechnet.
   * status: none (kein Ziel), reached, open, due (Zielmonat ist jetzt), late (Datum vorbei).
   */
  function piggy(snap, item, actuals) {
    const f = itemFigures(snap, item, actuals);
    const saved = f.saved;
    const projected = saved + Math.max(0, f.balance);
    const goal = item.goalMinor || 0;
    const goalDate = item.goalDate || '';
    const res = { saved, goal, goalDate, pct: 0, missing: 0, monthsLeft: null, perMonth: null, status: 'none' };
    if (goal <= 0) return res;
    res.pct = Math.max(0, Math.min(100, Math.floor((saved * 100) / goal)));
    res.missing = Math.max(0, goal - saved);
    if (res.missing === 0) { res.status = 'reached'; return res; }
    res.status = 'open';
    if (goalDate) {
      const month = snap.months.find((m) => m.id === item.monthId);
      res.monthsLeft = Utils.monthsBetween(month.ym, goalDate.slice(0, 7));
      if (res.monthsLeft < 0) res.status = 'late';
      else if (res.monthsLeft === 0) res.status = 'due';
      else res.perMonth = Math.ceil(Math.max(0, goal - projected) / res.monthsLeft);
    }
    return res;
  }

  /**
   * Nullformel: geplante Einnahmen minus geplante Ausgaben.
   * Übertragene Sparschwein-Beträge zählen bewusst nicht als neues Geld.
   */
  function summary(snap, mid) {
    const groups = groupsOf(snap, mid);
    const typeOf = new Map(groups.map((g) => [g.id, g.type]));
    const items = itemsOfMonth(snap, mid);
    const planned = (type) => sum(items.filter((i) => typeOf.get(i.groupId) === type), (i) => i.plannedMinor);
    const txs = txOfMonth(snap, mid);
    /* Buchungen ohne Posten zählen mit. Einzahlungen in Sparschweine werden getrennt gezählt. */
    const actual = (type) => sum(txs.filter((t) => t.type === type), (t) => t.amountMinor);
    const savingsIds = new Set(items.filter((i) => typeOf.get(i.groupId) === 'savings').map((i) => i.id));
    const savingsActual = sum(txs.filter((t) => t.type === 'expense'), (t) => sum(t.splits.filter((x) => savingsIds.has(x.itemId)), (x) => x.amountMinor));
    const incomePlanned = planned('income');
    const savingsPlanned = planned('savings');
    /* Für die Nullformel zählen geplante Einzahlungen wie Ausgaben: auch sie bekommen eine Aufgabe. */

  /** Quelle für einen neuen Monat: nächster früherer, sonst nächster späterer */
  function sourceMonth(snap, ym) {
    const sorted = [...snap.months].sort((a, b) => a.ym.localeCompare(b.ym));

  function newMonth(accountId, ym) {
    return { id: monthId(accountId, ym), accountId, ym, createdAt: new Date().toISOString(), note: '' };
  }

  /** Kopiert Gruppen und Posten. lineId bleibt, damit Monate verbunden sind. */
  function copyMonth(snap, ym, source, keepAmounts) {
    const accountId = snap.account.id;
    const month = newMonth(accountId, ym);
    const groups = [], items = [];
    groupsOf(snap, source.id).forEach((g) => {
      const ng = { ...g, id: uid(), monthId: month.id };
      groups.push(ng);
      itemsOfGroup(snap, g.id).forEach((i) => {
        items.push({ ...i, id: uid(), monthId: month.id, groupId: ng.id, plannedMinor: keepAmounts ? i.plannedMinor : 0 });
      });
    });
    return { month, groups, items };
  }

  /** Neuer Monat aus der Startvorlage oder nur mit der Einnahmen-Gruppe */
  function freshMonth(accountId, ym, useTemplate) {
    const month = newMonth(accountId, ym);
    const blueprint = useTemplate ? TEMPLATE : [{ name: 'Einnahmen', type: 'income', items: [] }];
    const groups = [], items = [];
    blueprint.forEach((g, gi) => {
      const ng = { id: uid(), accountId, monthId: month.id, lineId: g.type === 'savings' ? `savings:${accountId}` : uid(), name: g.name, type: g.type, sort: gi };
      groups.push(ng);
      g.items.forEach(([name, kind], ii) => {
        items.push({ id: uid(), accountId, monthId: month.id, groupId: ng.id, lineId: uid(), name, sort: ii, plannedMinor: 0, kind: kind || 'normal', goalMinor: 0, goalDate: '', motivation: '' });
      });
    });
    return { month, groups, items };
  }

  /** Passt ein Posten dieser Gruppe zu einer Buchung? Einzahlungen in Sparschweine sind Ausgaben vom Konto. */
  const fitsType = (groupType, txType) => groupType === txType
    || (groupType === 'savings' && (txType === 'expense' || txType === 'withdrawal'));
  const savingsGroup = (snap, mid) => groupsOf(snap, mid).find((g) => g.type === 'savings') || null;

  /** Auswahlliste fürs Buchungsformular, auch für noch nicht angelegte Monate */
  function pickerGroups(snap, ym, type) {
    const month = monthOf(snap, ym) || sourceMonth(snap, ym);
    if (!month) return [];
    const list = groupsOf(snap, month.id).filter((g) => fitsType(g.type, type));
    list.sort((a, b) => (a.type === 'savings') - (b.type === 'savings'));
    return list.map((g) => ({
      name: g.type === 'savings' ? (type === 'withdrawal' ? 'Sparschweine' : 'Sparschweine (Einzahlung)') : g.name,
      items: itemsOfGroup(snap, g.id).map((i) => ({ lineId: i.lineId, name: i.name })),
    }));
  }

  /**
   * Übersetzt [{lineId, amountMinor}] in echte Posten des Zielmonats.
   * Fehlt ein Posten, wird die ganze Buchung zu "nicht zugeordnet",
   * damit die Summe der Aufteilung immer dem Betrag entspricht.
   */

      const item = monthItems.find((i) => i.lineId === s.lineId && fitsType(groupTypeById.get(i.groupId), type));
      if (!item) return [];
      out.push({ itemId: item.id, amountMinor: s.amountMinor });
    }
    return out;
  }

  /**
   * Monatsabschluss: Jede Balance (Geplant minus Ist) muss 0 sein,
   * jede Buchung braucht einen Posten, und Einnahmen minus Budget ergibt 0.
   */
  function closeCheck(snap, mid) {
    const actuals = actualsByItem(snap, mid);
    const open = [];
    groupsOf(snap, mid).forEach((g) => itemsOfGroup(snap, g.id).forEach((i) => {
      const balance = i.plannedMinor - (actuals.get(i.id) || 0);
      if (balance !== 0) open.push({ item: i, group: g, balance });
    }));
    const unassignedCount = unassigned(snap, mid).length;
    const remaining = summary(snap, mid).remaining;
    return { open, unassignedCount, remaining, ok: open.length === 0 && unassignedCount === 0 && remaining === 0 };
  }

  /** Darf der Monat ym begonnen werden? Der letzte frühere Monat muss abgeschlossen sein. */
  function startCheck(snap, ym) {
    if (monthOf(snap, ym)) return { ok: true, prev: null };
    const prev = snap.months.filter((m) => m.ym < ym).sort((a, b) => b.ym.localeCompare(a.ym))[0];
    if (!prev) return { ok: true, prev: null };
    return { ...closeCheck(snap, prev.id), prev };
  }

  /** Mehrere Monate im Vergleich, ältester zuerst */
  function trend(snap, ym, count) {
    const rows = [];
    for (let i = count - 1; i >= 0; i--) {
      const y = addMonths(ym, -i);
      const m = monthOf(snap, y);
      const f = m ? summary(snap, m.id) : { incomeActual: 0, expenseActual: 0 };
      rows.push({ ym: y, income: f.incomeActual, expense: f.expenseActual });
    }
    return rows;
  }

  return { monthId, monthOf, groupsOf, itemsOfGroup, itemsOfMonth, txOfMonth, actualsByItem, withdrawalsByItem, fundOpening, itemFigures, piggy, summary, fitsType, savingsGroup, closeCheck, startCheck, unassigned, sourceMonth, newMonth, copyMonth, freshMonth, pickerGroups, resolveSplits, trend };
})();

/* ==========================================================================
   6b IMPORT: Bankdaten (CSV) lesen, ohne DOM
   Jede Bank exportiert anders. Deshalb wird erkannt, was geht (Trennzeichen,
   Kopfzeile, Spalten), und der Rest lässt sich im Formular zuordnen.
   ========================================================================== */
App.Importer = (() => {
  const { Utils } = App;

  /** Dateiinhalt als Text: UTF-8, sonst Windows-1252 (bei Schweizer Banken häufig) */
  function decode(buffer) {
    let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
    catch (e) { text = new TextDecoder('windows-1252').decode(buffer); }
    return text.replace(/^﻿/, '');
  }

  function countOutsideQuotes(line, d) {
    let q = false, n = 0;
    for (const ch of line) { if (ch === '"') q = !q; else if (ch === d && !q) n++; }
    return n;
  }

  /** Trennzeichen mit der stabilsten Spaltenzahl über die ersten Zeilen */
  function detectDelimiter(text) {
    const lines = text.split(/\r?\n/).slice(0, 40);
    let best = ';', score = -1;
    for (const d of [';', ',', '\t', '|']) {
      const counts = lines.map((l) => countOutsideQuotes(l, d)).filter((n) => n > 0);
      if (!counts.length) continue;
      const freq = new Map();
      counts.forEach((n) => freq.set(n, (freq.get(n) || 0) + 1));
      const [n, f] = [...freq].sort((a, b) => b[1] - a[1])[0];
      const sc = f * Math.min(n, 12);
      if (sc > score) { score = sc; best = d; }
    }
    return best;
  }

  /** CSV nach RFC 4180, mit Anführungszeichen und Zeilenumbrüchen in Feldern */
  function parseCsv(text, d) {
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === d) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

  /** 31.12.2026, 31.12.26, 2026-12-31, 31/12/2026, auch mit Uhrzeit dahinter */
  function parseDate(s) {
    const t = String(s || '').trim().split(/[ T]/)[0];
    let m = t.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2}|\d{4})$/);
    let y, mo, d;
    if (m) { d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; }
    else if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else return null;
    const iso = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    return Utils.isValidDate(iso) ? iso : null;

  /**
   * Betrag aus der Bankdatei in Rappen/Cent, mit Vorzeichen.
   * Versteht 1'234.50, 1.234,50, -12.5, 12.50-, (12.50), CHF 12.50.

  function parseAmount(s) {
    let t = String(s || '').trim();
    if (!t) return null;
    let neg = false;
    if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
    t = t.replace(/(CHF|EUR|€|Fr\.)/gi, '').replace(/[\s  '’]/g, '');
    if (/^[-−–]/.test(t)) { neg = !neg; t = t.slice(1); }
    if (/[-−–]$/.test(t)) { neg = !neg; t = t.slice(0, -1); }
    if (t.startsWith('+')) t = t.slice(1);
    if (!/^[\d.,]+$/.test(t) || !/\d/.test(t)) return null;
    const lastDot = t.lastIndexOf('.'), lastComma = t.lastIndexOf(',');
    const dec = Math.max(lastDot, lastComma);
    let whole = t, frac = '';
    if (dec >= 0) {

      const both = lastDot >= 0 && lastComma >= 0;

  /** Spaltenbeschriftungen. Ohne Kopfzeile: „Spalte 1“ usw. */
  function headerLabels(rows, headerIdx) {

    const head = headerIdx >= 0 ? rows[headerIdx] : [];

  }

  /** Schlägt eine Zuordnung der Spalten vor */
  function guess(rows, headerIdx) {
    const labels = headerLabels(rows, headerIdx);
    const H = labels.map((x) => x.toLowerCase());
    const sample = rows.slice(headerIdx + 1, headerIdx + 21);
    const rate = (i, f) => sample.filter((r) => f(r[i] || '')).length / Math.max(1, sample.length);
    const isNum = (v) => parseAmount(v) !== null && !parseDate(v);

    if (text < 0) {
      let bestLen = -1;
      H.forEach((_, i) => {
        if (i === date || rate(i, isNum) > 0.5) return;
        const len = sample.reduce((s, r) => s + (r[i] || '').length, 0);
        if (len > bestLen) { bestLen = len; text = i; }

  /**
   * Entfernt Bankdaten aus Buchungstexten, bevor sie gespeichert werden:
   * IBAN, Kartennummern (auch maskierte) und lange Referenz- oder Telefonnummern.
   * Namen lassen sich nicht zuverlässig erkennen und bleiben stehen.
   */
  function sanitize(text) {

      .replace(/\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,3})?\b/gi, '[IBAN]')
      .replace(/(?:[X*•]{4}[ -]?){3}\d{4}\b/gi, '[Karte]')
      .replace(/\b\d(?:[ -]?\d){11,18}\b/g, '[Karte]')
      .replace(/\b\d(?: ?\d){8,}\b/g, '[Nummer]')
      .replace(/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])[A-Z0-9]{12,}\b/gi, '[Nummer]')
      .replace(/(\[(?:IBAN|Karte|Nummer)\])(?:[\s,;:/-]*\1)+/g, '$1')
      .replace(/\s+/g, ' ').trim();
  }

  /** Wendet die Zuordnung an. Zeilen ohne Datum oder Betrag (etwa Saldozeilen) werden übersprungen. */
  function apply(rows, headerIdx, m) {

    let skipped = 0;

      if (m.mode === 'split') {
        const d = parseAmount(r[m.debit]), c = parseAmount(r[m.credit]);

  const signature = (labels) => labels.map((x) => x.toLowerCase().trim()).join('|');

  const NOISE = new Set(['einkauf', 'kauf', 'zahlung', 'kartenzahlung', 'debitkarte', 'debit', 'karte', 'twint', 'lastschrift', 'belastung', 'gutschrift', 'ebanking', 'banking', 'auftrag', 'dauerauftrag', 'pos', 'vom', 'am', 'in', 'bei', 'mastercard', 'visa', 'maestro', 'nr', 'ch', 'online', 'und', 'der', 'die', 'das', 'sepa', 'uberweisung', 'ueberweisung', 'zugunsten', 'giro', 'bancomat', 'kartennummer', 'card']);

  /** Kurzer Schlüssel für einen Händler, z. B. „Kartenzahlung COOP-1234 Bern“ → „coop bern“ */

  function sampleCsv(ym, today) {

      [1, 'Dauerauftrag Liegenschaftsverwaltung Miete', '1850.00', ''],

      [4, 'Kartenzahlung Bäckerei Sonnenblick', '8.60', ''],
      [5, 'Kartenzahlung Apotheke am Platz', '23.90', ''],
      [7, 'TWINT Pizzeria Bella', '32.00', ''],
      [9, 'Kartenzahlung Supermarkt Seefeld', '61.35', ''],
      [10, 'Gutschrift Nachhilfe Familie Meier CH93 0076 2011 6238 5295 7', '', '120.00'],
      [11, 'Kartenzahlung Velowerkstatt Speiche Karte XXXX XXXX XXXX 4821', '74.00', ''],
      [12, 'Kartenzahlung Kino Lichtspiel', '19.00', ''],

    const lines = ['Kontoauszug;Privatkonto Demo-Bank', 'IBAN;CH00 0000 0000 0000 0000 0', '', 'Buchungsdatum;Valuta;Buchungstext;Belastung;Gutschrift;Saldo'];
    rows.forEach(([d, text, deb, cred]) => {

      const date = `${String(d).padStart(2, '0')}.${m}.${y}`;
      lines.push(`${date};${date};"${text}";${deb};${cred};${(saldo / 100).toFixed(2)}`);
